name: Build HOI4 Country, Focus and Tech Editors
on:
  workflow_dispatch:
  push:
    paths: ['tools/hoi4_country_editor/**']
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/hoi4_country_editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pillow
      - run: python test_core.py
      - run: python test_focus.py
      - run: python test_tech.py
      - run: pyinstaller --onefile --windowed --name HOI4CountryEditor hoi4_country_editor.py
      - run: pyinstaller --onefile --windowed --name HOI4FocusEditor hoi4_focus_editor.py
      - run: pyinstaller --onefile --windowed --name HOI4TechEditor hoi4_tech_editor.py
      - uses: actions/upload-artifact@v4
        with:
          name: HOI4CountryEditor
          path: tools/hoi4_country_editor/dist/*.exe

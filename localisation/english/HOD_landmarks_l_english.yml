l_english:
 HOD_landmark_raxulon_parliament:0 "Parliament of Raxulon"
 HOD_landmark_raxulon_parliament_desc:0 "The domed parliament of Raxulon, raised in the days when Raxus was a quiet, wealthy world of gardens far from the Core. Its chamber has become the Separatist Senate: delegates of the systems that broke with the Republic under Count Dooku sit here, draft the laws of the Confederacy of Independent Systems and debate, still in earnest, whether their secession can be won with words alone."
 HOD_landmark_great_alley:0 "The Great Alley of Raxulon"
 HOD_landmark_great_alley_desc:0 "The tree-lined processional avenue that leads to the parliament, planted with Raxus' golden-crowned trees generations ago. Delegates arriving from across the Outer Rim walk it to their first session; Raxulon's people gather along it to cheer them, and to remind them who they speak for."
 HOD_landmark_rp_refinery:0 "The Sienar Refinery"
 HOD_landmark_rp_refinery_desc:0 "A vast reclamation plant that once melted the junk of half the galaxy back into usable metal. Its owners left long ago; scavenger clans and Jawa crews have kept its furnaces lit ever since, selling ingots to anyone who lands with credits, and asking no questions about which side of the Senate's quarrel they serve."
 HOD_landmark_rp_derriphan:0 "Wreck of a Derriphan Battleship"
 HOD_landmark_rp_derriphan_desc:0 "The broken halves of a Derriphan-class battleship, a capital ship from the wars of the Old Republic thousands of years ago. How it came to rest on Raxus Prime no record says; scavengers have been cutting plates from its hull for longer than anyone living remembers, and there is still more ship than scrap."
 HOD_landmark_rp_hammerhead:0 "Wreck of a Hammerhead Cruiser"
 HOD_landmark_rp_hammerhead_desc:0 "A Hammerhead-class cruiser, the workhorse of the Republic Navy in the age of the Old Republic, broken in two and half buried in the junk. Its armoured prow still points at the sky. Salvagers say its reactor cores were never found."
 HOD_landmark_rp_lethisk:0 "Wreck of a Lethisk Freighter"
 HOD_landmark_rp_lethisk_desc:0 "The rusting hulk of an old Lethisk-class armed freighter, the kind smugglers and privateers flew when the Old Republic was young. Every scavenger crew on Raxus Prime claims to have found its hidden cargo hold; none of them can say what was in it."
 HOD_landmark_rp_droidworks:0 "The Droidworks"
 HOD_landmark_rp_droidworks_desc:0 "An automated droid foundry buried in the scrap, still assembling droids from salvage for masters who stopped giving it orders long ago. Lately, quiet buyers from the Techno Union have been seen studying its lines."
 HOD_landmark_sith_academy:0 "The Sith Academy"
 HOD_landmark_sith_academy_desc:0 "Carved into the rock above Dreshdae, the academy trained the Sith of age after age: the followers of Exar Kun, Darth Revan's legions, the acolytes of every Sith empire that rose and fell. Since the Sith Order destroyed itself at Ruusan a thousand years ago its halls stand empty, stripped by tomb robbers. The Republic forbids landings, and Dreshdae's few settlers will not go near it after dark."
 HOD_landmark_valley_dark_lords:0 "The Valley of the Dark Lords"
 HOD_landmark_valley_dark_lords_desc:0 "A canyon of tombs where the ancient Sith buried their kings and Dark Lords, its way lined with obelisks and colossal statues of the dead. The dark side clings to the stone; travellers report voices, cold winds out of nowhere and lost hours. Archaeologists of the Republic have mapped it twice. Neither expedition came back whole."
 HOD_landmark_tomb_ragnos:0 "Tomb of Marka Ragnos"
 HOD_landmark_tomb_ragnos_desc:0 "The tomb of Marka Ragnos, Dark Lord of the Sith some five thousand years ago, whose death set Naga Sadow and Ludo Kressh at each other's throats and opened the way to the Great Hyperspace War. Legend holds that his spirit has spoken from it to more than one would-be Sith Lord."
 HOD_landmark_tomb_sadow:0 "Tomb of Naga Sadow"
 HOD_landmark_tomb_sadow_desc:0 "The tomb raised for Naga Sadow, the Dark Lord who led the old Sith Empire into the Great Hyperspace War against the Republic and lost it. His followers sealed it with traps no robber has fully mapped."
 HOD_landmark_tomb_pall:0 "Tomb of Ajunta Pall"
 HOD_landmark_tomb_pall_desc:0 "The tomb of Ajunta Pall, one of the exiled Dark Jedi who came to Korriban nearly seven thousand years ago and made himself the first Dark Lord of the Sith. His sword is said to lie with him still."
 HOD_landmark_tomb_hord:0 "Tomb of Tulak Hord"
 HOD_landmark_tomb_hord_desc:0 "The tomb of Tulak Hord, the Dark Lord remembered as the greatest warrior of the ancient Sith, who never lost a battle he chose to fight. His masks and the secrets of his techniques were buried with him."
 HOD_landmark_tomb_kressh:0 "Tomb of Ludo Kressh"
 HOD_landmark_tomb_kressh_desc:0 "The tomb of Ludo Kressh, Naga Sadow's rival for the throne of the Sith, who fought him for the Empire and died in the attempt. Its plainer stones tell the story: the victors built it."
 HOD_landmark_kadavo_facility:0 "Kadavo Processing Facility"
 HOD_landmark_kadavo_facility_desc:0 "The tower-fortress where the Zygerrian Slave Empire once processed captives by the thousand before they were sold. The Jedi broke that empire long ago and the facility fell silent - officially. In Kadavo's smog its holding pens still fill and empty, discreetly, while Zygerrian nobles speak again of the glory of the old trade."
 HOD_landmark_kadavo_landing:0 "Slaver Landing Field"
 HOD_landmark_kadavo_landing_desc:0 "The landing field where the slavers' ships set down their cargo. Its beacons are kept dark; ships come and go without flight plans, and no Republic patrol has ever asked why."
 HOD_landmark_kadavo_pits:0 "Kadavo Ore Pits"
 HOD_landmark_kadavo_pits_desc:0 "Open pits in the ash where captives too weak to sell are put to work digging ore. Their output pays for the facility's upkeep; their dead are buried in the ash."
 HOD_landmark_kadavo_camps:0 "Slave Camp"
 HOD_landmark_kadavo_camps_desc:0 "A fenced camp of prefab huts out on the ash, where captives wait to be processed under the watch of Zygerrian overseers and their droids."
 HOD_landmark_hondo_complex:0 "Hondo's Complex"
 HOD_landmark_hondo_complex_desc:0 "The fortified lair of Hondo Ohnaka's Weequay pirate gang, a sprawl of hangars, cantinas and treasure rooms on Florrum's sulfur plains. Hondo deals with whoever pays - smugglers, the Hutts, Republic and Separatist alike - and is in no hurry to choose a side in the Senate's quarrel while both still have credits."
 HOD_landmark_florrum_refinery:0 "Sulfur Refinery"
 HOD_landmark_florrum_refinery_desc:0 "A sulfur refinery abandoned by a mining concern that left Florrum in a hurry; the pirates moved in and kept it running. Its fumes can be smelled three canyons away."
 HOD_landmark_florrum_outposts:0 "Weequay Outpost"
 HOD_landmark_florrum_outposts_desc:0 "A lookout post of the Ohnaka gang: a few prefab domes, a sensor mast and a landing pad, manned by Weequay who watch the sky for rivals, bounty hunters and anyone worth robbing."
 HOD_landmark_hondo_vault:0 "Hondo's Vault"
 HOD_landmark_hondo_vault_desc:0 "A vault cut deep into the Eastern Shelf where Hondo Ohnaka keeps the spoils he does not trust even his own crew with. Every pirate on Florrum knows it exists; none admit to knowing the way in."
 HOD_landmark_florrum_junk:0 "Hulks of the Junk Market"
 HOD_landmark_florrum_junk_desc:0 "The stripped hulks of an old cruiser and an armed freighter, dragged to Florrum as prizes and now the heart of the Weequay junk market, where anything with a price changes hands."
 HOD_landmark_kaas_citadel:0 "Ruins of the Imperial Citadel"
 HOD_landmark_kaas_citadel_desc:0 "The black citadel from which the Sith Emperor ruled the reborn Sith Empire for more than a thousand years. The Empire is long dead and Kaas City lies in ruins, swallowed by the storm jungle, but the Citadel's tower still stands above the trees, and lightning strikes it more often than anything else on the planet."
 HOD_landmark_dark_temple:0 "The Dark Temple"
 HOD_landmark_dark_temple_desc:0 "An ancient Sith temple older than Kaas City itself, where the Emperor is said to have performed his darkest rites. The dark side pools here so thickly that the planet's endless storms seem to circle it."
 HOD_landmark_zyg_palace:0 "Royal Palace of Zygerria"
 HOD_landmark_zyg_palace_desc:0 "The palace of the Zygerrian kings and queens, raised on its mesa when Zygerria ruled a slave empire. Queen Miraj Scintel holds court here, among nobles who have never forgiven the Jedi for ending the old trade and who watch the Republic's troubles with growing interest."
 HOD_landmark_zyg_arena:0 "Royal Arena"
 HOD_landmark_zyg_arena_desc:0 "The great arena beside the palace, where slaves were once auctioned before the assembled nobility. Today it hosts games and beast fights; the auction block has never been taken down."
 HOD_landmark_zyg_fortress:0 "Mesa Fortress"
 HOD_landmark_zyg_fortress_desc:0 "An old stronghold of the Zygerrian nobility on a mesa top, reached by a single ramp. Built to hold down the provinces in the days of the empire, it is kept garrisoned out of habit - and out of hope."
 HOD_landmark_zyg_landing:0 "Slavers' Landing"
 HOD_landmark_zyg_landing_desc:0 "The landing platforms from which the slave ships of the Zygerrian Empire once departed. Merchant ships use them now, but the cargo cranes still bear the royal slave-mark."
 HOD_landmark_westhill_palace:0 "Westhill Palace"
 HOD_landmark_westhill_palace_desc:0 "A palatial mansion on the Westhill cliffs above Canto Bight, home to the richest of the families who built the casino city on Cantonica's artificial sea. Arms dealers from both sides of the Separatist crisis are welcome at its tables, as long as they lose gracefully."
 HOD_landmark_bonadan_spaceport:0 "Spaceport Southeast II"
 HOD_landmark_bonadan_spaceport_desc:0 "The largest of Bonadan's ten spaceports, a ring of landing pads, hangars and cargo halls through which the ore and machinery of the Corporate Sector's foremost industrial world pour out to the galaxy."
 HOD_landmark_bonadan_shipyards:0 "Bonadan Shipyards"
 HOD_landmark_bonadan_shipyards_desc:0 "Orbital yards ringing Bonadan's eastern sky, rated Class IB and able to build ships up to cruisers. Their slips turn out hulls for the Corporate Sector Authority and for any buyer with credits - and since the Separatist crisis began, the order books have never been fuller."
 HOD_landmark_bonadan_weather:0 "Weather Control Station"
 HOD_landmark_bonadan_weather_desc:0 "A massive weather-control station in the mountains north of the main cities. Its emitter masts raise the sweeper storms that scour Bonadan's polluted air; without them the factory cities would choke within a season."
 HOD_landmark_pammant_docks:0 "Pammant Docks"
 HOD_landmark_pammant_docks_desc:0 "A ring-shaped shipyard in orbit over Pammant, run by the Quarren of the Free Dac Volunteers Engineering Corps. Since the Quarren sided with Count Dooku its berths hold Providence-class carriers built for the Trade Federation - and, clamped in the great cradle across the ring, a hull far larger than any of them, whose purpose the Quarren will not discuss."
 HOD_landmark_pammant_liftport:0 "QFD Lift Port"
 HOD_landmark_pammant_liftport_desc:0 "The heavy-lift spaceport of the Free Dac Volunteers Engineering Corps. Hull sections forged in the Quarren foundries below arrive by rail, wait on its great hexagonal pads and are hauled up by lifter tugs to the docks in orbit. Republic agents counting the sections lifted have reported more steel than any known warship needs; none of those reports has yet reached Coruscant."
 HOD_landmark_pammant_tessar:0 "Tessar Deep"
 HOD_landmark_pammant_tessar_desc:0 "The capital of Pammant's Quarren colony: rounded towers rising from the mouth of the colony's main shaft, the city's real bulk lying in the warrens below. Its engineers have built starships for generations; now their Isolation League speaks for the Confederacy."
 HOD_landmark_mcl_coral_city:0 "Coral City"
 HOD_landmark_mcl_coral_city_desc:0 "The capital of Mon Cala, its shell domes and spires grown over a living reef and lit gold through the water. From the royal palace at its heart King Yos Kolina rules both peoples of the ocean world, a union the Mon Calamari hold sacred and the Quarren increasingly call a cage."
 HOD_landmark_mcl_drome:0 "Moncaladrome"
 HOD_landmark_mcl_drome_desc:0 "The great opera house of Mon Cala, three shell vaults whose ribbed halls carry song through the water as well as the air. Its seasons are the pride of Coral City's society; Quarren rarely attend."
 HOD_landmark_mcl_quarren_hq:0 "Quarren Headquarters"
 HOD_landmark_mcl_quarren_hq_desc:0 "The seat of the Quarren in the depths of Quarren Town: dark towers on a rock mound, their war room sealed to Mon Calamari envoys. Separatist agents have been seen coming and going, and the Isolation League now meets here in the open."
 HOD_landmark_ieg_cliffhold:0 "Cliffhold"
 HOD_landmark_ieg_cliffhold_desc:0 "A spaceport city cut straight into the face of a basalt cliff, its landing pads jutting from the rock over the desert. Once loud with spice convoys, it has grown quiet since the convoys stopped coming; the Iegoans who remain say the world of a thousand moons does not let its people leave."
 HOD_landmark_ieg_laserweb:0 "LaserWeb Defense Station"
 HOD_landmark_ieg_laserweb_desc:0 "A Separatist station hung in orbit over Iego by engineers who came as advisers. Its six emitter pods can wrap the sky in a web of laser fire that no ship escapes; for now it only watches, and the Iegoans have begun to wonder who it is meant to keep in."
 HOD_landmark_ieg_choir:0 "Choir Alignment"
 HOD_landmark_ieg_choir_desc:0 "A sunken valley a hundred metres across, shaped like a nine-pointed star and plainly not made by nature. Those who stand at its centre say they hear a choir singing; no one knows who carved it, or when."
 HOD_landmark_ieg_boneyard:0 "The Boneyard"
 HOD_landmark_ieg_boneyard_desc:0 "The largest of Iego's bone piles, north of the Scatter: the skeletons of creatures far larger than any that live on the planet now, ribs arching over the sand like the frames of buildings."
 HOD_landmark_lia_hq:0 "Santhe/Sienar Headquarters"
 HOD_landmark_lia_hq_desc:0 "The towers of Santhe/Sienar Technologies over Lianna City, seat of Sienar, Curich Engineering and Santhe Passenger and Freight. Valles Santhe runs the planet from its crown as much as any government does; the Republic buys Sienar's ships, and Lianna intends to stay rich and independent whatever the coming war brings."
 HOD_landmark_lia_academy:0 "Melford Star Academy"
 HOD_landmark_lia_academy_desc:0 "The First Star Academy on Anai's northern coast, where the Tion Cluster's pilots and officers have trained for generations under its great ribbed dome."
 HOD_landmark_lia_skycity:0 "Sky City"
 HOD_landmark_lia_skycity_desc:0 "A city of decks on a single tapering stalk, raised over the Shaltin Strait so the sea lanes run beneath it."
 HOD_landmark_lia_shipyard:0 "Lianna Shipyards"
 HOD_landmark_lia_shipyard_desc:0 "Sienar's orbital yards over Lianna, rated Class IB and able to build cruisers. Couriers, patrol cruisers and freighters leave their slips for buyers across the Republic and beyond."
 HOD_landmark_jab_choal:0 "Choal"
 HOD_landmark_jab_choal_desc:0 "Jabiim's capital, raised on its great drum platform above the floods, its rain houses on stilts and its council hall loud with argument: the Nationalists want out of the Republic, the loyalists want its help, and the rain never stops for either."
 HOD_landmark_jab_bore:0 "Jobreth Bore"
 HOD_landmark_jab_bore_desc:0 "One of the huge boring machines cutting ever deeper into the dying planet, its drill grinding down into a stepped pit on the Jobreth Plains while its conveyor builds a hill of spoil."
 HOD_landmark_jab_shelter:0 "Shelter Base"
 HOD_landmark_jab_shelter_desc:0 "A Republic command post of prefab domes on the northern fens, put up as Jabiim slid towards secession; its gunships wait on their pads for weather that rarely lets them fly."
 HOD_landmark_jab_cobalt:0 "Cobalt Station"
 HOD_landmark_jab_cobalt_desc:0 "A Republic fortification just north of Monsoon Mesa: a curved rampart, four heavy turrets and a shield generator, built to hold the high ground if the planet goes over to the Separatists."
 HOD_landmark_jab_aurek:0 "Camp Aurek"
 HOD_landmark_jab_aurek_desc:0 "A Separatist camp in the south-eastern badlands, raised quietly by Confederate 'advisers' to the Nationalists: a droid-control spire, racks of folded battle droids and a transport ready to unload more."
 HOD_landmark_jab_shear:0 "Outpost Shear"
 HOD_landmark_jab_shear_desc:0 "Stone bunkers and trenches on the north-eastern ridges, held by the Nationalists' militia. Its guns point at the Republic's mesa."
 HOD_landmark_sal_taleucema:0 "Taleucema"
 HOD_landmark_sal_taleucema_desc:0 "The capital of Saleucami, its towers joined by tall arcing bridges over the domed assembly hall. The Techno Union's money built the bridges; the Union's agents now sit in the hall."
 HOD_landmark_sal_spaceport:0 "Saleucami Town"
 HOD_landmark_sal_spaceport_desc:0 "A dusty spaceport town of landing bowls and billboards on the eastern plains, where the freighters of the Outer Rim put in for water and parts."
 HOD_landmark_sal_lawquane:0 "Lawquane Farmstead"
 HOD_landmark_sal_lawquane_desc:0 "A domed adobe farm in the wetlands, its crop rows ringed by a fence. Its family keeps to itself, as the wetland farmers always have."
 HOD_landmark_sal_cloning:0 "Saleucami Cloning Complex"
 HOD_landmark_sal_cloning_desc:0 "A secret installation in the Magma Caverns, its glass tanks lit by the lava below. The Separatists who built it say nothing of what grows in them."
 HOD_landmark_tel_thani:0 "Thani"
 HOD_landmark_tel_thani_desc:0 "The capital of Telos, rebuilt tower by tower after Malak's bombardment some four thousand years ago until the city covered the world. The Telosian Council and the Governor sit in the domed hall below the towers, the Chodo Habat Parkway carries the capital's traffic past its doors, and the Council has voted to join the Confederacy."
 HOD_landmark_tel_terminal:0 "Thani Terminal"
 HOD_landmark_tel_terminal_desc:0 "Thani's spaceport, a vaulted terminal hall with round docking bays on its landing side. Since the vote for secession, Separatist freighters and couriers outnumber the Republic liners that once filled them."
 HOD_landmark_tel_academy:0 "Telos Polar Academy"
 HOD_landmark_tel_academy_desc:0 "A hidden school in the polar ice, built by the Jedi Master Atris after the Jedi Civil War and empty for millennia. Its round council chamber, laid out like the Jedi Council's on Coruscant, still stands under the snow; the Jedi know where it is, the Separatist governors do not."
 HOD_landmark_tel_caverns:0 "Mirror Caverns"
 HOD_landmark_tel_caverns_desc:0 "Caves in a forest glade high in the snow-capped mountains, lined with malab, a rare black mineral so slick and lustrous that first-time visitors lose their footing in the shimmering dark. Prospectors quarry it under licence from the Council."
 HOD_landmark_tel_rz:0 "RZ-0031"
 HOD_landmark_tel_rz_desc:0 "The first Restoration Zone, where the Ithorians brought Telos's poisoned land back to life behind shield walls. Its beaches, canyons and grassland of blba trees and blue bachani flowers are kept as a reserve in the middle of the city, and its old shield pylons and air defense tower as monuments."
 HOD_landmark_ser_carannia:0 "Carannia"
 HOD_landmark_ser_carannia_desc:0 "The capital of Serenno, an old city of pale stone and slate spires among golden forests, rich from the fortunes of the Great Houses. Its Count, Dooku, left the Jedi Order, took back his family's title and wealth, and now speaks for the Confederacy of Independent Systems from his own homeworld."
 HOD_landmark_ser_assembly:0 "Great Assembly House"
 HOD_landmark_ser_assembly_desc:0 "The domed hall of Serenno's Planetary Council in Carannia, where the noble houses debate under a dome ribbed in gold. The Council long ago gave its loyalty to the Count; its votes for secession were never close."
 HOD_landmark_ser_castle:0 "Castle Serenno"
 HOD_landmark_ser_castle_desc:0 "The ancestral seat of House Serenno on the edge of a cliff over the valley of Serenno City. Count Dooku has made it his headquarters: Separatist envoys land on its platform, and those who enter its halls do not always leave them."
 HOD_landmark_ser_borgin:0 "Borgin Castle"
 HOD_landmark_ser_borgin_desc:0 "A hill castle of one of Serenno's lesser houses in the Upper Forest, its curtain wall and slate towers older than the Republic's hold on the sector. Its lords keep their household guard and pay their dues to the Count."
 HOD_landmark_ser_spike:0 "The Spike"
 HOD_landmark_ser_spike_desc:0 "An inverted cone of cells sunk deep into the rock of the Aparian Wastes, built by the Confederacy for prisoners too valuable to kill and too dangerous to keep anywhere else. Officially it does not exist."
 HOD_landmark_yav_temple:0 "Great Temple"
 HOD_landmark_yav_temple_desc:0 "The greatest of the Massassi temples, a stepped ziggurat of grey stone rising above the jungle canopy, raised for the Sith four thousand years ago and left to the vines when its builders died out. A Separatist survey team has marked its hollow halls as a possible base."
 HOD_landmark_yav_exarkun:0 "Temple of Exar Kun"
 HOD_landmark_yav_exarkun_desc:0 "A dark stepped pyramid crowned by an obelisk, built by the enslaved Massassi for the Sith Lord Exar Kun. Spacers say a red light still burns in its spire at night, and the few who camp near it do not stay long."
 HOD_landmark_yav_borundi:0 "Borundi Peak"
 HOD_landmark_yav_borundi_desc:0 "A sleeping volcano over Yavin IV's north-eastern highlands, its slopes broken by old lava spurs and a Massassi shrine climbing its southern flank. Its rivers feed the jungle below."
 HOD_landmark_cel_city:0 "Celanon City"
 HOD_landmark_cel_city_desc:0 "A sprawl of nearly two hundred square kilometres on Cekbar and one of the great markets of the Outer Rim, governed by its trade guilds from the towers round the exchange. The guilds took the Confederacy's side when its tariffs promised to be lower than the Republic's."
 HOD_landmark_cel_control:0 "Spaceport Control"
 HOD_landmark_cel_control_desc:0 "A tower of nearly 140 storeys in the Celanon Spaceport, whose controllers route every ship in orbit so that the Spur's traffic never collides. Whoever holds the tower holds the planet's sky lanes."
 HOD_landmark_cel_hospital:0 "Merchant Guild Medical Facility"
 HOD_landmark_cel_hospital_desc:0 "The Merchant Guild's hospital near the starport, where spacers off every ship that lands are patched up, for a price the Guild sets."
 HOD_landmark_cel_gularg:0 "Gularg's Libation Emporium"
 HOD_landmark_cel_gularg_desc:0 "Gularg the Hutt's tavern, held to be the rowdiest, seediest and most dangerous in Celanon City. Smugglers, bounty hunters and both sides' informants drink under the same dome."
 HOD_landmark_bot_palace:0 "Governor's Palace"
 HOD_landmark_bot_palace_desc:0 "The planetary governor's seat, raised on a steel podium above the smog of the works. The yards' owners dictate its policy, and they have chosen the Confederacy's contracts."
 HOD_landmark_bot_elevator:0 "Space Elevator"
 HOD_landmark_bot_elevator_desc:0 "Cables 325 kilometres long climb from this anchor station to the yards in orbit, carrying hull plate and machinery up by the thousand tonnes every day."
 HOD_landmark_bot_yards:0 "Botajef Shipyards"
 HOD_landmark_bot_yards_desc:0 "Botajef Shipyards, builders of the AA-9 Coruscant freighter and the SS-54 light freighter. Hulls are framed in the slips of the orbital yards at the top of the elevator and fitted out in the starship works of the southern continent. Their freighter lines are being refitted for Separatist logistics."
 HOD_landmark_bot_northbase:0 "North-Polar Base"
 HOD_landmark_bot_northbase_desc:0 "A sensor and communications base on the northern ice, listening to the traffic of the Celanon Spur."
 HOD_landmark_bot_southbase:0 "South-Polar Base"
 HOD_landmark_bot_southbase_desc:0 "A base in the south-polar region where the shipyards test drives and weapons far from the works."
 HOD_landmark_axx_capital:0 "Axxila City"
 HOD_landmark_axx_capital_desc:0 "The heart of a metropolis that has spread over the whole of Axxila's cliffs, its terraces stepping down the rock faces and its towers crowding the heights. Its council followed the Ciutric Hegemony into the Confederacy; the Free Axxilans who refused have left for Halmad."
 HOD_landmark_axx_fossfog:0 "Fossfog's"
 HOD_landmark_axx_fossfog_desc:0 "A stone cantina under a neon sign whose wine cellar hides an underworld bounty feed. Hunters come from across the D'Astan sector to read it."
 HOD_landmark_axx_oreport:0 "Ore Terminal"
 HOD_landmark_axx_oreport_desc:0 "Where Axxila's ores leave the planet: silos, conveyors and bulk freighters loading day and night for the Hegemony's foundries."
 HOD_landmark_cit_daplona:0 "Daplona"
 HOD_landmark_cit_daplona_desc:0 "The capital of Ciutric IV and of the Hegemony, its finned towers rising over the Daplona River. The Shine Astara, one of its most exclusive restaurants, turns slowly near the top of the tallest; deals for the Confederacy are made at its tables."
 HOD_landmark_cit_training:0 "Daplona Base Training Center"
 HOD_landmark_cit_training_desc:0 "The Hegemony's training base outside Daplona: barracks round a drill field, an obstacle course and a firing range, where the Hegemony's levies learn to fight beside the droid armies."
 HOD_landmark_cit_prison:0 "Ciutric IV Prison"
 HOD_landmark_cit_prison_desc:0 "A walled prison on a rocky rise below the highlands, where the Hegemony keeps those who argued against secession."
 HOD_landmark_cit_mansion:0 "Bane's Mansion"
 HOD_landmark_cit_mansion_desc:0 "A dark stone manor deep in the southern forest, kept a thousand years ago by Darth Bane. Its owners since have all sold it quickly, and the window at the top of its tower is never dark."
 HOD_landmark_ces_chikatlik:0 "ChikatLik"
 HOD_landmark_ces_chikatlik_desc:0 "The capital of Ord Cestus, grown round the great hive spires of the X'Ting. Offworlders run its droid trade from the lower town while the hive queens keep the spires; both are courted by the Confederacy."
 HOD_landmark_ces_cybernetics:0 "Cestus Cybernetics"
 HOD_landmark_ces_cybernetics_desc:0 "The droid maker that made Ord Cestus rich. Its JK-series security droids, too clever for their makers' comfort, sell to anyone who can pay, and the Separatists pay best."
 HOD_landmark_ces_penitentiary:0 "Cestus Penitentiary"
 HOD_landmark_ces_penitentiary_desc:0 "Built by the Republic in 321 BBY on land the X'Ting gave, its cell blocks reach down under Kibo Lake. The Kibo Geothermal Station on the shore powers it."
 HOD_landmark_ces_jantos:0 "Jantos"
 HOD_landmark_ces_jantos_desc:0 "Ord Cestus' second city, terraced up a red butte with hive spires on its crest."
 HOD_landmark_ces_droidworks:0 "Cestus Droid Works"
 HOD_landmark_ces_droidworks_desc:0 "Foundries and assembly halls at Clandes, where droid shells come off the lines by the thousand for Cestus Cybernetics and its rivals."
 HOD_landmark_ces_fungus:0 "Barrens Fungus Farms"
 HOD_landmark_ces_fungus_desc:0 "Grow vaults and fungus pits round Barrens, raising the fungi Ord Cestus sells offworld beside its droids."
 HOD_landmark_dat_lair:0 "Nightsister Lair"
 HOD_landmark_dat_lair_desc:0 "Mother Talzin's fortress, its chambers cut into a mountain of crooked spires and lit by the green of the sisters' magick. Below it lies the Hidden Cave, which no one reaches but by magick. Count Dooku's envoys come and go, and the Nightsisters judge what the Confederacy is worth to them."
 HOD_landmark_dat_village:0 "Nightbrother Village"
 HOD_landmark_dat_village_desc:0 "The Zabrak warriors' village among the rock spires, where the Nightbrothers live apart from the sisters, bound to serve them. The strongest of them are chosen and taken to the lair."
 HOD_landmark_dat_arena:0 "Nightbrother Arena"
 HOD_landmark_dat_arena_desc:0 "A ring of stone tiers round a floor of red earth, where the Nightbrothers fight their trials before their chieftain."
 HOD_landmark_dat_singing:0 "Singing Mountain"
 HOD_landmark_dat_singing_desc:0 "The walled stronghold of the Singing Mountain clan, witches who keep to the light where the Nightsisters keep to the dark. Their rancors are penned at the mountain's foot."
 HOD_landmark_dat_nardithi:0 "Nardithi Cluster"
 HOD_landmark_dat_nardithi_desc:0 "A field of hexagonal stone spikes rising out of the jungle, older than any clan's memory."
 HOD_landmark_man_sundari:0 "Sundari"
 HOD_landmark_man_sundari_desc:0 "The New Mandalorians' capital, a city of cubes under a vast black dome on the white desert the Excision left, built over one of the largest beskar mines on Mandalore. The Republic recognises it, not Keldabe, as the planet's capital; from its Royal Palace by the Peace Park Duchess Satine Kryze keeps Mandalore neutral."
 HOD_landmark_man_keldabe:0 "Keldabe"
 HOD_landmark_man_keldabe_desc:0 "The clans' capital since before the Mandalorian Wars, a hill-fort town on granite in a bend of the Kelita River. Its streets are a jumble of plaster houses, warehouses and granite towers; the clan chiefs meet in the Oyu'baat, and the MandalMotors tower with its mythosaur skull guides pilots home."
 HOD_landmark_man_beskar:0 "Tokursh Beskar Mines"
 HOD_landmark_man_beskar_desc:0 "Deep pits in the Tokursh badlands, the richest beskar country on Mandalore. Clan smiths guard the secrets of working the iron; the government in Sundari guards the pits."
 HOD_landmark_man_dwcamp:0 "Death Watch Camp"
 HOD_landmark_man_dwcamp_desc:0 "A hidden camp of Death Watch, the exiles who would return Mandalore to its warrior past. Pre Vizsla's fighters train here and wait for allies against the Duchess."
 HOD_landmark_man_cityofbone:0 "City of Bone"
 HOD_landmark_man_cityofbone_desc:0 "An amusement park an enterprising Mandalorian built in the shape of a giant mythosaur skeleton, hoping to draw adventure tourists to Mandalore. They never came; its rides stand idle on the plains by Enceri."
 HOD_landmark_man_norgbral:0 "Norg Bral"
 HOD_landmark_man_norgbral_desc:0 "A hill-fort town behind two rings of stone walls, home of Clan Bralor. Its warriors answer to their chieftain before any council in Sundari."
 HOD_landmark_tar_spires:0 "Upper City"
 HOD_landmark_tar_spires_desc:0 "The towers of Taris' rich, raised again over the ruins the Sith fleet left four thousand years ago and guarded by private security. From their decks the city looks out over smog and the slums below."
 HOD_landmark_tar_pit:0 "Undercity"
 HOD_landmark_tar_pit_desc:0 "A shaft sunk through every level of the city to the ground, where outcasts live in the rubble among the rakghouls. Below its sewers, the stories say, lies the Promised Land, the city of the first Tarisians."
 HOD_landmark_tar_swoop:0 "Tarisian Swoop Track"
 HOD_landmark_tar_swoop_desc:0 "The banked track where the Season Opener has been raced since before the bombardment. The gangs that sponsor the riders settle their scores in the stands."
 HOD_landmark_tar_jedi:0 "Jedi Tower"
 HOD_landmark_tar_jedi_desc:0 "The broken tower of the old Taris Academy at Highport, empty since the bombardment, beside the walled base where the Republic once sought a cure for the rakghoul plague."
 HOD_landmark_way_tantiss:0 "Mount Tantiss"
 HOD_landmark_way_tantiss_desc:0 "A mountain whose southern face has been sealed with blast doors and plated terraces. Whoever is building inside it pays well and allows no questions."
 HOD_landmark_way_colony:0 "Wayland Colony"
 HOD_landmark_way_colony_desc:0 "The human colonists' palisaded town on its rise, with a stone keep, a market, and a landing field outside the wall."
 HOD_landmark_way_council:0 "Council Village"
 HOD_landmark_way_council_desc:0 "Where the Psadan and the Myneyrshi meet round a ring of standing stones. Old enemies, they are of one mind about the colonists."
 HOD_landmark_con_city:0 "Concordia City"
 HOD_landmark_con_city_desc:0 "The walled city from which Pre Vizsla governs Concordia for the Duchess, and from which, in secret, he leads Death Watch."
 HOD_landmark_con_mines:0 "Concordian Mines"
 HOD_landmark_con_mines_desc:0 "Mines worked out long ago and left to rust. Their galleries make good storehouses for weapons the Duchess does not know about."
 HOD_landmark_con_hideout:0 "Death Watch Hideout"
 HOD_landmark_con_hideout_desc:0 "A camp under the forest at the foot of a cliff, where Death Watch trains, hides its ships, and waits to take Mandalore back from the pacifists."
 HOD_landmark_bra_yards:0 "Scrapper Guild Yards"
 HOD_landmark_bra_yards_desc:0 "Where the Scrapper Guild cuts old starships apart, plate by plate, under its gantries. An old Derriphan lies here in two halves, and the Republic buys back the steel."
 HOD_landmark_bra_platform:0 "Platform Thirty-Two"
 HOD_landmark_bra_platform_desc:0 "One of the Guild's great raised platforms, where a Hammerhead is being broken. Scrappers who miss their quota are cut from the roster."
 HOD_landmark_bra_tower:0 "Retired Control Tower"
 HOD_landmark_bra_tower_desc:0 "A control tower from the days when Bracca still built ships, left standing over the plains it once directed traffic across."
 HOD_landmark_bra_rail:0 "Worker Rail Route 213"
 HOD_landmark_bra_rail_desc:0 "The trestle line that carries the scrappers between their towns and the yards on every shift."
 HOD_landmark_bra_town:0 "Scrapper Town"
 HOD_landmark_bra_town_desc:0 "Habitat boxes stacked round a yard, where the Guild's workers sleep between shifts."
 HOD_landmark_tra_forak:0 "Forak"
 HOD_landmark_tra_forak_desc:0 "The Trandoshan capital behind its spiked walls, where the clans meet in the great hall and count their hunters' jagannath points."
 HOD_landmark_tra_market:0 "Slaver Market"
 HOD_landmark_tra_market_desc:0 "Cages and auction stages where Trandoshan slavers sell their catches, beside the arena where captives are hunted for points."
 HOD_landmark_tra_lodge:0 "Great Hunting Lodge"
 HOD_landmark_tra_lodge_desc:0 "A hunters' lodge on a bluff over the jungle, its front hung with the skulls of its members' finest prey."
 HOD_landmark_tra_shrine:0 "Scorekeeper's Shrine"
 HOD_landmark_tra_shrine_desc:0 "A stepped shrine to the Scorekeeper, the goddess who weighs every Trandoshan's jagannath points. Hunters bring her their trophies before a great hunt."
 HOD_landmark_nyr_locus:0 "Locus"
 HOD_landmark_nyr_locus_desc:0 "Nyriaan's capital, divided between the Mining Guild Sector and the rest of the city, with the Neutral Zone at its centre where everyone's business is welcome. The Trade Federation buys the Guild's ore and its goodwill."
 HOD_landmark_nyr_prosperity:0 "Prosperity Mine"
 HOD_landmark_nyr_prosperity_desc:0 "The pit beside the town of Prosperity, which gave the town its hopes and its name."
 HOD_landmark_nyr_arena:0 "Nyriaan Gladiator Arena"
 HOD_landmark_nyr_arena_desc:0 "A bowl of rusted plate where miners bet their wages on fighters and beasts."
 HOD_landmark_nyr_finalrest:0 "Final Rest"
 HOD_landmark_nyr_finalrest_desc:0 "A narrow plateau a hundred kilometres north of Locus, one of the highest points on Nyriaan. A sensor outpost on its summit watches the whole region."
 HOD_landmark_crs_port:0 "Corsin Port"
 HOD_landmark_crs_port_desc:0 "The white city on the inner sea where the Republic's governor keeps a domed palace above the harbour."
 HOD_landmark_crs_retreat:0 "Corsin Retreat"
 HOD_landmark_crs_retreat_desc:0 "The hill retreat where Republic commanders met in 738 BBY to decide the course of a war. Its rotunda is still offered to the Republic's generals and Jedi."
 HOD_landmark_crs_resort:0 "Tinn'lyi Islands"
 HOD_landmark_crs_resort_desc:0 "Bungalows on stilts over the shallows of the Tinn'lyi Islands, a resort for the Core's wealthy."
 HOD_landmark_crs_station:0 "Selligore Station"
 HOD_landmark_crs_station_desc:0 "A platform over the banks where scientists follow the selligore, sea mammals more than twenty metres long, through their feeding grounds."
 HOD_landmark_kas_kachirho:0 "Kachirho"
 HOD_landmark_kas_kachirho_desc:0 "The Wookiee city on the Wawaatt coast, its homes climbing the great wroshyr in rings of timber platforms over the beach. Chieftains Tarfful and Chewbacca's kin keep watch on the lagoon."
 HOD_landmark_kas_refinery:0 "Kashyyyk Oil Refinery"
 HOD_landmark_kas_refinery_desc:0 "Tanks and a cracking column in timber scaffolding near Kachirho, fuelling the Wookiee fleet and the coastal defences."
 HOD_landmark_kas_rwookrrorro:0 "Rwookrrorro"
 HOD_landmark_kas_rwookrrorro_desc:0 "A city spread across a web of platforms between six great wroshyrs, high above the forest floor."
 HOD_landmark_kas_caverns:0 "Myyydril Caverns"
 HOD_landmark_kas_caverns_desc:0 "Caves under the Black Forest, which the Wookiees believe cursed. Webs hang between its twisted trees and few who go in come back."
 HOD_landmark_kas_wartaki:0 "Wartaki Islands"
 HOD_landmark_kas_wartaki_desc:0 "A Republic outpost on the Wartaki Islands, white prefab bunkers inside a Wookiee palisade, watching the approaches from the sea."
 HOD_landmark_ond_iziz:0 "Iziz"
 HOD_landmark_ond_iziz_desc:0 "Onderon's ancient capital behind the walls raised against the beasts of the jungle, the Unifar Temple rising over Malgan Market. King Ramsis Dendup rules from it and keeps Onderon out of the war."
 HOD_landmark_ond_nest:0 "The Nest"
 HOD_landmark_ond_nest_desc:0 "A fort of logs on a peak in the highlands east of Iziz, where young Onderonians who want no masters train to fight."
 HOD_landmark_ond_camp:0 "Saw Gerrera's Camp"
 HOD_landmark_ond_camp_desc:0 "A hidden camp under a cliff in the jungle of Sector S-29, where Saw and Steela Gerrera gather fighters and stolen weapons."
 HOD_landmark_ond_kira:0 "Kira Fortress"
 HOD_landmark_ond_kira_desc:0 "The fortress of the House of Kira in the wilds outside Iziz, older than most of the city's walls."
 HOD_landmark_ond_lodge:0 "Beast Riders' Lodge"
 HOD_landmark_ond_lodge_desc:0 "The hunting lodge of the Clazca, a clan of the Beast Riders who tame and fly the drexl of the highlands."
 HOD_landmark_umb_capital:0 "Umbaran Capital City"
 HOD_landmark_umb_capital_desc:0 "Dark spires lit by cold blue light, the seat of the Umbaran government that holds its seat in the Senate and listens to Separatist envoys."
 HOD_landmark_umb_airbase:0 "Umbaran Airbase"
 HOD_landmark_umb_airbase_desc:0 "The militia's airbase near Sector Delta, its pads lit in the dusk, home to the Umbarans' agile starfighters."
 HOD_landmark_umb_bunker:0 "Umbaran Bunkers"
 HOD_landmark_umb_bunker_desc:0 "Bunkers Grek, Krill and Usk, dug into the dark hills and armoured against any landing."
 HOD_landmark_umb_academy:0 "Sith Academy"
 HOD_landmark_umb_academy_desc:0 "The ruins of the academy the Brotherhood of Darkness founded at the end of the New Sith Wars. The jungle keeps away from its red-lit crown."
 HOD_landmark_col_hive:0 "Colla Hive"
 HOD_landmark_col_hive_desc:0 "The spires of the Colicoid hive capital, where the Colicoid Creation Nest's masters sell to the Trade Federation and anyone else who pays."
 HOD_landmark_col_nest:0 "Colicoid Creation Nest"
 HOD_landmark_col_nest_desc:0 "The factory that makes the droidekas, its shell halls rolling out the destroyer droids the Trade Federation fields."
 HOD_landmark_col_spawn:0 "Spawning Grounds"
 HOD_landmark_col_spawn_desc:0 "The pools of the Colicoid spawnworld, where eggs are laid by the thousand and guarded by the hive."
 HOD_landmark_rus_mausoleum:0 "Jedi Mausoleum"
 HOD_landmark_rus_mausoleum_desc:0 "After the last Battle of Ruusan, Johun Othone asked the Senate to raise a mausoleum over the fallen in the Valley of the Jedi. A thousand years later its statues still raise their blades over the burnt valley."
 HOD_landmark_rus_cave:0 "Thought-bomb Cave"
 HOD_landmark_rus_cave_desc:0 "The cave where Lord Kaan set off the thought bomb that took the Brotherhood of Darkness and the Jedi with it. The few who know of it say the souls are still bound there."
 HOD_landmark_rus_camp:0 "Army of Light Encampment"
 HOD_landmark_rus_camp_desc:0 "The earthworks and graves of the Army of Light, the Jedi and Republic troops whom Lord Hoth and Valenthyne Farfalla led through the seven Battles of Ruusan."
 HOD_landmark_rus_fort:0 "Fort Nowhere"
 HOD_landmark_rus_fort_desc:0 "A walled landing field beside Katarn's Hill, where smugglers, claim jumpers and fugitives of the Teraab sector put down far from the law."
 HOD_landmark_rus_olmondo:0 "Olmondo"
 HOD_landmark_rus_olmondo_desc:0 "Ruusan's capital, rebuilt in fieldstone after the war burnt the old cities. Its assembly now leans toward the Separatists, who promise to remember the worlds the Republic forgot."
 HOD_landmark_ith_tafanda:0 "Tafanda Bay"
 HOD_landmark_ith_tafanda_desc:0 "The greatest of the Ithorian herdships and the seat of Ithor's elected council, a floating garden city of living hulls that drifts over the clouds so its people never wound the Mother Jungle below. Offworld traders land at its balcony to buy Ithorian medicines and botanicals."
 HOD_landmark_ith_tarintha:0 "Tree of Tarintha"
 HOD_landmark_ith_tarintha_desc:0 "A herdship grown round a single colossal tree, its roots trailing far below the hull. Its herd tends gardens that feed half the Ithorian fleet of cities."
 HOD_landmark_ith_cloudmother:0 "Cloud-Mother"
 HOD_landmark_ith_cloudmother_desc:0 "A herdship of three linked hulls, home of the House of the Healers, where Ithorian healers treat patients from across the Mid Rim with the medicines of the jungle."
 HOD_landmark_ith_falls:0 "Falls of Dessiar"
 HOD_landmark_ith_falls_desc:0 "Waterfalls in a horseshoe of jungle cliffs, renowned across the galaxy for their beauty and peace. No Ithorian may walk there under the Law of Life; they watch them from the herdships passing over."
 HOD_landmark_om_city:0 "Ord Mantell City"
 HOD_landmark_om_city_desc:0 "The capital, a sprawl of towers and old mining districts over tunnels nobody has mapped in centuries. Bounty hunters, smugglers and Black Sun's agents do their business in its back streets."
 HOD_landmark_om_worlport:0 "Worlport"
 HOD_landmark_om_worlport_desc:0 "Ord Mantell's great spaceport city, built in the Corellian style of its first settlers in the days of the Old Republic, with a Casino District that draws gamblers from across the Mid Rim."
 HOD_landmark_om_junkyard:0 "Ord Mantell Junkyards"
 HOD_landmark_om_junkyard_desc:0 "Mountains of scrapped starships and droids on the edge of the capital, where salvagers strip hulls for parts and anyone can disappear for a price."
 HOD_landmark_om_oldcity:0 "Old Ord Mantell City"
 HOD_landmark_om_oldcity_desc:0 "The ruins of the first capital, abandoned when the settlers moved on. Its broken towers shelter scavengers, outlaws and the gangs that hunt them."
 HOD_landmark_om_garnik:0 "Fort Garnik"
 HOD_landmark_om_garnik_desc:0 "A Republic stronghold on the volcanic island of Avilatan, its guns covering the Bright Sea from the black slopes below Mount Avilatan, where lava still runs past the walls."
 HOD_landmark_gar_pesktda:0 "Pesktda"
 HOD_landmark_gar_pesktda_desc:0 "Garqi's capital, a graceful city of broad avenues lined with bimiza trees and dotted with parks, its Xenobotanical Garden home to a grove of telepathic bafforr trees brought from Ithor."
 HOD_landmark_gar_university:0 "Garqi Agricultural University"
 HOD_landmark_gar_university_desc:0 "The leading university of Garqi, where the agronomists of the Mid Rim learn their trade, and its students argue politics late into the night."
 HOD_landmark_gar_combine:0 "Garqi Agricultural Combine"
 HOD_landmark_gar_combine_desc:0 "The silos and processing works of the Combine that feeds Garqi and ships grain and caf to the banking worlds of the Core."
 HOD_landmark_gar_vlassy:0 "Vlassy Nature Preserve"
 HOD_landmark_gar_vlassy_desc:0 "Forested bluffs and canyons along the Vlassy River, too rough to farm, kept wild and visited by tourists in the caf off-season."
 HOD_landmark_aga_calna:0 "Calna Muun"
 HOD_landmark_aga_calna_desc:0 "Agamar's capital and spaceport on the shore of the Crescent Sea, where the Agamarian Council meets in the shell-roofed Council Center. Its farmers and ranchers have lately thrown in their lot with the Confederacy."
 HOD_landmark_aga_university:0 "University of Agamar"
 HOD_landmark_aga_university_desc:0 "A college of a frontier world with a xenoarchaeology faculty respected across the sector, built on what the droughts uncovered in the Crescent Sea."
 HOD_landmark_aga_ruins:0 "Crescent Shallows Ruins"
 HOD_landmark_aga_ruins_desc:0 "The stepped temple of a civilisation that lived under the Crescent Sea in the days of the Rakatan Infinite Empire, laid bare by drought. Farmers nearby swear the stones still hum at night."
 HOD_landmark_aga_bridges:0 "Stone Bridges"
 HOD_landmark_aga_bridges_desc:0 "Great natural arches worn into the red rock of the northern badlands, where Agamarian youngsters race their repulsorcraft through the gaps."
 HOD_landmark_aga_ranch:0 "Mugruebe Ranches"
 HOD_landmark_aga_ranch_desc:0 "The ranges where Agamar raises its mugruebe, beasts of burden and the meat of the stew the rest of the galaxy will not eat."
 HOD_landmark_ot_depot:0 "Ord Trasi Depot"
 HOD_landmark_ot_depot_desc:0 "An ordnance and regional depot fortress the Republic built to supply its exploration fleets, its walls bristling with turbolasers over the cold dust plains. Who holds Ord Trasi holds the Braxant Run."
 HOD_landmark_ot_yards:0 "Ord Trasi Shipyards"
 HOD_landmark_ot_yards_desc:0 "What began as a refuelling stop grew into one of the Outer Rim's great construction centres for capital ships, with cradles on the flats and slips in orbit where Dreadnaught cruisers take shape."
 HOD_landmark_ot_salvage:0 "Ord Trasi Salvage Yards"
 HOD_landmark_ot_salvage_desc:0 "Old warships come here to be cut apart; their metal goes back into the yards' new hulls."
 HOD_landmark_dan_khoonda:0 "Khoonda"
 HOD_landmark_dan_khoonda_desc:0 "The walled seat of Dantooine's settlers, raised from the old Matale estate after the Jedi Civil War, where the farmers of the plains govern themselves and keep a militia against raiders."
 HOD_landmark_dan_enclave:0 "Jedi Enclave"
 HOD_landmark_dan_enclave_desc:0 "The ruins of the Jedi Enclave of Vodo-Siosk Baas, bombed from orbit by Darth Malak four thousand years ago and never rebuilt. Grass grows in its courtyard round the ancient tree."
 HOD_landmark_dan_rakatan:0 "Ancient Temple"
 HOD_landmark_dan_rakatan_desc:0 "A temple of the Rakatan Infinite Empire half sunk into a mound north-east of the Enclave, its doorway still glowing; the Star Map within has been dark since the Jedi Civil War."
 HOD_landmark_dan_matale:0 "Matale Estate"
 HOD_landmark_dan_matale_desc:0 "The walled house of the Matale family on its grounds east of the river, its kath hounds penned in the yard. The settlers' first council met here before Khoonda was built."
 HOD_landmark_dan_sandral:0 "Sandral Estate"
 HOD_landmark_dan_sandral_desc:0 "The long house of the Sandral family, old rivals of the Matales, with its garden terraces and landing pad on the south-western grounds."
 HOD_landmark_dan_grove:0 "The Grove"
 HOD_landmark_dan_grove_desc:0 "A glade where the Jedi of the Enclave meditated round an ancient tree inside a ring of standing stones. The settlers say something dark still lingers there."
 HOD_landmark_dan_cave:0 "Crystal Caves"
 HOD_landmark_dan_cave_desc:0 "Caves in the Taikaha Hills where kinrath nest, and where Jedi once found kyber crystals in their eggs."
 HOD_landmark_dub_capital:0 "Dubrillion City"
 HOD_landmark_dub_capital_desc:0 "The capital of a garden world, its white towers of hotels and luxury suites rising round the Dubrillion Aquarium, where emerald sharks circle a great cylindrical tank. The banking clan's wealthy come here to spend what they earn elsewhere."
 HOD_landmark_dub_resort:0 "Sapphire Coast"
 HOD_landmark_dub_resort_desc:0 "Terraced hotels stepping down to the beaches of the eastern shore, their pools on every level."
 HOD_landmark_bas_ravelin:0 "Ravelin"
 HOD_landmark_bas_ravelin_desc:0 "The stern stone capital of the Braxant sector, its Sector Hall raising a dark spire over the hills. Its governors already speak of order more than of the Senate."
 HOD_landmark_bas_sartinaynian:0 "Sartinaynian City"
 HOD_landmark_bas_sartinaynian_desc:0 "The harbour city of the south-eastern coast, its terraces climbing the hill above freighters at the quays; every ship bound for Bastion first stops at the customs station in orbit."
 HOD_landmark_kal_kaleela:0 "Kaleela"
 HOD_landmark_kal_kaleela_desc:0 "The Kaleesh capital, its temple-houses climbing the walls of a moss-covered canyon under the mask of the elders' palace. Fresh from the Huk War, its warriors owe their victory to the Banking Clan's credits."
 HOD_landmark_kal_shrupak:0 "Shrupak"
 HOD_landmark_kal_shrupak_desc:0 "The most sacred temple of the Kaleesh, on the edge of the Ausez Steppes, held by Qymaen jai Sheelal and Ronderu lij Kummar against the Yam'rii."
 HOD_landmark_kal_abesmi:0 "Abesmi"
 HOD_landmark_kal_abesmi_desc:0 "The island-monolith of the Jenuwaa Sea, from which the Kaleesh gods ascended to heaven. Pilgrims climb its winding stair to the shrine at the top."
 HOD_landmark_kal_warruzan:0 "Warru'zan"
 HOD_landmark_kal_warruzan_desc:0 "The bloodhalls of the Kaleesh elders, cut into a canyon wall, where the young are taught the ways of war and honour."
 HOD_landmark_muun_harnaidan:0 "Harnaidan"
 HOD_landmark_muun_harnaidan_desc:0 "The greatest Muun city and the headquarters of the InterGalactic Banking Clan, built round spires four kilometres tall; San Hill rules from his citadel, and a skyhook climbs from the city to High Port."
 HOD_landmark_muun_mariunhus:0 "Mariunhus"
 HOD_landmark_muun_mariunhus_desc:0 "A vault-spire built round a smoker rich in gold and platinum, out at sea: a mountain of wealth that can be mined at a moment's notice to guarantee credit anywhere in the galaxy."
 HOD_landmark_muun_pilaan:0 "Pilaan Podrace Course"
 HOD_landmark_muun_pilaan_desc:0 "The course outside Pilaan, one of Muunilinst's largest cities, where podracers fly under the arches before crowds of Muuns who bet on everything."
 HOD_landmark_myg_jygat:0 "Jygat"
 HOD_landmark_myg_jygat_desc:0 "A city at the edge of the ice sheets, where the Dressian Kiolsh Merchant Bank has carved its vaults into the glacier itself. Its doors glow with the crystal that powers every tower on Mygeeto."
 HOD_landmark_myg_city:0 "Mygeeto City"
 HOD_landmark_myg_city_desc:0 "The great spaceport metropolis of the Banking Clan, its dark spires rising out of the ice chasms with crystal crowns, its bridges strung between them over the drop."
 HOD_landmark_myg_mesas:0 "Southern Mesas"
 HOD_landmark_myg_mesas_desc:0 "Towers built on top of the sheer southern mesas and joined to one another by bridges, out of reach of anyone on the ice below."
 HOD_landmark_myg_hammertong:0 "Hammertong Facility"
 HOD_landmark_myg_hammertong_desc:0 "A Geonosian research station on the ice, its spires shipped in from Geonosis. What the drones do to the crystal in its test cradle, the Banking Clan does not say."
 HOD_landmark_myg_mines:0 "Crystal Mines"
 HOD_landmark_myg_mines_desc:0 "Mountains of crystal spurs cut into by the Banking Clan's miners, the source of the synthesized crystals that power Mygeeto's capacitor towers."
 HOD_landmark_yag_hive:0 "Yagai Hive"
 HOD_landmark_yag_hive_desc:0 "The mounds of the Yagai rising out of the forest, home to castes that have built starships for the galaxy for longer than the Republic has kept records of it."
 HOD_landmark_yag_spaceport:0 "Yaga Minor Shipyards"
 HOD_landmark_yag_spaceport_desc:0 "Yavvitiri Spaceport on the ground and the shipyards in orbit above it, where Yagai crews assemble the hulls of Republic cruisers in cradles of curved ribs."
 HOD_landmark_yag_center:0 "Preparation Center"
 HOD_landmark_yag_center_desc:0 "A secluded Republic campus a few kilometres from Yavvitiri, built to train the crews of a Jedi expedition beyond the galaxy that has not yet been launched."
 HOD_landmark_yag_works:0 "Drive Works"
 HOD_landmark_yag_works_desc:0 "The halls where Yaga Minor's starship drive units are built and fired on their test stands before being shipped across the galaxy."
 HOD_landmark_ans_cuipernam:0 "Cuipernam"
 HOD_landmark_ans_cuipernam_desc:0 "The walled city of the Sorr-ul-Paan Plateau and seat of the Unity of Community. Separatist agents and the Hutt Soergg work its markets along Jaaruls Street to set the city against the plains, and through Ansion's treaties pull whole sectors out of the Republic."
 HOD_landmark_ans_borokii:0 "Borokii Camp"
 HOD_landmark_ans_borokii_desc:0 "The great camp of the Borokii, the overclan of the Alwari nomads, in the valley that bears their name. What the Borokii decide, the other clans of the plains follow."
 HOD_landmark_ans_dashbalar:0 "Dashbalar"
 HOD_landmark_ans_dashbalar_desc:0 "A market town round a great caravanserai, the favourite trading centre of the Qulun clan, where nomads and city folk still do business with each other."
 HOD_landmark_ilu_temple:0 "Jedi Temple of Ilum"
 HOD_landmark_ilu_temple_desc:0 "One of the Order's earliest temples, cut into an ice mountain over the Crystal Caves where younglings come to find the kyber crystals of their first lightsabers. Its entrance freezes shut at nightfall."
 HOD_landmark_ilu_ruins:0 "Ruins of the Ice Shelf"
 HOD_landmark_ilu_ruins_desc:0 "The Western Ice Shelf keeps the bones of older wars: the broken Jedi shrine at the end of the Cross-Shelf Corridor, the Circle, and the drifted-over walls of Fort Tonvarr."
 HOD_landmark_dor_dorshan:0 "Dor'shan"
 HOD_landmark_dor_dorshan_desc:0 "The Kel Dor capital, its masked towers breathing the planet's helium-rich air, kand orchards on the slopes outside it. Off-worlders walk its streets behind breath masks of their own."
 HOD_landmark_dor_dorgalk:0 "Dor'galk"
 HOD_landmark_dor_dorgalk_desc:0 "A plateau city round the atmosphere works whose vents keep the Kel Dor's air as it should be."
 HOD_landmark_dor_barando:0 "Baran Do Temple"
 HOD_landmark_dor_barando_desc:0 "The sages of the Baran Do climb to their pavilions above Dor'shan to read what is coming, as they did before the Jedi came to Dorin. Below the plateaus, the Caverns of the Hidden One keep their own secrets."
 HOD_landmark_dor_enclave:0 "Jedi Enclave of Dorin"
 HOD_landmark_dor_enclave_desc:0 "The Order's hall on Dorin, built in the Kel Dor manner, where Force-sensitive Kel Dor children are taught before they leave for Coruscant."
 HOD_landmark_yin_tolkachorn:0 "Tol-Kachorn"
 HOD_landmark_yin_tolkachorn_desc:0 "Strongest of the Yinchorri city-states, fed by a hundred villages and served by five lesser cities. Its Council of Elders sent their warriors against the Jedi Temple itself in the Uprising, and lost; the horned towers still fly the war banners the Republic has not dared to take down."
 HOD_landmark_yin_garrison:0 "Republic Occupation"
 HOD_landmark_yin_garrison_desc:0 "Since the Uprising the Republic keeps garrisons north and south of Tol-Kachorn, and at the southern depot the Yinchorri arsenal - rifles, cannon, the hulls of their warships - is broken up for scrap, piece by piece, under guard."
 HOD_landmark_yin_mines:0 "Offworld Concessions"
 HOD_landmark_yin_mines_desc:0 "Scouts once judged Yinchorr too poor to settle. DaaCorp's great pit and the Zerpen mines came anyway, with the Republic's peace, and Yinchorri labour digs what the corporations ship off-world."
 HOD_landmark_cha_hanna:0 "Hanna City"
 HOD_landmark_cha_hanna_desc:0 "The capital between the Silver Sea and Lake Sah'ot, its white terraces looking down on the water. Chandrila sends its senators to Coruscant from here, and a quieter, older democracy meets under the rotunda's dome."
 HOD_landmark_cha_ports:0 "Spaceports of Chandrila"
 HOD_landmark_cha_ports_desc:0 "Two of the planet's three full spaceports. Emita alone was allowed industry, and its halls and freight yards work behind the docking bays while the rest of Chandrila keeps its plains green."
 HOD_landmark_cha_brionelle:0 "Brionelle Memorial Military Academy"
 HOD_landmark_cha_brionelle_desc:0 "The academy of the Chandrilan Defense Fleet, which trains nearly every one of its officers. Cadets swear their oath beneath the Brionelle memorial at the head of the parade ground."
 HOD_landmark_cha_canyons:0 "Crystal Canyons"
 HOD_landmark_cha_canyons_desc:0 "A gallery of rock and crystal around a tight trench above an abyss. Guides lead visitors across the arch; the rest of the canyon system is mapped by no one."
 HOD_landmark_cor_curamelle:0 "Curamelle"
 HOD_landmark_cor_curamelle_desc:0 "Corulag's capital of glass towers, the Royal Galaxy Hotel on top of the tallest. The planet's money, its universities and its schools of commerce turn out the Core's managers, and many of its officers."
 HOD_landmark_cor_sienar:0 "Sienar Advanced Research Division"
 HOD_landmark_cor_sienar_desc:0 "North of Curamelle, Sienar designs, builds and tests its prototypes behind the fence: the runway and the wind tunnel are never quiet."
 HOD_landmark_cor_academy:0 "Corulag Academy"
 HOD_landmark_cor_academy_desc:0 "The academy whose cadets fill the officer corps of half the Core. On race days its cadets slip off to Tasjon to watch the swoops tear round the course."
 HOD_landmark_ark_adascopolis:0 "Adascopolis"
 HOD_landmark_ark_adascopolis_desc:0 "The ancient capital on its crag, seat of the House of Adasca. The Arkanians' meritocracy of brilliance governs from here, and Novania's port ships what their science and their mines produce."
 HOD_landmark_ark_mines:0 "Diamond Mines of Arkania"
 HOD_landmark_ark_mines_desc:0 "Under the ice lie diamond stores beyond counting, opened to the Republic's mining concerns. The shafts go down further every year."
 HOD_landmark_ark_praxeum:0 "Old Arkania"
 HOD_landmark_ark_praxeum_desc:0 "Snow fills the hall where Master Arca Jeth taught his students, and somewhere under the frozen wastes the Sith library of Veeshas Tuwan waits for whoever digs deep enough."
 HOD_landmark_anx_citadel:0 "Anaxes Citadel"
 HOD_landmark_anx_citadel_desc:0 "Training schools, research labs and intelligence centres stacked on the terraces of the Sirpar Hills: the Republic's military mind lives here."
 HOD_landmark_anx_yards:0 "Anaxes Shipyards"
 HOD_landmark_anx_yards_desc:0 "Slips in orbit and fabrication halls below, building the Republic's warships. If Anaxes fell, the Core would lose its forge."
 HOD_landmark_anx_college:0 "Republic Navy War College"
 HOD_landmark_anx_college_desc:0 "Where the Navy's officers learn their trade, guarded by Fort Anaxes in its cave in the canyon country and supplied by Czerka's waterworks."
 HOD_landmark_ess_calamar:0 "Calamar"
 HOD_landmark_ess_calamar_desc:0 "The domed capital of Esseles, heart of the Darpa sector, its canals and towers busy with the trade of the starport beside it."
 HOD_landmark_ess_esprix:0 "Esprix Estate"
 HOD_landmark_ess_esprix_desc:0 "The residence of the senator of Esseles, built in the Naboo manner: gold-ribbed domes, arcades and long gardens down to the sea."
 HOD_landmark_ess_togatto:0 "Togatto Speedway"
 HOD_landmark_ess_togatto_desc:0 "The Ferlanis' podracing arena in tropical Nurrale, the most spectacular in the Darpa sector. Half the sector's fortunes change hands on race day."
 HOD_landmark_car_academy:0 "Academy of Carida"
 HOD_landmark_car_academy_desc:0 "The oldest military academy of the Core, walled on the Spinara Plateau. Under Carida's heavy gravity cadets of a hundred worlds learn to march, fly and command; the station Valor watches over its landing field from orbit."
 HOD_landmark_car_district:0 "Caridan District"
 HOD_landmark_car_district_desc:0 "The quarter just outside the Academy's gates, famous for its nightlife. Every cantina here has seen a cadet spend a month's pay in one night before the Dean's curfew."
 HOD_landmark_car_teeth:0 "Tarkin's Teeth"
 HOD_landmark_car_teeth_desc:0 "Desolate mountains three hundred kilometres from the Academy, a training ground for centuries. Squads cross the Teeth on foot, then the Forgofshar Desert with what they carry: few forget either."
 HOD_landmark_car_corsairs:0 "Carida Corsairs' Base"
 HOD_landmark_car_corsairs_desc:0 "The frozen lair of the pirates who once raided the Perlemian Trade Route, found out by the Republic long ago. Its hangars stand empty, but the cadets swear the old tunnels go deeper than the maps."
 HOD_landmark_bal_binprime:0 "Bin Prime"
 HOD_landmark_bal_binprime_desc:0 "The capital of Balmorra since the government left Sobrik, now run from the council dome in the Techno Union's interest. Freighters from Alderaan land at its spaceport; whatever they bring is sold in the Swellbottom market by nightfall."
 HOD_landmark_bal_arms:0 "Balmorran Arms Factory"
 HOD_landmark_bal_arms_desc:0 "The great works of the Sundari Flatlands, fought over in every war the planet has seen. Its foundry pours droid chassis day and night under the Techno Union's contracts."
 HOD_landmark_bal_sobrik:0 "Sobrik"
 HOD_landmark_bal_sobrik_desc:0 "The old capital among the first assembly lines and refineries, its bunkers older than the Republic's memory. Beyond the Gorinth Canyon an outpost holds the gorges for the Techno Union."
 HOD_landmark_bal_bugtown:0 "Bugtown"
 HOD_landmark_bal_bugtown_desc:0 "Lab 352, the Farnel Research Facility on Lake Farnell, where genetic research went wrong long ago. The Broken Valley still swarms with what escaped, and nobody calls it anything but Bugtown."
 HOD_landmark_ald_palace:0 "Royal Palace of Alderaan"
 HOD_landmark_ald_palace_desc:0 "The Mountain Palace of the royal house, above its lake among the snow-capped peaks, with the white towers of Aldera below. From its south terrace the River Wuitho winds away towards the hills."
 HOD_landmark_ald_university:0 "University of Alderaan"
 HOD_landmark_ald_university_desc:0 "The most renowned university of the Core. Its scholars have argued for centuries over the stone mounds the Killiks left behind, and over everything else."
 HOD_landmark_ald_crevasse:0 "Crevasse City"
 HOD_landmark_ald_crevasse_desc:0 "The first and largest of the canyon cities, built into the walls of a great gorge. From above there is almost nothing to see; inside, even the heavy industry is hidden in the rock."
 HOD_landmark_ald_sanctuary:0 "Sanctuary Coast"
 HOD_landmark_ald_sanctuary_desc:0 "A sprawling city on enormous stilts at the edge of the inland sea, whose leaders have always taken in refugees from wars and oppression elsewhere."
 HOD_landmark_ald_falls:0 "Wonders of Alderaan"
 HOD_landmark_ald_falls_desc:0 "The Cloudshape and Istabith Falls, the Glarus Lagoons and the Petrified Mounds of the Killiks: Alderaan guards its natural wonders the way other worlds guard their fortresses."
 HOD_landmark_tyt_temple:0 "Jedi Temple Ruins"
 HOD_landmark_tyt_temple_desc:0 "The temple the Jedi kept on Tython after the Great Galactic War, empty for centuries since the hyperlanes failed. Up on its mountain the Force-henge still holds its seeing stone, and the Order has not forgotten either."
 HOD_landmark_tyt_retreat:0 "Je'daii Ruins"
 HOD_landmark_tyt_retreat_desc:0 "The broken temple-cities of the Je'daii round the silent Tho Yor, and the Masters' Retreat on its lake in the Gnarls: the cradle of the Jedi, given back to the forests and the Force storms."
 HOD_landmark_tyt_banlanding:0 "Ban Landing"
 HOD_landmark_tyt_banlanding_desc:0 "The empty city at the mouth of the Moon Channel, where Je'daii once crossed to the Moon Islands. Its quays still stand; the only crossing between Thyr and Kato Zakar runs through its ruins."
 HOD_landmark_fre_incom:0 "Incom Corporation"
 HOD_landmark_fre_incom_desc:0 "Incom's plants and offices fill the Coromon Islands. Its Z-95 Headhunter, built with Subpro, flies over the storm isles every day, and every navy in the Core wants it."
 HOD_landmark_fre_arches:0 "Afterburner Arches"
 HOD_landmark_fre_arches_desc:0 "Three great natural stone arches off the coast of Prime Coromon. Incom's test pilots fly through them on their first day, or so the cantinas say."
 HOD_landmark_foe_yards:0 "Foerost Shipyards"
 HOD_landmark_foe_yards_desc:0 "Some of the oldest shipyards in the galaxy, high in orbit, now worked for the Techno Union. Beside them the Old Yards' broken ring still holds a hull no one has finished in a thousand years."
 HOD_landmark_foe_hajibar:0 "Hajibar"
 HOD_landmark_foe_hajibar_desc:0 "Foerost's capital, its old works blocks under the Techno Union's spires. Every order for the yards passes through its guild hall, and its communications tower talks to the slips day and night."
 HOD_landmark_foe_works:0 "Foerost Works"
 HOD_landmark_foe_works_desc:0 "The refineries and foundries that feed the yards with fuel, alloys and hull plate."
 HOD_landmark_crl_yards:0 "Corellian Shipyards"
 HOD_landmark_crl_yards_desc:0 "The Santhe yards over Coronet, where Corellian hulls are laid down, fed by the factories of the Bottoms below, built on swamp the shipbuilders drained."
 HOD_landmark_crl_coronet:0 "Coronet City"
 HOD_landmark_crl_coronet_desc:0 "The Golden City: bronze towers, Treasure Ship Row's dealers selling anything that flies, and CorSec keeping some order among the smugglers."
 HOD_landmark_crl_korvella:0 "Kor Vella"
 HOD_landmark_crl_korvella_desc:0 "The city on its mesa, famous for its tailors' field jackets. In the hills east, the Selonians keep to their dens, Hunchuzuc among them."
 HOD_landmark_kua_yards:0 "Kuat Drive Yards"
 HOD_landmark_kua_yards_desc:0 "The most famous shipyards in the galaxy, an arc of the ring that girdles Kuat. The noble houses below keep their world a garden by building everything above it."
 HOD_landmark_kua_city:0 "Kuat City"
 HOD_landmark_kua_city_desc:0 "The capital of Kuat, its elegant towers and spires shaped like the yards' dock arms. Tekshar Falls drops five hundred metres through its entertainment centre, a river turned aside at great expense."
 HOD_landmark_kua_gardens:0 "Gardens of Tralala"
 HOD_landmark_kua_gardens_desc:0 "Terraced gardens and glass conservatories kept by the noble houses, fertilised the old way with drebin compost."
 HOD_landmark_ren_yards:0 "Rendili StarDrive Yards"
 HOD_landmark_ren_yards_desc:0 "Where the Dreadnaught heavy cruisers are built, their engines test-fired at the Drive Works below before the hulls go up to the slips."
 HOD_landmark_ren_hq:0 "Rendili StarDrive"
 HOD_landmark_ren_hq_desc:0 "The shipbuilder's headquarters over Rendili City. Its directors sell to the Republic, and listen to anyone else who pays."
 HOD_landmark_ren_base:0 "Home Defense Fleet Base"
 HOD_landmark_ren_base_desc:0 "The ground base of the Rendili Home Defense Fleet, whose loyalty both the Republic and the Separatists are already counting on."
 HOD_landmark_com_chasin:0 "Chasin City"
 HOD_landmark_com_chasin_desc:0 "One of Commenor's greatest cities, famous across the Core for its restaurants. Traders off the Commenor Run eat here before they sign anything."
 HOD_landmark_com_university:0 "University of Commenor"
 HOD_landmark_com_university_desc:0 "Where, in the last days before the war, Senator Amidala told a great peace rally that the Republic must not answer the Separatists with an army."
 HOD_landmark_com_arena:0 "Anteluma"
 HOD_landmark_com_arena_desc:0 "The sporting centre of Commenor and home of its major leagues. Half of Munto, terraced up its valley, comes down to watch on match day."
 HOD_landmark_dur_spacecity:0 "Duros Space Cities"
 HOD_landmark_dur_spacecity_desc:0 "Twenty cities in orbit, Bburru Station the greatest, where the Duros live above the world their factories poisoned. The lift fields feed them from the ground."
 HOD_landmark_dur_ranadaast:0 "Ranadaast"
 HOD_landmark_dur_ranadaast_desc:0 "The old royal capital, the City of Ashes: half its towers dark, its streets run by whoever pays. The factory belt still works beyond it, as it has for centuries."
 HOD_landmark_dur_royalty:0 "Valley of Royalty"
 HOD_landmark_dur_royalty_desc:0 "The tombs of Duro's monarchs, the ruins of Tayana in their crater, the old Tiercam Dam and the floating city of New Tayana: what the Duros left on the ground and still remember."
 HOD_landmark_lor_corp:0 "Loronar Corporation"
 HOD_landmark_lor_corp_desc:0 "The corporation of strike cruisers, needle fighters and synthdroids, run from its crystal tower over Loronar City."
 HOD_landmark_lor_works:0 "Crystal Works"
 HOD_landmark_lor_works_desc:0 "Where Loronar grows the synthetic crystals its corporation builds into everything it sells, shipped out through the spaceport."
 HOD_landmark_nei_kotosi:0 "Koto-Si"
 HOD_landmark_nei_kotosi_desc:0 "The capital of Neimoidia and the heart of the Trade Federation. Freighters land in its great bays every hour; the Viceroy's dome looks out over all of it."
 HOD_landmark_nei_hives:0 "Communal Hives"
 HOD_landmark_nei_hives_desc:0 "The hives where every Neimoidian grub is raised, and the fungus farms below them where harvester beetles tend the crop. A Neimoidian learns greed here before anything else."
 HOD_landmark_mim_temple:0 "Temple of Pomojema"
 HOD_landmark_mim_temple_desc:0 "A ziggurat of volcanic rock raised to the god Pomojema, the Kaiburr crystal in its great statue. Beyond it the Thrella wells drop into the dark."
 HOD_landmark_mim_village:0 "Nanth Flatlands"
 HOD_landmark_mim_village_desc:0 "The stilt villages of the Mimbanese in the mist, the prospectors' camp in the mud fields, and somewhere in the deep forest Dreypa's Oubliette, which nobody local will go near."
 HOD_landmark_mnn_ahto:0 "Ahto City"
 HOD_landmark_mnn_ahto_desc:0 "The Selkath capital floating alone on Manaan's endless sea, white platforms and domes linked by bridges. Its swoop track draws racers from across the Slice, and its kolto is sold to anyone."
 HOD_landmark_tet_cinnagar:0 "Cinnagar"
 HOD_landmark_tet_cinnagar_desc:0 "The city that grew until it covered Empress Teta. The Core District glitters with shops and museums; behind it the Iron Citadel, where Teta's monarchs ruled until the Krath took it, still stands in the Royal District."
 HOD_landmark_tet_library:0 "Great Library of Cinnagar"
 HOD_landmark_tet_library_desc:0 "Under its bronze dome lies the learning of the old Deep Core frontier. Across the square the Navigator's Guildhouse remembers the scouts who never came back from the routes they went to find."
 HOD_landmark_tet_mines:0 "Tetan Carbonite Mines"
 HOD_landmark_tet_mines_desc:0 "Carbonite is the backbone of Teta's wealth. The pits bite deep into the cityscape, and more than once the digging has nearly broken the world."
 HOD_landmark_bys_temple:0 "Rakatan Stronghold"
 HOD_landmark_bys_temple_desc:0 "A temple fortress the Infinite Empire raised to rule the Deep Core, its stone still lit by a light nobody can explain. Older ruins lie among the ferns, from before anyone counted the ages."
 HOD_landmark_bys_landing:0 "Byss Landing"
 HOD_landmark_bys_landing_desc:0 "A quiet Republic town on a balmy world of lakes and plateaus. The rich keep villas at the Emerald Splendor Estates, and beyond them the white houses of Desolation Peak climb their rock above the lake."
 HOD_landmark_abr_spaceport:0 "Abregado-rae Spaceport"
 HOD_landmark_abr_spaceport_desc:0 "The closest thing the Core has to a smugglers' safe dock. Freighters drop into its sunken bays, barges glide down its canals, and in the Old Patch the LoBue Cantina never closes."
 HOD_landmark_abr_leyer:0 "Le Yer"
 HOD_landmark_abr_leyer_desc:0 "A resort on the sea, with hydrobikes out to Phyrstal Island. Inland, the Gilt Gushers bubble up gold among the hills."
 HOD_landmark_fon_city:0 "Fondor City"
 HOD_landmark_fon_city_desc:0 "A world of factories, cooling towers and barracks under a purple sky, building the hulls the shipyards above will finish. Fondor City and Oridin City run the works; the lift fields send them up."
 HOD_landmark_fon_academy:0 "Fondor Academy of Engineering and Design"
 HOD_landmark_fon_academy_desc:0 "Kuat Drive Yards and the Techno Union both hire their engineers here. Below the campus run the steam tubes, and the shafts go down toward the planet's core."
 HOD_landmark_cat_zarra:0 "Zarra"
 HOD_landmark_cat_zarra_desc:0 "Gilded bridge cities hang between great rock arches above an acid sea, wrapped in fog. Zarra is the richest of them, the capital of the Trade Federation's purse world."
 HOD_landmark_cat_vaults:0 "Great Vaults of Cato Neimoidia"
 HOD_landmark_cat_vaults_desc:0 "Lott Dod's palace keeps the Federation's treasure in its vaults. In the west, Nute Gunray has a citadel of his own, in case the Republic ever comes for its money."
 HOD_landmark_bst_bsellis:0 "Bsellis City"
 HOD_landmark_bst_bsellis_desc:0 "A white market town among golden fields, under chalk cliffs and spires. Its farms feed half the Inner Rim, and its gangs take their cut."
 HOD_landmark_bst_spires:0 "Island Spires"
 HOD_landmark_bst_spires_desc:0 "Bestine's people live where they always have: on top of the spires at Jahnae, inside the lava tube of Barlata, and on the floating rafts of Gasha."
 HOD_landmark_atz_talos:0 "Talos"
 HOD_landmark_atz_talos_desc:0 "A spaceport city on stilts over the marsh, where almost anything, legal or not, can be had for a price. Visitors run the neon gauntlet of the Trader's Plaza before they find what they came for."
 HOD_landmark_aln_yards:0 "Allanteen Six Shipyards"
 HOD_landmark_aln_yards_desc:0 "Among the oldest yards of the Republic: the Navy was rebuilt here fifteen thousand years ago, and the Venators the war needs now are laid down in the same orbital slips, deep inside Separatist space."
 HOD_landmark_fal_throne:0 "Falleen Throne"
 HOD_landmark_fal_throne_desc:0 "The Falleen call their capital, not Coruscant, the true seat of civilization. House Sizhran rules from its palace above the jade roofs; below it the Yellow District sells everything the galaxy makes."
 HOD_landmark_fal_harbour:0 "Hocekureem Spaceport"
 HOD_landmark_fal_harbour_desc:0 "Freighters come down on the terraces by the Hocekureem Sea; inland the Throne Foundries smelt the ore of the Ice Crown."
 HOD_landmark_bth_clans:0 "Combined Clans Center"
 HOD_landmark_bth_clans_desc:0 "Where the Bothan clans meet under one copper dome, and where every secret in the galaxy is eventually for sale."
 HOD_landmark_bth_cities:0 "Cities of the Rhyde'vak"
 HOD_landmark_bth_cities_desc:0 "Breil, Blee'starn on its island, Holm'starn on its peninsula: stone towns under copper cones along the Rhyde'vak ocean, and fishing villages like Fey'starn on its shores."
 HOD_landmark_htt_bilbousa:0 "Bilbousa"
 HOD_landmark_htt_bilbousa_desc:0 "The Hutts took a lush world and turned it into bogs under greasy rain. Bilbousa sprawls under its bulbous domes; the clans keep their palaces on what solid ground is left."
 HOD_landmark_htt_mines:0 "Nal Hutta Strip Mines"
 HOD_landmark_htt_mines_desc:0 "Crawlers strip the planet to the bone and ship it all to Nar Shaddaa."
 HOD_landmark_toy_royal:0 "Toydarian Royal Palace"
 HOD_landmark_toy_royal_desc:0 "The king of Toydaria rules from his palace on a mountain peak above the fog; Toydor, the largest city, rises from the muck below."
 HOD_landmark_toy_arnel:0 "Arnel"
 HOD_landmark_toy_arnel_desc:0 "Ten rings of water and land in the swamps feed the world; the Hutts' stronghold in the forests watches them."
 HOD_landmark_qsh_palace:0 "Three Families Palace"
 HOD_landmark_qsh_palace_desc:0 "Nobody breathes the air of Quesh without a mask but the Hutts. The Three Families rule from their sealed palace and sell what the poisoned world distils."
 HOD_landmark_nim_hkd:0 "Hoersch-Kessel Drive"
 HOD_landmark_nim_hkd_desc:0 "The gentle Nimbanel keep the Hutts' books, and half the hyperdrives in Hutt Space come from the test rings outside Hoersch-Kessel's tower."
 HOD_landmark_oba_palace:0 "Pyke Palace"
 HOD_landmark_oba_palace_desc:0 "The high fortress of the Pyke Syndicate stands on the obsidian crags of Oba Diah; every load of Kessel spice that leaves the docks below pays the Pykes first."
 HOD_landmark_kes_castle:0 "Kessel Castle"
 HOD_landmark_kes_castle_desc:0 "Kessel is two worlds: the Yaruba kings hold court in their castle on the green side, while the barren side is dug hollow by the spice mines the Pykes run."
 HOD_landmark_hon_nystao:0 "Nystao"
 HOD_landmark_hon_nystao_desc:0 "The Noghri clans meet in the great halls of Nystao. Older stones stand in the rainforest: a temple of the Infinite Empire and the broken academy of the Sith."
 HOD_landmark_tth_monastery:0 "B'omarr Monastery"
 HOD_landmark_tth_monastery_desc:0 "High on a mesa above the mauve jungle, the B'omarr monks keep their monastery; the Hutts keep everything else on Teth."
 HOD_landmark_gho_palmo:0 "Palmo"
 HOD_landmark_gho_palmo_desc:0 "Buyers and designers from across the galaxy tour Palmo's showrooms and twilleries; the silk comes down from the webberies of the Great Valleys."
 HOD_landmark_ydh_dodecapolis:0 "Dodecapolis"
 HOD_landmark_ydh_dodecapolis_desc:0 "When the moons pull the air away, the Givin seal their shells and wait; nothing on Yag'Dhul is built without first being calculated."
 HOD_landmark_mec_city:0 "Mechis City"
 HOD_landmark_mec_city_desc:0 "The galaxy's droid makers do not build their droids: Mechis does, in plants that run themselves on a world of ash and volcanoes."
 HOD_landmark_tak_castle:0 "Takodana Castle"
 HOD_landmark_tak_castle_desc:0 "Smugglers, pirates and worse fly their flags before Maz Kanata's castle on Nymeve Lake; inside, nobody draws a blaster."
 HOD_landmark_thy_xozhixi:0 "Xozhixi"
 HOD_landmark_thy_xozhixi_desc:0 "Without the Vratix there is no bacta, and without bacta half the galaxy's wounded die. Xozhixi has its old name back; the corporations still own the vats."
 HOD_landmark_csi_csaplar:0 "Csaplar"
 HOD_landmark_csi_csaplar_desc:0 "The ice took Csilla's surface long ago; the Chiss live beneath it. In Csaplar the Syndicure argues under the Assembly Cupola while the fleets that guard the Ascendancy are commanded from the halls around it."
 HOD_landmark_cop_city:0 "Copero City"
 HOD_landmark_cop_city_desc:0 "A mountain world of the Ascendancy: Chiss terraces climb its basins, its yards build cruisers in orbit, and in the snow stand ruins older than the Chiss."
 HOD_landmark_csa_station:0 "Csaus Station"
 HOD_landmark_csa_station_desc:0 "A cold frontier where two of the Ascendancy's families keep holdings in sight of each other, and their armed freighters do not always stay in orbit."
 HOD_landmark_cio_spire:0 "Xodlak Spire"
 HOD_landmark_cio_spire_desc:0 "Cioral is a city from pole to pole, and the Xodlak family's spire is the highest thing on it."
 HOD_landmark_sho_station:0 "Ashfall Station"
 HOD_landmark_sho_station_desc:0 "Ash falls on Shola all year and magma runs in its rivers; the Besadii dig its shafts anyway, among the ruins of a people the planet already killed once."
 HOD_landmark_rot_works:0 "Rothana Heavy Engineering"
 HOD_landmark_rot_works_desc:0 "Under Rothana's ice, Kuat's subsidiary builds what the Republic will need if it ever goes to war: assault ships and six-legged walkers, finished in the honeycomb yards in orbit."
 HOD_landmark_hyp_factory:0 "Baktoid Droid Factory"
 HOD_landmark_hyp_factory_desc:0 "Wat Tambor's foundry pours battle droids onto a grey, rain-beaten world that nobody else wants."
 HOD_landmark_ris_cove:0 "Raider's Cove"
 HOD_landmark_ris_cove_desc:0 "Traders and smugglers drop into Raider's Cove from every island of Rishi, and the Republic listens to all of it from its post in the south."
 HOD_landmark_kam_tipoca:0 "Tipoca City"
 HOD_landmark_kam_tipoca_desc:0 "Above the endless storm-sea the Kaminoans keep their stilt cities, and in them the finest cloning science in the galaxy."
 HOD_landmark_gns_spires:0 "Stalgasin Hive Spires"
 HOD_landmark_gns_spires_desc:0 "The hives of Geonosis build the Separatists' armies in foundries under the rock and watch their prisoners die in the Petranaki Arena."
 HOD_landmark_tat_eisley:0 "Mos Eisley"
 HOD_landmark_tat_eisley_desc:0 "Under the twin suns the Hutts own the water, the ports and the law. You will never find a more wretched hive of scum and villainy."
 HOD_landmark_ryl_lessu:0 "Lessu City"
 HOD_landmark_ryl_lessu_desc:0 "The Twi'leks' capital stands on its rock above the plains; its towers have outlasted every master who tried to own Ryloth."
 HOD_landmark_rod_city:0 "Iskaayuma"
 HOD_landmark_rod_city_desc:0 "Rodia's cities stand on its waterways under great green domes, keeping the jungle and its hunters out."
 HOD_landmark_cph_tower:0 "Chaleydonia"
 HOD_landmark_cph_tower_desc:0 "The Crystal City rises among forests of turquoise spires; whoever holds its towers holds the Outer Rim road to the Core."
 HOD_landmark_jed_city:0 "Jedha City"
 HOD_landmark_jed_city_desc:0 "Pilgrims of a hundred faiths climb to the Holy City, and under it lies the kyber that every Jedi blade is built around."
 HOD_landmark_leh_temple:0 "Temple of the Ancients"
 HOD_landmark_leh_temple_desc:0 "The last Rakata live in huts on the beaches of the world that once ruled the Infinite Empire; above them the temple still keeps its secrets."
 HOD_landmark_fst_landing:0 "Farstine Landing"
 HOD_landmark_fst_landing_desc:0 "Freighters on the Five Veils run put down on Farstine's windswept pads to take on water and pay the Republic's tolls; out on the downs lie the bones of ships that fought over the route before."
 HOD_landmark_voh_station:0 "Vohai Unirail"
 HOD_landmark_voh_station_desc:0 "Kuat Drive Yards' monorail girdles the whole world; at Sensyno Station its trains glide in between garden terraces, and whoever holds the stations holds every road on Vohai."
 HOD_landmark_voh_foundry:0 "Vohai Foundries"
 HOD_landmark_voh_foundry_desc:0 "The smelters south of the line never cool; their stacks stain the gardens grey when the wind turns, and the Unirail carries their plate to every yard on the planet."
 HOD_landmark_alz_base:0 "Alzoc III Mines"
 HOD_landmark_alz_base_desc:0 "Under the Valley of Blizzards the mines cut deep into the ice; the outpost's towers watch the pad and the Talz who work the shafts. Separatist agents came here hunting a weapon, and some say they found it."
 HOD_landmark_pan_city:0 "Pantoran City"
 HOD_landmark_pan_city_desc:0 "The Chairman's government sits in white towers above the frozen plain; Pantora sends its senator to Coruscant and its tea parlors keep the secrets senators trade."
 HOD_landmark_nab_theed:0 "Theed Royal Palace"
 HOD_landmark_nab_theed_desc:0 "Above the Solleu falls the elected monarch rules from green-domed halls; the Battle of Naboo was won here, and Naboo has sent a Chancellor to the Republic."
 HOD_landmark_nab_gunga:0 "Otoh Gunga"
 HOD_landmark_nab_gunga_desc:0 "The Gungans' bubble city glows under the swamp lake; since the battle on the Great Grass Plains the Grand Army of the Gungans stands beside the Naboo, and the old sentry heads keep watch again."
 HOD_landmark_mal_palace:0 "Doge's Palace"
 HOD_landmark_mal_palace_desc:0 "The Dug Council sits under the spiked crown of Pixelito's palace, and the Republic pays well for Malastare's fuel and its loyalty."
 HOD_landmark_mal_crater:0 "Electro-Proton Crater"
 HOD_landmark_mal_crater_desc:0 "The Republic's new bomb broke the droid army here and opened the ground beneath it; what climbed out of the crater is still spoken of in whispers at the Narrows' podrace stands."
 HOD_landmark_hrk_pelekbaw:0 "Pelek Baw"
 HOD_landmark_hrk_pelekbaw_desc:0 "Balawai prospectors hold the capital on the plateau's edge; up in the highland jungle the Korun fight them, and a Jedi Master has gone into the jungle and not come back."
 HOD_landmark_sul_pinyumb:0 "SoroSuub Corporation"
 HOD_landmark_sul_pinyumb_desc:0 "Under Inyusu Tor the cavern city of Pinyumb runs on SoroSuub's refineries, and the corporation runs everything else."
 HOD_landmark_phe_port:0 "Phelarion Academy"
 HOD_landmark_phe_port_desc:0 "Port Tarkin's bays serve the Seswenna sector's patrols, and the academy above it sends young officers out to the Outer Rim."
 HOD_landmark_eri_tarkin:0 "Tarkin Family Compound"
 HOD_landmark_eri_tarkin_desc:0 "The Tarkins rule Eriadu's affairs from their walled house in the capital, and the Seswenna sector follows Eriadu."
 HOD_landmark_eri_factory:0 "Old Town Factoryville"
 HOD_landmark_eri_factory_desc:0 "The stacks of Eriadu's foundries hang a black pall over the jungle; the Outer Rim's warships are built from what they pour."
 HOD_landmark_tib_city:0 "Tibrina"
 HOD_landmark_tib_city_desc:0 "The Ishi Tib raise their capital out of living coral above the glowing sea; Suribran Tu rules it from his reef fortress, and his revolution has taken Tibrin over to the Confederacy."
 HOD_landmark_cer_vale:0 "Mundi's Vale"
 HOD_landmark_cer_vale_desc:0 "Cerea's elders keep their world green and unhurried, and leave machines and starships to the offworlders behind their citadel walls."
 HOD_landmark_cer_citadel:0 "Asphodar 3"
 HOD_landmark_cer_citadel_desc:0 "The offworlders' citadel holds what little industry Cerea tolerates, walled off from the farms around it."
 HOD_landmark_cer_schools:0 "Shyarn-Ado Training Schools"
 HOD_landmark_cer_schools_desc:0 "Most Cerean young are sent to the Shyarn-Ado schools to learn to fight; Ki-Adi-Mundi's people do not come to war untrained."
 HOD_landmark_btu_outpost:0 "Black Spire Outpost"
 HOD_landmark_btu_outpost_desc:0 "The last trading post before Wild Space, built among the petrified spires of giant trees; smugglers, traders and the Hutts' agents all pass through its market."
 HOD_landmark_btu_ruins:0 "The Old Post"
 HOD_landmark_btu_ruins_desc:0 "Older than the outpost, the ruined post and the Jedi temple in the Wilds keep records of the frontier no one else bothered to write down."
 HOD_landmark_bak_salis:0 "Bakur Memorial Building"
 HOD_landmark_bak_salis_desc:0 "Bakura's government sits in the Bakur Complex between the West and East rivers; the Separatist attack of 22 BBY killed the Ruling Synod in it."
 HOD_landmark_bak_port:0 "D'aarmont Spaceport"
 HOD_landmark_bak_port_desc:0 "Namana exports leave Bakura from the spaceport on the quartz outcrop of D'aarmont, powered by the station on the dormant volcano."
 HOD_landmark_end_brighttree:0 "Bright Tree Village"
 HOD_landmark_end_brighttree_desc:0 "The Ewoks of the Happy Grove live high in the redwoods; anyone who fights in their forest fights the forest too."
 HOD_landmark_end_keep:0 "Terak's Keep"
 HOD_landmark_end_keep_desc:0 "King Terak's Sanyassan Marauders raid the forest from their stone stronghold on the savanna."
 HOD_landmark_hth_outpost:0 "Outpost Beta"
 HOD_landmark_hth_outpost_desc:0 "A handful of prefab huts and gun towers on the Icefall Plains watch an empty ice world; the wampas take more sentries than any enemy has."
 HOD_landmark_hth_graveyard:0 "Starship Graveyard"
 HOD_landmark_hth_graveyard_desc:0 "Warships of an older war lie frozen in Hoth's glaciers, and salvage crews still cut metal out of the ice."
 HOD_landmark_ano_city:0 "Anoat City"
 HOD_landmark_ano_city_desc:0 "Anoat City's towers stand in a yellow haze from its own refineries; the sector's industry runs through it."
 HOD_landmark_ano_shrine:0 "Jedi Shrine of Anoat"
 HOD_landmark_ano_shrine_desc:0 "An old Jedi shrine stands out in the poisoned waste, kept by the Order through the Clone Wars."
 HOD_landmark_uta_pau:0 "Pau City"
 HOD_landmark_uta_pau_desc:0 "Pau City is cut into the walls of a great sinkhole, ledge upon ledge, its landing platforms jutting over the drop; the Pau'an elders have governed Utapau from there for millennia."
 HOD_landmark_uta_pit:0 "Taqual Racing Pit"
 HOD_landmark_uta_pit_desc:0 "In a minor sinkhole the Utapauns race round the pit floor while the crowds watch from the lip."
 HOD_landmark_uta_mounds:0 "Killik Mounds"
 HOD_landmark_uta_mounds_desc:0 "Hive mounds of the long-vanished Killiks still stand on the plains, honeycombed with tunnels nobody fully mapped."
 HOD_landmark_que_city:0 "Queyta Foundry City"
 HOD_landmark_que_city_desc:0 "Techno Union foundries terrace the flank of a dead volcano, their spires rising over the smoke."
 HOD_landmark_que_forge:0 "Geothermal Forge"
 HOD_landmark_que_forge_desc:0 "A forge deck stands on legs over a lava lake, drawing its heat straight from the planet."
 HOD_landmark_slv_city:0 "Sluis Van City"
 HOD_landmark_slv_city_desc:0 "The Sluissi have built ships for the galaxy for centuries; their capital winds its spiral towers round a great domed assembly hall."
 HOD_landmark_slv_lift:0 "Orbital Lift Complex"
 HOD_landmark_slv_lift_desc:0 "The cargo lift feeds the orbital shipyards above Sluis Van with ore and parts from the surface."
 HOD_landmark_mus_klegger:0 "Klegger Corp Mining Facility"
 HOD_landmark_mus_klegger_desc:0 "The Klegger Corp's collector arms reach out over the lava river, skimming minerals from the flow for the Techno Union."
 HOD_landmark_mus_fralideja:0 "Fralideja"
 HOD_landmark_mus_fralideja_desc:0 "The Mustafarians' capital stands on a black rock shelf, mushroom towers ringed by a lava channel."
 HOD_landmark_mus_ziton:0 "Zitontown"
 HOD_landmark_mus_ziton_desc:0 "A mining town on a ledge high over a lava river, its ore chutes running down to the flow."
 HOD_landmark_mph_shanpan:0 "Shanpan"
 HOD_landmark_mph_shanpan_desc:0 "Manpha's capital stands on pilings over the swamp, its huts joined by plank walkways."
 HOD_landmark_mph_fishery:0 "Shanpan Fisheries"
 HOD_landmark_mph_fishery_desc:0 "The fisheries' long piers and drying racks feed Shanpan from the shallow sea."
 HOD_landmark_ter_spire:0 "Terminus Spire"
 HOD_landmark_ter_spire_desc:0 "The great spire marks the end of the Hydian Way, where the trade of half the Outer Rim is counted."
 HOD_landmark_ter_port:0 "Hydian Spaceport"
 HOD_landmark_ter_port_desc:0 "Freighters from the length of the Hydian Way land at the spaceport on the city's rim."
 HOD_landmark_bel_plawal:0 "Plett's Well"
 HOD_landmark_bel_plawal_desc:0 "In the Plawal Rift, warmed by volcanic vents between red-black cliffs, the Jedi Master Plett founded a quiet refuge; the town that grew round his house still keeps the jungle in the ice."
 HOD_landmark_bel_botun:0 "Bot-Un"
 HOD_landmark_bel_botun_desc:0 "Bot-Un's great dome spans a rift valley, holding its warm air against the glaciers above."
 HOD_landmark_bel_tomb:0 "The Tomb"
 HOD_landmark_bel_tomb_desc:0 "East of the Scar the Infinite Empire built its Deep Prison into the ice; what the Rakata locked away there has never been fully counted."
 HOD_landmark_kar_port:0 "Karfeddion Spaceport"
 HOD_landmark_kar_port_desc:0 "Hangars, repair yards and shady cantinas: the spaceport is where half the Western Reaches' freighters stop for parts and the other half for work nobody asks about."
 HOD_landmark_kar_vandron:0 "Vandron Keep"
 HOD_landmark_kar_vandron_desc:0 "The seat of House Vandron, one of the noble houses of the Senex sector, ruling its estates from behind old walls."
 HOD_landmark_kar_arena:0 "Skull Crackers Arena"
 HOD_landmark_kar_arena_desc:0 "Karfeddion's smashball fans follow the Skull Crackers with a devotion the Senate never earned."
 HOD_landmark_mrd_village:0 "Lurmen Village"
 HOD_landmark_mrd_village_desc:0 "The Lurmen came to Maridun's grasslands from Mygeeto to escape the wars of others; under Tee Watt Kaa their village keeps one rule above all: no one here takes up arms."
 HOD_landmark_mrd_outpost:0 "Separatist Outpost"
 HOD_landmark_mrd_outpost_desc:0 "A Separatist landing craft set down in the tall grass, far from any front: a quiet field where new weapons can be tested where no one will see."
 HOD_landmark_mrd_tree:0 "Giant Tree Groves"
 HOD_landmark_mrd_tree_desc:0 "Where water runs close under the plains, Maridun's great trees rise over the grass, their seed pods drifting for kilometres on the wind each season."
 HOD_landmark_ort_glid:0 "Glid Station"
 HOD_landmark_ort_glid_desc:0 "Pantora claims Orto Plutonia, and the Republic hollowed an outpost into one of its great ice spires to watch the frozen plains, though few expected anything to be there to watch."
 HOD_landmark_ort_talz:0 "Talz Village"
 HOD_landmark_ort_talz_desc:0 "The Talz carved their homes into the canyon walls long before anyone in Pantora thought to draw the planet on a map; their chieftains answer to no one beyond the ice."
 HOD_landmark_ort_beetles:0 "Separatist Outpost"
 HOD_landmark_ort_beetles_desc:0 "Two Separatist beetle transports set down on the ice, a forward post on a world neither side had any good reason to want."
 HOD_landmark_rug_kingcoral:0 "Meeting Grounds"
 HOD_landmark_rug_kingcoral_desc:0 "When Rugosa's seas boiled away they left forests of coral skeletons standing in the sand; Toydaria keeps the moon as neutral ground where envoys can meet away from the Hutts' ears."
 HOD_landmark_rug_cavern:0 "Coral Caverns"
 HOD_landmark_rug_cavern_desc:0 "The old sea floor is riddled with caverns, dry since the oceans went; smugglers and patrols alike have used them to hide."
 HOD_landmark_qul_base:0 "Quell Landing Field"
 HOD_landmark_qul_base_desc:0 "A Republic garrison on the brown plains of a quiet Outer Rim world, built to guard the hyperlanes past it rather than the world itself."
 HOD_landmark_qul_spheres:0 "Sphere Fields"
 HOD_landmark_qul_spheres_desc:0 "Nobody has a good account of how Quell's great stone spheres grew out of the ground; surveyors mapped them, shrugged, and moved on."
 HOD_landmark_vnq_station:0 "Listening Station"
 HOD_landmark_vnq_station_desc:0 "A lonely Separatist sensor post among Vanqor's rocks, listening to the hyperlanes that run past Florrum."
 HOD_landmark_vnq_crystals:0 "Crystal Fields"
 HOD_landmark_vnq_crystals_desc:0 "Crystals split the red rock of Vanqor's highlands, and the caves beneath belong to the gundarks; few prospectors come back for a second look."
 HOD_landmark_vnq_wreck:0 "Gunship Wreck"
 HOD_landmark_vnq_wreck_desc:0 "Older wrecks than this one litter the gullies: Vanqor sits close to the pirate lanes, and not every ship that falls here is ever looked for."
 HOD_landmark_aba_ponsora:0 "Pons Ora"
 HOD_landmark_aba_ponsora_desc:0 "One of the few settlements on the white plains of the Void, Pons Ora lives on rhydonium, and on the regulars at Power Sliders who never seem to leave."
 HOD_landmark_aba_mine:0 "Rhydonium Mining Installation"
 HOD_landmark_aba_mine_desc:0 "Abafar's rhydonium is among the most refined fuel in the galaxy; the refinery at Pons Ora ships it to whoever pays, and every navy pays."
 HOD_landmark_rat_castle:0 "Castle Ventress"
 HOD_landmark_rat_castle_desc:0 "A black citadel on a red rock spur, raised by a warlord and taken by a stronger one; on Rattatak every castle changes hands the same way."
 HOD_landmark_rat_cauldron:0 "The Cauldron"
 HOD_landmark_rat_cauldron_desc:0 "The great pit where Rattatak's warlords settle their feuds in blood, cheered on by the crowds on the stone tiers; champions of the Cauldron are worth more than armies."
 HOD_landmark_rat_barterus:0 "Barterus"
 HOD_landmark_rat_barterus_desc:0 "A fighting ring in a warlord's camp where slaves and volunteers alike fight for their keep."
 HOD_landmark_vsk_lair:0 "Grievous's Lair"
 HOD_landmark_vsk_lair_desc:0 "On a pinnacle above the mists of Vassek's third moon stands a castle far from any lane worth watching, which is exactly why it was chosen."
 HOD_landmark_vsk_field:0 "Droid Landing Field"
 HOD_landmark_vsk_field_desc:0 "A deck on stilts above the swamp, where supply shuttles touch down and droids keep watch over a moon with nothing to watch but fog."
 HOD_landmark_ltm_warren:0 "Junker Warren"
 HOD_landmark_ltm_warren_desc:0 "The galaxy has dumped its refuse on Lotho Minor for generations; the Junkers who live among the burning heaps sort, salvage and sell whatever still works."
 HOD_landmark_ltm_lair:0 "The Lair"
 HOD_landmark_ltm_lair_desc:0 "Tunnels run deep under the junk mountains, and the Junkers tell of something in them that feeds on whatever wanders in."
 HOD_landmark_bdt_palace:0 "Bardottan Royal Palace"
 HOD_landmark_bdt_palace_desc:0 "Bardotta's queens rule from the palace on the highland terraces, its seat of both crown and faith; the Dagoyan Masters counsel from its halls and keep the old texts."
 HOD_landmark_bdt_temple:0 "Frangawl Temple"
 HOD_landmark_bdt_temple_desc:0 "The Frangawl Cult's ancient stronghold, carved into the mountains when the cult still ruled; it has stood empty for centuries, or so Bardotta believes."
 HOD_landmark_bdt_port:0 "Jour-un"
 HOD_landmark_bdt_port_desc:0 "Bardotta's great port and trading hub, where offworld freighters meet the caravans down from the highlands."
 HOD_landmark_sci_vault:0 "Main Vault"
 HOD_landmark_sci_vault_desc:0 "On an icy peak above the capital the InterGalactic Banking Clan keeps its Main Vault: the records and wealth that every government in the galaxy, Republic and Confederacy alike, owes money to."
 HOD_landmark_sci_clovis:0 "Clovis' Residence"
 HOD_landmark_sci_clovis_desc:0 "A banker-senator's villa on a snowy ledge, where Rush Clovis entertains those who want the Banking Clan's ear."
 HOD_landmark_clc_mingpo:0 "Ming Po Town"
 HOD_landmark_clc_mingpo_desc:0 "The Ming Po live quietly among the snowy forests; their queens are rumoured to have been chosen by the spirits of the trees as long as the town has stood."
 HOD_landmark_clc_dwcamp:0 "Death Watch Camp"
 HOD_landmark_clc_dwcamp_desc:0 "Exiled from Mandalore, Death Watch drills in hidden camps on cold worlds nobody watches, waiting for the day the pacifist Duchess falls."
 HOD_landmark_clc_yarkora:0 "Yarkora Colony"
 HOD_landmark_clc_yarkora_desc:0 "For more than a century a Yarkora colony has kept to itself in the cold blue sands of Carlac's equator."
 HOD_landmark_ale_village:0 "Aleena Village"
 HOD_landmark_ale_village_desc:0 "The Aleena build their villages on the mesa tops among the arbozoic trees, whose roots hang over the cliffs; the hollowed trunks of the dead ones, the colossi, are kept as monuments."
 HOD_landmark_ale_seal:0 "The Great Seal"
 HOD_landmark_ale_seal_desc:0 "In the distant past the Aleena forged a golden disk to mark the parting of the surface from the Underworld below, and swore that neither world would cross it again."
 HOD_landmark_ale_chapter:0 "Jedi Chapter House"
 HOD_landmark_ale_chapter_desc:0 "Long before the war the Jedi kept a chapter house on Aleen, the centre of the Order's work on the planet."
 HOD_landmark_qii_imbraani:0 "Imbraani"
 HOD_landmark_qii_imbraani_desc:0 "Qiilura's farming capital, where a Neimoidian governor collects the harvests and the farmers keep their opinions of him to themselves."
 HOD_landmark_qii_teklet:0 "Teklet"
 HOD_landmark_qii_teklet_desc:0 "The town's great dishes carry every message in and out of Qiilura."
 HOD_landmark_kir_colony:0 "Artisan Colony"
 HOD_landmark_kir_colony_desc:0 "Fifty thousand Togruta made Kiros a colony of artists, and their sculpted towers stand among the valleys like a gallery under the sky."
 HOD_landmark_kir_falls:0 "Great Falls"
 HOD_landmark_kir_falls_desc:0 "The colony's founders chose the valley for its waterfalls, and the falls still draw painters from across the sector."
 HOD_landmark_shi_corvala:0 "Corvala"
 HOD_landmark_shi_corvala_desc:0 "The capital of the Togruta homeworld, its striped towers rising over the turu-grass like the montrals of the people who built them."
 HOD_landmark_shi_village:0 "Togruta Village"
 HOD_landmark_shi_village_desc:0 "In the villages of the colourful grasslands, Togruta still hunt in packs as their ancestors did, and the Jedi still come looking for gifted children."
 HOD_landmark_bre_cormond:0 "Cormond"
 HOD_landmark_bre_cormond_desc:0 "On the salt flats between the Suporro Sea and the Gravaal Mountains the Brentaal Houses built their capital, and through it runs the trade of two of the galaxy's busiest hyperlanes."
 HOD_landmark_bre_oradin:0 "Oradin Spaceport"
 HOD_landmark_bre_oradin_desc:0 "West of Vuultin lies one of the largest spaceports on the Perlemian Trade Route's crossroads."
 HOD_landmark_bre_stadium:0 "Votrad Stadium"
 HOD_landmark_bre_stadium_desc:0 "The stadium at Votrad hosts the games and the great performances of the Houses."
 HOD_landmark_sko_mounds:0 "Power Mounds of the Elders"
 HOD_landmark_sko_mounds_desc:0 "In the Clouds of Cormelish the Skakoan Elders gather in their Power Mounds, where no outsider has ever been invited; the Techno Union's decisions are made there."
 HOD_landmark_sko_foundry:0 "Techno Union Foundries"
 HOD_landmark_sko_foundry_desc:0 "Skako's foundries have built the Techno Union's wealth for generations, under an atmosphere that would crush any visitor without a suit."
 HOD_landmark_sko_port:0 "Southern Spaceport"
 HOD_landmark_sko_port_desc:0 "Pressure-sealed terminals on the rim, where offworld freighters dock without ever opening to Skako's air."
 HOD_landmark_skm_purkoll:0 "Purkoll"
 HOD_landmark_skm_purkoll_desc:0 "The Techno Union keeps its headquarters on Skako Minor, where its executives can breathe without the pressure suits their homeworld forces on them; Purkoll's spires rise out of the mist over the fungal forests."
 HOD_landmark_skm_workshop:0 "Wat Tambor's Workshop"
 HOD_landmark_skm_workshop_desc:0 "In a canyon outside Purkoll the Techno Union's foreman keeps a private workshop, where new droid designs are built and tested far from rivals' eyes."
 HOD_landmark_skm_village:0 "Poletec Village"
 HOD_landmark_skm_village_desc:0 "The Poletecs build their huts on the tops of the rock pillars near Purkoll and ride keeradaks between them; their chief has little love for the offworld industrialists in the valley below."
 HOD_landmark_dev_serat:0 "Montellian Serat"
 HOD_landmark_dev_serat_desc:0 "Devaron's capital is as old as Galactic City on Coruscant, its terraces climbing a hill beneath the Blue Mountains; Devaronian men wander the stars while its women govern at home."
 HOD_landmark_dev_parting:0 "Point of Parting"
 HOD_landmark_dev_parting_desc:0 "In ancient Plaeree stands the Point of Parting, where Devaronian travellers have taken leave of their families for as long as the city has existed."
 HOD_landmark_dev_eedit:0 "Temple of Eedit"
 HOD_landmark_dev_eedit_desc:0 "Deep in the vine jungles the Jedi keep the Temple of Eedit, a place of rebirth and contemplation; the Devaronians count it among the oldest buildings on the planet."
 HOD_landmark_dag_cave:0 "Cave of Evil"
 HOD_landmark_dag_cave_desc:0 "Under a colossal gnarltree a cave breathes the cold of the dark side; the swamp's creatures give it a wide berth, and the few who have gone in came out changed."
 HOD_landmark_dag_dagger:0 "Mount Dagger"
 HOD_landmark_dag_dagger_desc:0 "An ancient shield volcano worn down by ages of rain, the only high dry ground in the endless bogs."
 HOD_landmark_prs_center:0 "Intergalactic Communications Center"
 HOD_landmark_prs_center_desc:0 "Praesitlyn's great relay carries the messages of half the galaxy across the Core and the Mid Rim; whoever holds it hears everything and can silence anyone."
 HOD_landmark_prs_redoubt:0 "Redoubts of the Freedom's Sons"
 HOD_landmark_prs_redoubt_desc:0 "Generations ago the Freedom's Sons dug five massive strongpoints round the Center, and the militia still drill in their trenches."
 HOD_landmark_gaf_assembly:0 "Assembly House"
 HOD_landmark_gaf_assembly_desc:0 "From the domed Assembly House in Eyat the human colonists govern Gaftikar, and the reptilian Marits, the majority of its people, have never been given a seat in it."
 HOD_landmark_gaf_nests:0 "Marit Nests"
 HOD_landmark_gaf_nests_desc:0 "In the woods beyond the heath the reptilian Marits raise their earthwork towns, and talk of driving the colonists into the sea grows louder each year."
 HOD_landmark_was_lodge:0 "Hunting Lodge"
 HOD_landmark_was_lodge_desc:0 "On a crag above the sea the Trandoshan hunters keep their lodge, its walls hung with the trophies of the prey they have released into Wasskah's forests and run down for sport."
 HOD_landmark_was_rocks:0 "Island Four"
 HOD_landmark_was_rocks_desc:0 "One of the moon's hunting grounds: pointed rock towers over thorn forest where the hunted hide, and where the hunters' best trophies have been taken."
 HOD_landmark_nel_rokrul:0 "Rokrul"
 HOD_landmark_nel_rokrul_desc:0 "The Nelvaanians of Rokrul live by the hunt among the frozen pines, and their shamans read the future in the paintings on their cave walls."
 HOD_landmark_nel_lab:0 "Techno Union Laboratory"
 HOD_landmark_nel_lab_desc:0 "Behind an ice cliff the Techno Union has built a laboratory nobody on Nelvaan was asked about; the village's young warriors who go near it do not come back."
 HOD_landmark_ord_raido:0 "New Raido"
 HOD_landmark_ord_raido_desc:0 "Ord Radama's capital rose after the old one fell, its grey-marble towers built where the canals meet the fens."
 HOD_landmark_ord_ruins:0 "Ruins of Livien Magnus"
 HOD_landmark_ord_ruins_desc:0 "Thousands of years ago the Republic and the Sith Empire fought over Livien Magnus until nothing was left standing; the marble shell of its palace and a fallen colossus still lie in the marsh."
 HOD_landmark_vju_chateau:0 "Chateau Malreaux"
 HOD_landmark_vju_chateau_desc:0 "The Malreaux family's chateau broods over the Bay of Tears, its cream and crimson walls stained by the acid rain; whatever drove Vjun's nobility mad began within these walls."
 HOD_landmark_vju_bitter:0 "Bitter End"
 HOD_landmark_vju_bitter_desc:0 "Across the bay lies Bitter End, a harbour city whose people keep indoors when the rain comes and do not talk about the chateau."
 HOD_landmark_aar_firebase:0 "Republic Firebase"
 HOD_landmark_aar_firebase_desc:0 "A prefab outpost on the dunes, all the Republic keeps on a dry world that was once covered in water."
 HOD_landmark_aar_arches:0 "Vondar Canyon"
 HOD_landmark_aar_arches_desc:0 "Rock arches and stone spires stand over the dry riverbed of Vondar Canyon, the last trace of the rivers that once ran across Aargonar."
 HOD_landmark_dro_rimsoo:0 "Rimsoo Seven"
 HOD_landmark_dro_rimsoo_desc:0 "Prefab wards in a jungle clearing of the Jasserak Lowlands, where the Republic's surgeons work in ninety percent humidity among fungi that rot everything they touch."
 HOD_landmark_dro_bota:0 "Bota Fields"
 HOD_landmark_dro_bota_desc:0 "Bota grows nowhere but Drongar and spoils within days of harvest: an adaptogen worth more than any other crop in the galaxy, and the reason anyone comes to this steaming world at all."
 HOD_landmark_nsh_hutta:0 "Hutta Town"
 HOD_landmark_nsh_hutta_desc:0 "The Smugglers' Moon: tower blocks with shanties bolted into every gap, neon over everything, and the Hutts taking their cut of all of it."
 HOD_landmark_cos_senate:0 "Galactic Senate"
 HOD_landmark_cos_senate_desc:0 "A thousand generations of the Republic have been argued out under this dome. Down the Processional Way the delegations still come, past the founders' statues, to the Grand Convocation Chamber; the Galactic Courts sit in judgement beside it."
 HOD_landmark_cos_temple:0 "Jedi Temple"
 HOD_landmark_cos_temple_desc:0 "The Order's home for millennia: the High Council in its spire, the Archives holding all the Republic's knowledge, the Room of a Thousand Fountains where Masters still find quiet above the city."
 HOD_landmark_cos_executive:0 "Federal District"
 HOD_landmark_cos_executive_desc:0 "The Chancellor's office in the Executive Building, the senators' apartments in 500 Republica, Umate's bare summit at Monument Plaza: the government lives within sight of itself."
 HOD_landmark_cos_ports:0 "Commerce District"
 HOD_landmark_cos_ports_desc:0 "The exchange trades in the goods of a thousand worlds under the towers of the north-east.  In CoCo Town Dex's Diner feeds the dockhands, and hears everything."
 HOD_landmark_cos_compor:0 "COMPOR Arcology"
 HOD_landmark_cos_compor_desc:0 "A mass of dark stone beside the Senate, raised for the Commission for the Protection of the Republic and its watchful bureaus. Its analysts read the HoloNet of a thousand worlds; what they do with it is not discussed."
 HOD_landmark_cos_entertainment:0 "Entertainment District"
 HOD_landmark_cos_entertainment_desc:0 "Senators at the Galaxies Opera House, smugglers and bounty hunters at the Outlander Club: all of Coruscant comes here after dark."
 HOD_landmark_cos_underworld:0 "Coruscant Underworld"
 HOD_landmark_cos_underworld_desc:0 "The Works rusts in silence, and below the shining levels Level 1313 swallows whoever the upper city would rather forget."
 HOD_landmark_boz_base:0 "Boz Pity Confederacy Base"
 HOD_landmark_boz_base_desc:0 "The Techno Union raised this fortress in a canyon of the graveyard planet as soon as Boz Pity joined Count Dooku's cause. Droid garrisons drill on its parade ground, and a grounded core ship waits on its landing ring for the day the Confederacy needs a staging point on the Republic's border."
 HOD_landmark_boz_foundry:0 "Foundry of the Confederacy"
 HOD_landmark_boz_foundry_desc:0 "Droid halls and smelters the Techno Union built on a world nobody else wanted. With Metalorn, Saleucami and Felucia, Boz Pity is to be one of the forges of the Separatist armies, if the crisis turns to war."
 HOD_landmark_boz_ruins:0 "Gargantelle Ruins"
 HOD_landmark_boz_ruins_desc:0 "A temple-mountain of the extinct Gargantelles, ringed by a still moat, its lotus towers crowned with three-faced heads. Legend says the caliphs of Mourn returned to their world when the last Gargantelle died; the temple has stood empty ever since."
 HOD_landmark_boz_skeletons:0 "Skeleton Fields"
 HOD_landmark_boz_skeletons_desc:0 "In this sand valley the bones of the Gargantelles lie where they fell, ribs taller than a walker and three-faced skulls half sunk in the drifts. Pilgrims from nearby systems still leave stelae round the valley's edge."
 HOD_landmark_boz_headstones:0 "Headstone Fields"
 HOD_landmark_boz_headstones_desc:0 "The great funerary obelisk of the Gargantelles rises over rows of carved stelae, and round it the graves of every species that has brought its dead to the graveyard planet for a thousand years."
 HOD_landmark_arcoplex:0 "The Arcoplex"
 HOD_landmark_arcoplex_desc:0 "The city-headquarters of Cybot Galactica, the galaxy's foremost maker of droids, rising in stepped arcs around its corporate spire. The company has begun clearing the forests around it by fire to make room for new assembly halls, and the smoke of its expansion drifts over the plains."
 HOD_landmark_mondder_spaceport:0 "Mondder Spaceport"
 HOD_landmark_mondder_spaceport_desc:0 "The primary spaceport of Mondder, capital of the Corporate Sector: holding bays numbered in the dozens - Docking Bays 41 and 45 among them - landing pads on pylons, and the Dream Emporium, where the Authority's wealthy and the Etti themselves come to be entertained."
 HOD_landmark_dance_dome:0 "The Free-Flight Dance Dome"
 HOD_landmark_dance_dome_desc:0 "An elegant bistro high above Mondder, its dancers floating free under a glass dome. The executives of the Corporate Sector Authority seal their deals at its tables; more than one meeting there has ended in blaster fire."
 HOD_landmark_ruuria_university:0 "University of Ruuria"
 HOD_landmark_ruuria_university_desc:0 "The oldest seat of learning in the Xappyh sector, its stone halls and library spire grown over the centuries with the segmented halls of the Ruurians who teach there. Historians from across the Outer Rim come to study its archives; its students argue the Separatist question late into every night."
 HOD_landmark_great_hive:0 "Great Hive of the First Colony"
 HOD_landmark_great_hive_desc:0 "The great hive of the First Colony, eldest of the 143 colonies into which every Ruurian is born and to which each belongs for life: a mound of fused silk cocoons, tunnels and stalked pods, lit from within by resin lamps."
 HOD_landmark_great_library:0 "Ruins of the Great Jedi Library"
 HOD_landmark_great_library_desc:0 "On a hill in the Ooroo Canyon stand the ruins of the Great Jedi Library, which Odan-Urr designed and raised to honour a promise to his Master Ooroo: once the greatest store of knowledge in the galaxy, a vast unadorned stone hall with most of its rooms below ground. The Cron Supernova burned it four thousand years ago, and the Jedi saved only a fraction of its holocrons. Archaeologists of the Order still dig in its lower chambers - now under the eyes of the Confederacy, whose claim over the system makes the Jedi uneasy."
 HOD_landmark_knossa:0 "Ruins of Knossa"
 HOD_landmark_knossa_desc:0 "Once the greatest city of Ossus, Knossa was built of stone and bronzium, its squat domes climbing the western Eocho Mountains around the Branch Library that Odan-Urr commissioned for scholars in a hurry. The supernova emptied it; its domes stand cracked and green with age, and the Ysanna who camp in its streets keep its shrines without remembering whom they honour."
 HOD_landmark_agorn_spaceport:0 "Knossa Spaceport"
 HOD_landmark_agorn_spaceport_desc:0 "The Jedi built this spaceport for the pilgrims who came to Ossus by the thousand: a promenade winding round Agorn Mountain, its landing terraces jutting from every turn. Few ships land there now. Above it, on a nearby peak, the Force vergence called the Eye of Ashlanae still glows faintly at night."
 HOD_landmark_first_temple:0 "Ruins of the First Temple"
 HOD_landmark_first_temple_desc:0 "The First Temple, the Jedi Praxeum where Odan-Urr trained under Master Ooroo, one of the oldest seats of the Order: a stepped platform, a ring of great columns round a cracked meditation dome, all of it overgrown with bamboo. The Ysanna call it sacred ground; even the Separatist surveyors who have come to Ossus leave it alone."
 HOD_landmark_citadel:0 "The Citadel"
 HOD_landmark_citadel_desc:0 "A maximum-security prison raised in 522 BBY by the Republic and the Jedi Order to hold Jedi who had gone rogue or fallen to the dark side: a dark tower on a pinnacle of basalt, reached only by a causeway between two lakes of yellow lava whose heat powers it. Its cells have held some of the most dangerous Force-users the Order ever failed. The plans of its tunnels and caves are kept in the Jedi Archives on Coruscant, and the Order hopes they will never be needed."
 HOD_landmark_shattered_hemisphere:0 "The Shattered Hemisphere"
 HOD_landmark_shattered_hemisphere_desc:0 "Long before the Republic found it, a cataclysm no record explains tore away nearly the whole southern hemisphere of Lola Sayu. Its crust still drifts in orbit as a belt of glowing fragments that makes every approach dangerous, and the surviving half slowly crumbles into the Sulfur Sea, the lava ocean that fills the broken edge."
 HOD_landmark_ringo_ring:0 "Ringo Vinda Station"
 HOD_landmark_ringo_ring_desc:0 "A ring of hull plating so vast it encircles the whole planet: the Ringo Vinda space station, a civilian graving dock on the Perlemian Trade Route where freighters and liners from half the Mid Rim come to be repaired, refitted and rebuilt. Its decks hold a city's worth of dockworkers, and its slips are never empty. With the Separatist crisis deepening, Republic officers have begun to look at it with a shipwright's eye."
 HOD_landmark_vindaport:0 "Vindaport"
 HOD_landmark_vindaport_desc:0 "The capital of Ringo Vinda, hung in tiers of domed houses from a great stone arch between two colossal pillars, above the head of the Great Mist Chasm. Its people are as proud of their arches as of their accent, which a Ringo Vindan keeps for life, wherever in the galaxy they end up."
 HOD_landmark_station_lift:0 "Station Lift"
 HOD_landmark_station_lift_desc:0 "The shuttle port between Vindaport and the ring above: a slender spire of stone and glass with three landing rings, where the dock crews and their cargo shuttle up to the station and down again at every shift."
 HOD_landmark_bravo_base:0 "Bravo Base"
 HOD_landmark_bravo_base_desc:0 "A Republic military facility on the arctic world of Rhen Var: prefab barracks, a hangar, landing pads and a sensor mast inside a perimeter of turrets. Its small garrison watches the Slice and the ruins, and with the Separatist systems drawing their lines ever closer, its commanders have begun asking Coruscant for more men."
 HOD_landmark_rhen_harbor:0 "Rhen Var Harbor"
 HOD_landmark_rhen_harbor_desc:0 "The ruins of a harbor town from the age before the ice: stone quays along a bay frozen solid, towers with empty arched windows, an arched bridge over the inlet and an old ship locked in the ice where its crew left it, thousands of years ago, when the cold came and never went away."
 HOD_landmark_rhen_citadel:0 "Rhen Var Citadel"
 HOD_landmark_rhen_citadel_desc:0 "A castle of the lost civilization on a snowy crag: curtain walls, round towers and a spired keep, reached over an arched bridge. Whoever built it vanished under the ice age, but its walls still stand, and every army that has come to Rhen Var has wanted to hold them."
 HOD_landmark_jedi_monument:0 "Jedi Monument"
 HOD_landmark_jedi_monument_desc:0 "An old Jedi temple, stepped and plain, with an obelisk over the grave of Ulic Qel-Droma: the Jedi who fell to the dark side in the Great Sith War, lost his bond to the Force, and came here to die in exile nearly four thousand years ago. The Order keeps the site quietly; pilgrims say the cold is gentler near the stone."
 HOD_landmark_mekhis_fortress:0 "Ruins of Mekhis' Fortress"
 HOD_landmark_mekhis_fortress_desc:0 "The broken black walls of the fortress the Sith Lord Darth Mekhis raised in Rhen Var's mountains during the Great Galactic War, until the Jedi Knight Satele Shan stormed it. Snow fills its courts; its tower still stands."
 HOD_landmark_rakatan_temple:0 "Forgotten Rakatan Temple"
 HOD_landmark_rakatan_temple_desc:0 "A dark stepped temple carved with Rakatan script, half sunk in the snow. The Duros archaeologist Levat argued it was built after the fall of the Infinite Empire, whatever its script says; scholars still argue, and the panels of script still glow faintly in the polar night."

l_english:
 HOD_BR_BOOKMARK_NAME:0 "Battle Royale"
 HOD_BR_BOOKMARK_DESC:0 "Battle Royale. No Republic, no Confederacy: every planet is its own country, and all start equal - no armies, one basic template, the same capital industry, the generic focus tree. War goals take days to justify and need no tension, and a world that capitulates is annexed on the spot."
 HOD_BR_CORUSCANT_DESC:0 "The capital of a Republic that is no more. Its towers still hold the richest planet in the galaxy - and every world wants it."
 HOD_BR_RAXUS_DESC:0 "Where the Confederacy would have been born. Now just one more world fighting for itself."
 HOD_br_every_world_for_itself:0 "Every World for Itself"
 HOD_br_every_world_for_itself_desc:0 "The Republic is gone and no Senate will judge a war between worlds. Any planet can find a reason to strike its neighbour."

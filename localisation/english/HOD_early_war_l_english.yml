l_english:
 HOD_early_war_tests:0 "Test: Early War"
 HOD_early_war_tests_desc:0 "Test decisions for the early-war local wars. Delete common/decisions/HOD_early_war_tests.txt when done."
 HOD_ewt_report:0 "Test: report the early war"
 HOD_ewt_report_desc:0 "Shows whether total war has started, then one message for every local war going on."
 HOD_ewt_attack:0 "Test: attack a neighbour"
 HOD_ewt_attack_desc:0 "We declare war on a random neighbour that can be attacked in the early war (not at war, no faction, no overlord), or on any such country if no neighbour qualifies. A local war starts."
 HOD_ewt_attacker_wins:0 "Test: the attacker wins"
 HOD_ewt_attacker_wins_desc:0 "Every attacked world behaves as if it had capitulated: the attacker's side (Republic, Confederacy, or the attacker alone) annexes it."
 HOD_ewt_skip_three_months:0 "Test: skip to the 3-month mark"
 HOD_ewt_skip_three_months_desc:0 "Every local war reaches its 3 months: the attacker has to make peace and the other side (Republic or Confederacy) annexes the world. A third-party attacker just makes peace."
 HOD_ewt_total_war_on:0 "Test: start total war"
 HOD_ewt_total_war_on_desc:0 "Lifts every early-war lock: war on anyone, guarantees, joining factions at war, calls to arms."
 HOD_ewt_total_war_off:0 "Test: back to the early war"
 HOD_ewt_total_war_off_desc:0 "Puts the early-war locks back."
 call_to_war_rule_total_war_only_desc:0 "Allies can only be called into a war once the Clone Wars escalate into total war."

 HOD_early_war.ok:0 "Understood."
 HOD_early_war.10.t:0 "Early War Report"
 HOD_early_war.10.d_early:0 "We are in the §Yearly war§!. Wars stay one against one: you cannot declare war on a country that is already at war, in a faction or a puppet, guarantees are closed, factions at war take no new members, and nobody can be called into a war. Help goes in as volunteers and lend-lease.\n\nTotal war begins one year after the Raxus Address. One message follows for every local war."
 HOD_early_war.10.d_total:0 "§RTotal war§! has begun: every early-war lock is lifted."
 HOD_early_war.11.t:0 "Local War: [HOD_ew_world.GetName]"
 HOD_early_war.11.d_rep:0 "[HOD_ew_world.GetName] is under attack by [HOD_ew_attacker.GetName], for the §YRepublic§!. Days fought: [?HOD_ewt_days] of 90.\n\nIf it capitulates, the Republic integrates it. If it holds out 90 days, or the attacker holds none of its states after 30, the Confederacy integrates it."
 HOD_early_war.11.d_cis:0 "[HOD_ew_world.GetName] is under attack by [HOD_ew_attacker.GetName], for the §YConfederacy§!. Days fought: [?HOD_ewt_days] of 90.\n\nIf it capitulates, the Confederacy integrates it. If it holds out 90 days, or the attacker holds none of its states after 30, the Republic integrates it."
 HOD_early_war.11.d_other:0 "[HOD_ew_world.GetName] is under attack by [HOD_ew_attacker.GetName], which fights for neither side. Days fought: [?HOD_ewt_days] of 90.\n\nIf it capitulates, [HOD_ew_attacker.GetName] annexes it. If it holds out, it makes peace and stays independent."
 HOD_early_war.20.t:0 "[HOD_ew_world.GetName] Falls"
 HOD_early_war.20.d:0 "[HOD_ew_world.GetName] has capitulated to [HOD_ew_attacker.GetName]. [HOD_ew_bloc.GetName] integrates the world."
 HOD_early_war.21.t:0 "[HOD_ew_world.GetName] Holds Out"
 HOD_early_war.21.d:0 "[HOD_ew_world.GetName] has held out against [HOD_ew_attacker.GetName], which has to make peace. [HOD_ew_bloc.GetName] integrates the world."
 HOD_early_war.22.t:0 "[HOD_ew_world.GetName] Holds Out"
 HOD_early_war.22.d:0 "[HOD_ew_world.GetName] has held out against [HOD_ew_attacker.GetName], which has to make peace. The world stays independent."

l_english:
 neutralsystems.1.title:0 "MANDALORE IN FLAMES"
 neutralsystems.1.desc:0 "Reports of crime syndicates such as the Black Sun are flooding in from across the city as they move in from the docks pillaging and terrorising our planets people. Our guards have been caught unprepared to fight off such an attack leaving us in a dire position.Deathwatch have moved into the palace and we need to make a decision on whether we sacrifice our morals and fight back against them, or listen to the people and allow a deathwatch government be put in place with Vizsla at the helm. It is quite clear that Deathwatch orchestrated this in order to get the support of the people, with Vizsla trying to make Mandalore a warrior system once again. Fighting back may lead us down a path of breaking neutrality as Count Dooku is having an increasing amount of involvement in our System's affairs. "
 neutralsystems.1.a:0 "The People Are On Vizsla's Side"
 neutralsystems.1.b:0 "We Will Not Bow To Terrorists"
 MAN_satine_kryze_desc:0 "Satine Kryze is a human female Mandalorian duchess and the pacifistic leader of the New Mandalorians and the planet Mandalore"
 MAN_pre_vizsla_desc:0 "Pre Vizsla is a human male who leads the feared Mandalorian organisation known as the Deathwatch"
 1_NEU_tt:0 "§RThe Deathwatch Will Attempt A Coup In Which They Will Attempt To Take Control. Stability Will Decrease Significantly. This may lead to a civil war breaking out on Mandalore§!"
 neutralsystems.2.title:0 "Mandalore Is Split"
 neutralsystems.2.desc:0 "After counting the referendum results of the big pro-war, pro-neutrality vote. The system is completely equally split between what to do and we must now make a decision for the good of our nation"
 neutralsystems.2.a:0 "Let Us Stay With Satine"
 neutralsystems.2.b:0 "New Leadership Is Needed"
 neutralsystems.3.title:0 "Mandalore Doubles Down On Neutrality"
 neutralsystems.3.desc:0 "The result of the Mandalore referendum has come in and neutrality has come out on top by a landslide, meaning that the system will now be staying with Satine."
 neutralsystems.3.a:0 "The System Will Stay Completely Neutral"
 neutralsystems.4.title:0 "Mandalore Changes Its Foreign Policy"
 neutralsystems.4.desc:0 "The referendum in Mandalore has concluded in the fashion that means that Mandalore will no longer be neutral and instead has taken a pro-war stance"
 neutralsystems.4.a:0 "Interesting"
 # --- Chapter 1: The Spark ---
 SW.1.t:0 "The MCA Vote"
 SW.1.d:0 "As the Military Creation Act is voted on, an assassin targets Senator Amidala. The galaxy holds its breath as the results of the attempt come in."
 SW.1.a:0 "An attempt was made on her life!"

 SW.2.t:0 "Obi-Wan on Kamino"
 SW.2.d:0 "Investigation into the failed assassination has led Obi-Wan Kenobi to the remote water world of Kamino. A clone army awaits discovery."
 SW.2.a:0 "Follow the clues."

 SW.3.t:0 "The Separatist Gathering"
 SW.3.d:0 "The Separatist leaders gather on Geonosis to finalize their plans for secession and war."
 SW.3.a:0 "Victory is near."

 # --- Chapter 2: The Capture ---
 SW.4.t:0 "Kenobi Captured"
 SW.4.d:0 "Obi-Wan Kenobi has been captured on Geonosis after discovering the droid foundries."
 SW.4.a:0 "Send him to the cells."

 SW.5.t:0 "SUPER EVENT: Dooku's Offer"
 SW.5.d:0 "Count Dooku visits Obi-Wan in his cell, speaking of corruption in the Senate and the influence of the Sith. He offers an alliance."
 SW.5.a:0 "The seeds of doubt are sown."
 SW.5.b:0 "I will never join you, Dooku."

 # --- Chapter 3: Geonosis ---
 SW.6.t:0 "The Battle of Geonosis"
 SW.6.d:0 "The Republic rescue attempt has begun. The first battle of the Clone Wars has erupted in the Geonosian arena."
 SW.6.a:0 "For the Republic!"

 SW.7.t:0 "SUPER EVENT: Windu vs Jango Fett"
 SW.7.d:0 "The Jedi Master Mace Windu confronts the galaxy's most dangerous bounty hunter on the sands of the arena."
 SW.7.a:0 "Windu strikes down Jango Fett."
 SW.7.b:0 "Jango manages to escape the carnage."

 # --- Chapter 4: The Final Duel ---
 SW.8.t:0 "SUPER EVENT: Fight with Dooku"
 SW.8.d:0 "The duel to determine the fate of the war. Anakin and Obi-Wan face off against the Sith Lord Dooku."
 SW.8.a:0 "Dooku kills Obi-Wan and enrages Anakin."
 SW.8.b:0 "Anakin loses his hand; Yoda arrives to save them."
 SW.8.c:0 "Dooku wins but allows them to live."
 SW.8.d:0 "Obi-Wan dies at Dooku's hand before Yoda arrives."
 
 SW.101.t:0 "The Fall of a Master"
 SW.101.d:0 "Obi-Wan Kenobi is dead. The Republic mourns a hero, while Anakin Skywalker faces a future without his mentor."
 SW.102.t:0 "A Secret Union"
 SW.102.d:0 "Despite the wounds of war, Anakin and Padmé have married in secret, even as the Council wonders who the Sith leader truly is."
 SW.103.t:0 "A Strange Mercy"
 SW.103.d:0 "Obi-Wan survives, but Dooku's refusal to strike the final blow leaves him questioning the Count's true motives."
 SW.104.t:0 "Anakin's Vengeance"
 SW.104.t:0 "Consumed by rage over Obi-Wan's death, Anakin swears revenge and prepares to walk a darker path outside the Order."
 
 SW.201.t:0 "A New Hand"
 SW.201.d:0 "Dooku has secured a victory. He prepares to meet his master with a trophy of the war."
 SW.202.t:0 "The Ultimate Weapon"
 SW.202.d:0 "The plans for the Great Weapon are safe. Geonosis was merely the beginning."
 SW.203.t:0 "Sidious's Approval"
 SW.203.d:0 "Lord Sidious is pleased. The plan to plunge the galaxy into chaos is unfolding perfectly."
 SW.204.t:0 "Remorse of the Sith"
 SW.204.d:0 "Killing his former Grand-Padawan has left Dooku shaken, haunted by the memory of Qui-Gon Jinn."
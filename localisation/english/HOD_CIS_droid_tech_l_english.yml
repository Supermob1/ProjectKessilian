l_english:
 ### Droid Military Tech Tree — Folder
 droid_folder:0 "Droid Military"

 ### ── Infantry Droid Row ──
 early_droid_infantry:0 "Mark One Sentinel War Droid"
 early_droid_infantry_short:0 "Mark 1 Sentinel"
 early_droid_infantry_desc:0 "Sentinels guarded Republic facilities for centuries. Slow and outdated, but cheap, tireless and already in the warehouses."
 high_republic_infantry_droids:0 "Foundry Assembly Lines"
 high_republic_infantry_droids_desc:0 "The Trade Federation's foundries standardise droid manufacture on vast automated assembly lines."
 late_republic_infantry_droids:0 "B1 Battle Droid"
 late_republic_infantry_droids_desc:0 "Baktoid Combat Automata's B1: thin, dim-witted, and produced by the million."
 cw_infantry_droids:0 "B1 Combat Upgrades"
 cw_infantry_droids_desc:0 "After the first battles against the clones, B1s receive better targeting and limited independent-thought routines."
 late_cw_infantry_droids:0 "Upgraded B1 Battle Droid"
 late_cw_infantry_droids_desc:0 "Tougher chassis and improved processors make the late-war B1 a less laughable opponent."
 imperial_infantry_droids:0 "Post-War Combat Droids"
 imperial_infantry_droids_desc:0 "What is left of the droid foundries builds security droids for whoever pays: the Empire, warlords, or the corporations themselves."

 ### ── Heavy Droid Row ──
 high_republic_heavy_droids:0 "Heavy War Droids"
 high_republic_heavy_droids_desc:0 "Armoured war droids for corporate security forces, built to hold a line rather than to win a war."
 late_republic_heavy_droids:0 "Modular Droid Foundries"
 late_republic_heavy_droids_desc:0 "Foundries that switch quickly between droid models let the Confederacy adapt its armies between battles."
 early_cw_heavy_droids:0 "B2 Super Battle Droid"
 early_cw_heavy_droids_desc:0 "The Techno Union's B2: wrist blasters, heavy plating, and the strength of a dozen B1s."
 late_cw_heavy_droids:0 "B2 Rocket Upgrades"
 late_cw_heavy_droids_desc:0 "Jet packs and rocket launchers give super battle droids new ways to break clone lines."
 imperial_heavy_droids:0 "B2-HA Super Battle Droid"
 imperial_heavy_droids_desc:0 "The heavy-assault B2 trades one wrist blaster for a missile launcher, the last word in Separatist infantry."

 ### ── Commando Droid Column ──
 hkb3_commando_droid:0 "BX Commando Droid"
 hkb3_commando_droid_desc:0 "BX-series commando droids: fast, agile and clever enough to infiltrate a Republic outpost."
 bx_battle_droid:0 "Commando Droid Upgrades"
 bx_battle_droid_desc:0 "Improved combat programming and vibroswords for the Confederacy's elite infiltrators."
 hk77_assassin_droid:0 "Assassin Droids"
 hk77_assassin_droid_desc:0 "Hunter-killer droids built to eliminate commanders and Jedi rather than to hold ground."

 ### ── Droideka Column ──
 droideka_early:0 "Droideka"
 droideka_early_desc:0 "Colicoid destroyer droids roll into battle, unfold, and fire behind their own deflector shields."
 droideka_adv:0 "Droideka Mark II"
 droideka_adv_desc:0 "Stronger shields and heavier twin blasters make the improved droideka a match for Jedi."

 ### ── MagnaGuard Column ──
 early_magnaguard:0 "IG-100 MagnaGuard"
 early_magnaguard_desc:0 "General Grievous' bodyguard droids, trained in combat by the general himself and armed with electrostaffs."
 adv_magnaguard:0 "MagnaGuard Elite Protocols"
 adv_magnaguard_desc:0 "Reprogrammed MagnaGuards lead assaults alongside the Confederacy's commanders."

 ### ── Spider Droid Column ──
 early_spider_droid:0 "Dwarf Spider Droid"
 early_spider_droid_desc:0 "The Commerce Guild's DSD1 dwarf spider droid: a walking blaster cannon that climbs where tanks cannot."
 cw_spider_droid:0 "OG-9 Homing Spider Droid"
 cw_spider_droid_desc:0 "A huge four-legged walker whose dish-mounted beam cannon can bring down gunships and walkers alike."
 late_spider_droid:0 "Spider Droid Upgrades"
 late_spider_droid_desc:0 "Heavier plating and improved fire control for the Commerce Guild's walking artillery."


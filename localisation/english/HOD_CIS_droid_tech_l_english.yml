 ### ── Subunit Names ──
 infantry_droid:0 "Infantry Droids"
 infantry_droid_desc:0 "Battalions of mass-produced battle droids. Individually expendable, collectively unstoppable."
 heavy_droid:0 "Heavy Droids"
 heavy_droid_desc:0 "Heavily armored assault droids that anchor the droid battle line."
 commando_droid:0 "Commando Droids"
 commando_droid_desc:0 "Elite infiltration and sabotage droids deployed in small, deadly units."
 magnaguard_droid:0 "MagnaGuards"
 magnaguard_droid_desc:0 "Elite bodyguard droids fielded as shock infantry."
 spider_droid:0 "Spider Droids"
 spider_droid_desc:0 "Walking weapons platforms providing heavy fire support."
 droideka_droid:0 "Droidekas"
 droideka_droid_desc:0 "Shielded destroyer droids capable of shredding infantry and vehicles alike."

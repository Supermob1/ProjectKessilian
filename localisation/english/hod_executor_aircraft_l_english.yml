l_english:

 # From the Executor tech tree (Steam Workshop 3734223606, original mod by lg13826), see CREDITS.md
 # Imperial aircraft TECHNOLOGY names and descriptions.
 # The tech tree keys (laat, maat, idt, aal, tie-*, etc.) are separate from the
 # *_equipment keys in Imperial_l_english.yml. Without these the techs render raw ids.

 # --- Gunship / transport line (imperial_transport_tech) ---
 laat:0 "LAAT/c Carrier"
 laat_desc:0 "The carrier LAAT, our first dedicated lifter: its magnetic clamps carry a walker or a platoon and its kit across this world at speed. Its gunship variant, the LAAT/i, trades the passenger bay for cannon and missile racks to clear the ground ahead of the landing."
 maat:0 "Medium Assault Transport"
 maat_desc:0 "An up-armoured evolution of the LAAT that cures the survivability problems of the original, landing in nearly any weather and climbing above the reach of native anti-air. Its sealed gunship variant stays aloft and pounds whatever the troops were sent to fight."
 idt:0 "Imperial Drop Transport"
 idt_desc:0 "A smaller, more nimble successor to the LAAT platform, built to slip past interception on the descent. Its aggressive gunship conversion dives on enemy formations and is gone before their guns can range it."
 aal:0 "Atmospheric Assault Lander"
 aal_desc:0 "The most heavily armoured lander in the line, deflector shield and all, built to disembark troops under withering fire. As a gunship it becomes a flying fortress, loitering over the fighting and soaking up everything thrown upward."
 tie-rp:0 "TIE Reaper"
 tie-rp_desc:0 "A dropship of the TIE line, bearing the iconic solar wings and built for atmosphere. It flies faster than anything the natives can scramble, deploying troops rapidly, and its stripped gunship variant becomes a pure strike craft."
 tie-rb:0 "TIE/RB Heavy Support"
 tie-rb_desc:0 "A heavy support TIE carrying an extra pod with two external laser cannons, its secondary turrets slaved to a droid brain so the pilot can concentrate on flying and the main guns. Built to bring heavy firepower against both ground and air targets."

 # --- Starfighter line (imperial_starfighter_tech) ---
 torrent:0 "T-16 Skyhopper"
 torrent_desc:0 "Incom's fast civilian airspeeder, fitted with a light laser cannon and flown by militia and early clone pilots while the military designs mature."
 z-95:0 "V-19 Torrent"
 z-95_desc:0 "The first starfighter mass-produced for the Grand Army: a rugged, simple interceptor with wingtip blasters and concussion missiles, holding the skies until the later designs arrive."
 tie_fighter:0 "TIE Fighter"
 tie_fighter_desc:0 "The first of our own TIE series to reach the line, a fast and agile fighter that ends our reliance on inherited Republic hulls and sets the pattern every later variant will build on."
 tie-sf:0 "TIE/SF"
 tie-sf_desc:0 "A two-seat evolution of the standard TIE, its second crewman working a rotating twin laser cannon and a variable warhead launcher so it can fire fore and aft at once. A significant advance on an iconic design."

 # --- Bomber line (imperial_bomber_tech) ---
 y-wing:0 "BTL-B Y-Wing"
 y-wing_desc:0 "The durable workhorse bomber of the old Republic navy, carrying everything from ion cannons to concussion missiles. Versatile and hard to kill, it gives our forces the heavy ordnance they lack."
 skipray:0 "Skipray Blastboat"
 skipray_desc:0 "A heavy strike craft classed as a capital ship for its sheer power output, mounting ion cannons, twin lasers, a proton torpedo launcher and a tractor beam. Less nimble, but devastating against ground targets when properly escorted."
 tie-sa:0 "TIE/SA Bomber"
 tie-sa_desc:0 "The dedicated bomber of the TIE line, trading agility for a heavy internal ordnance bay. It delivers the concentrated payload our ground offensives need to break fortified positions."
 scimitar:0 "Scimitar Assault Bomber"
 scimitar_desc:0 "The final evolution of the TIE bomber series, carrying sixteen separate missile racks able to engage many targets at once. A single Scimitar can decimate an entire enemy armoured spearhead."

 # --- Interceptor line (imperial_interceptor_tech) ---
 v_wing:0 "V-Wing"
 v_wing_desc:0 "A light, fast interceptor descended from Republic patterns, built to climb and close quickly and swat enemy aircraft before they reach our formations. The root of the Imperial interceptor line."
 tie-in:0 "TIE/IN Interceptor"
 tie-in_desc:0 "The logical successor to the V-Wing: faster, more heavily armed, and able to shrug off blows that would have destroyed its predecessor. Six laser cannons converge on a single target, and nothing survives the pass."
 tie-sk:0 "TIE Striker"
 tie-sk_desc:0 "A dedicated atmospheric fighter freed of the mass needed for the void, outperforming ordinary interceptors in air. Laser cannons and a proton bomb launcher let it shred opponents and slip away untouched."
 tie-vn:0 "TIE Vengeance"
 tie-vn_desc:0 "One of the fastest fighters we field, shielded and armed with laser cannons and concussion missile launchers. It foils enemy sensors, staying unseen until it is already on its target."
 tie-ba:0 "TIE Baron"
 tie-ba_desc:0 "A refinement of the Vengeance fitted with a hyperdrive and a deliberately altered paint scheme, flown as much to taunt our enemies as to fight them. The pinnacle of the Imperial interceptor line."

 # --- Defender line (imperial_defender_tech) ---
 arc-170:0 "ARC-170"
 arc-170_desc:0 "A rugged fighter-bomber that holds its own in a dogfight and delivers ground support in equal measure, with medium laser cannons, proton torpedoes and a tail turret. Heavier shields let it survive punishment that would down a lighter craft."
 tie_defender:0 "TIE Defender"
 tie_defender_desc:0 "The apex of Imperial starfighter design, shielded and hyperdrive-equipped, mounting a punishing mix of laser cannons, ion cannons and warhead launchers. Expensive, but a match for anything in the sky."

 # --- Gunship column (HOD 2026-11-08) ---
 laat_gunship:0 "LAAT/i Gunship"
 laat_gunship_desc:0 "The Low Altitude Assault Transport in its gunship fit: laser turrets and missile racks to clear the landing zone. LAAT/i gunships also join the divisions as air assault companies, dropping a reserve platoon where the line bends."
 maat_gunship:0 "LAAT/le Gunship"
 maat_gunship_desc:0 "A lighter, faster LAAT built purely as a gunship: no troop bay, more guns, for escort and close air support. Its crews also fly ahead of the divisions as gunship recon flights."
 idt_gunship:0 "Nu-class Attack Shuttle"
 idt_gunship_desc:0 "An armed shuttle that trades cargo space for heavy cannons, striking ground targets ahead of the landings. Fitted with medical teams, the same gunships pull the wounded off the field within minutes."
 tie-rp_gunship:0 "Theta-class Assault Shuttle"
 tie-rp_gunship_desc:0 "A heavily armoured assault shuttle that clears the landing zone with its own guns, and flies ammunition and power cells straight to the front: every gunship company moves faster and hits harder."
 aal_gunship:0 "Assault Lander Gunship"
 aal_gunship_desc:0 "The atmospheric assault lander fitted out as a flying battery for planetary assaults."

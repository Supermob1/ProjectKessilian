 assault_equipment_desc:0 "Assault Vehicles start off as 'Medium Tanks' and eventually reach 'Modern Tank' stats. These are basically jack of all trades tanks that can be modified to fit certain roles."
 light_equipment_desc:0 "Both Walkers and Speeders share the Light Brigade Unit type. 'Walkers' function the same way that 'Light Tanks' do. However, they have more armor and speed. Speeders work as a poor-man's light tank, easy to produce in numbers but incredibly vulnerable. The 'Speeder' can be mixed in with 'Walkers' to essentially create cheap light tank units at the cost of efficiency, or you could have a light brigade full of speeders to move at incredible speeds. These Vehicles are best paired with Armored Transports."

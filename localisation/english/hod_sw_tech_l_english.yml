 basic_hovercrafts_desc:0 "Mass-produced repulsor craft and Conveyex lines to move armies."
 bullet_train:0 "20-T Railcrawler Conveyex Transport"
 bullet_train_desc:0 "20-T Railcrawler Conveyex Transport"
 hovercraft_equipment:0 "Rapid Production Hovercraft"
 hovercraft_equipment_desc:0 "Unarmed but invaluable, these makeshift repulsorlift haulers keep the frontline supplied and move our troopers forward quickly and cheaply, sparing our irreplaceable combat vehicles for the fight. (Note: this is the only motorized tech that provides motorized equipment doubling as supply trucks.)"

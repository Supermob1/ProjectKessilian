 mortar_equipment:0 "Mortar Teams"
 mortar_equipment_desc:0 "Mortar Teams, built or bought by worlds that answer to neither Republic nor Confederacy."
 target_system1:0 "Target System I"
 target_system1_desc:0 "Crude local optics married to our salvaged tracking arrays let our gunners lead a moving target, landing the first shot where the enemy will be rather than where he was."
 target_system2:0 "Target System II"
 target_system2_desc:0 "Refined fire-control logic, jury-rigged from scavenged droid processors, sharpens our lead calculations. Our crews strike harder and more often before the natives can react."
 target_system3:0 "Target System III"
 target_system3_desc:0 "With our targeting cores tuned to their absolute limit, our gunners track and engage multiple movers at once. No primitive vehicle on this world can outrun a solution this precise."
 air_upgrade1:0 "Anti-Air Upgrade I"
 air_upgrade1_desc:0 "Atmospheric flight develops slowly on this world. Our first field modifications retune our cannons to lead these sluggish aircraft, improving our odds of bringing them down."
 air_upgrade2:0 "Anti-Air Upgrade II"
 air_upgrade2_desc:0 "Improved tracking servos and reworked targeting let our anti-air crews engage faster local machines and walk fire across an entire enemy formation."
 air_upgrade3:0 "Anti-Air Upgrade II"
 air_upgrade3_desc:0 "Our anti-air doctrine is now ruthlessly efficient. Few native aircraft survive a single pass over ground we hold, whatever altitude they attempt."
 ammo_improvement1:0 "Ammo Improvement I"
 ammo_improvement1_desc:0 "Reworked power packs and tighter gas-cell tolerances raise the punch of every blaster bolt, tearing deeper into enemy targets."
 ammo_improvement2:0 "Ammo Improvement II"
 ammo_improvement2_desc:0 "Improved energizer chambers and salvaged charge cells push our power packs further still, letting a single trooper drop targets that once took a squad."
 ammo_improvement3:0 "Ammo Improvement III"
 ammo_improvement3_desc:0 "Our ammunition and power packs now strike with brutal consistency. Each bolt and cell is rationed carefully, but every shot fired bites harder than anything this world can answer."
 art_upgrade1:0 "Artillery Upgrade I"
 art_upgrade1_desc:0 "We cannot bombard this world from orbit as we once did, so our guns must inherit that fury. These first refinements tighten our artillery and steady its fire."
 art_upgrade2:0 "Artillery Upgrade II"
 art_upgrade2_desc:0 "Reworked recoil systems and improved shell handling let our batteries fire faster and farther, bringing them closer to the devastation of a capital ship's barrage."
 art_upgrade3:0 "Artillery Upgrade III"
 art_upgrade3_desc:0 "Our artillery now answers like a turbolaser strike from above. Whole native positions are erased before they can range our guns in return."
 at_upgrade1:0 "Anti-Tank Upgrade I"
 at_upgrade1_desc:0 "Heavy armor demands heavier guns. Our first anti-tank refinements yield lighter weapons our troopers can carry forward to crack open enemy vehicles."
 at_upgrade2:0 "Anti-Tank Upgrade II"
 at_upgrade2_desc:0 "Improved focusing coils let our anti-tank weapons punch through thicker plate, defeating the heaviest armor this world has yet rolled out."
 at_upgrade3:0 "Anti-Tank Upgrade III"
 at_upgrade3_desc:0 "Our man-portable anti-tank weapons now burn through any hull the natives field. No enemy vehicle is safe within reach of our troopers."
 advanced_spg_equipment:0 "J-1 Proton Cannon"
 advanced_spg_equipment_desc:0 "A walking proton cannon whose shells crack shields and fortress walls from beyond the horizon."
 advanced_at_equipment:0 "AV-7 Mk II Antivehicle Cannon"
 advanced_at_equipment_desc:0 "A heavier AV-7 that anchors itself and breaks enemy armour at longer range."
 advanced_aa_equipment:0 "UT-AA Mk II Air Defence Tank"
 advanced_aa_equipment_desc:0 "An up-gunned UT-AA with better fire control against fast strike craft."
 small_repeater1:0 "Support Weapons I"
 small_repeater1_desc:0 "Light blaster repeaters give our squads steady covering fire, keeping the natives' heads down and our own casualties few."
 small_repeater2:0 "Macrobinocular Visors I"
 small_repeater2_desc:0 "Helmet optics that let troopers see and shoot in the dark."
 medium_repeater1:0 "Support Weapons II"
 medium_repeater1_desc:0 "Heavier squad repeaters lay down a far denser hail of blaster fire, breaking enemy advances before they reach our lines."
 medium_repeater2:0 "Macrobinocular Visors II"
 medium_repeater2_desc:0 "Better helmet optics with range-finding and thermal modes."
 heavy_repeater1:0 "Support Weapons III"
 heavy_repeater1_desc:0 "Crew-served heavy repeaters anchor our positions, their sustained fire shredding anything the locals send across open ground."
 heavy_repeater2:0 "Support Weapons IV"
 heavy_repeater2_desc:0 "The heaviest support weapons we can still field and maintain, capable of suppressing an entire enemy formation single-handed."
 imperial_thermal_detonator:0 "Thermal Detonators"
 imperial_thermal_detonator_desc:0 "Compact baradium grenades issued to every infantry squad."
 mobile_aa_equipment_desc:0 "The 'Mobile Anti-Air unit' is similar to how the 'Medium Anti-Air Tank' functions."
 mobile_at_equipment_desc:0 "The 'Mobile Anti-Tank unit' is similar to how the 'Medium Tank Destroyer' functions."
 mobile_art_equipment_desc:0 "The Mortar being equivalent to 'Advanced Artillery.' Every other 'Mobile Artillery Equipment' is similar to how the 'Medium SPG Tank' functions."

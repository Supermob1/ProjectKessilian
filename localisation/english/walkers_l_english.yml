  # Unique Walker Modules Localizations
  walker_pneumatic_damper:0 "Pneumatic Suspension Damper"
  walker_pneumatic_damper_desc:0 "Simple system of steel springs and pneumatic cylinders. Softens ground impact when walking, protecting mechanisms from breakdowns and easing control at high speeds."

  walker_hydropneumatic_recuperator:0 "Hydro-Pneumatic Step Recuperator"
  walker_hydropneumatic_recuperator_desc:0 "Advanced hydraulic system with high-pressure chromium-molybdenum cylinders. Captures and redirects kinetic energy of each step, granting substantial speed and eliminating vibration wear."

  # Secondary Light Guns
  walker_secondary_small_cannon:0 "Secondary Light Cannon"
  walker_secondary_small_cannon_desc:0 "Supplementary light cannon mounted in the hull to provide fire support without altering the vehicle's primary role."

  walker_secondary_heavy_mg:0 "Secondary Heavy Machine Gun"
  walker_secondary_heavy_mg_desc:0 "Additional heavy machine gun for engaging infantry and low-flying air targets."

  walker_secondary_auto_cannon:0 "Secondary Auto-Cannon"
  walker_secondary_auto_cannon_desc:0 "Rapid-fire automatic cannon mounted in the chassis to bolster overall firepower."

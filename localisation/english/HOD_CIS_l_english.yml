 CIS_the_price_of_liberty_desc:0 "Dooku has led portions of the galaxy to freedom from the corrupt human-centric republic. He truly cares for the citizens of the universe."
 CIS_money_from_the_clan:0 "Money from the Clan"
 CIS_money_from_the_clan_desc:0 "The Banking Clans of the galaxy are a source of unlimited wealth, and they have chosen to bestow some of that wealth upon our loose alliance." 

 CIS_dookus_dilemma_desc:0"Dooku faces one of the biggest dilemmas of his lifetime. Before him are many options, one in which he continues the bidding of his master Darth Sidious, one in which he sticks to his original ideals and frees the galaxy, and one where he restores the Sith to greatness and cast off his chains." 

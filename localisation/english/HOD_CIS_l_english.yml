 confederacy.10.t:0 "Brushfire Rebellions"
 confederacy.10.d:0 "It was a rainy, miserable night in the streets of Jabiim’s capital city. As usual.\n\n§gIn the barracks of the Bronze Nimbus Brigade, behind closed doors and cloaked in secrecy, a meeting had just taken place.§!\n\n§gAlto Stratus, commander of the brigade, emerged from the meeting room, followed by a representative of the Techno Union and an envoy from Raxus.§!\n\n§gNobody knew what was discussed that night, but soon after, the brigade armoury started filling with state-of-the-art weaponry.§!\n\n§gThis scene was not an uncommon one across the Republic. Onderon, Dac, Naboo, and many others were the planets where the representatives of the Count met with dissatisfied local leaders.§!\n\n§YAs the tensions inside the Republic escalate…§!"
 confederacy.10.a:0 "Dooku is ensuring the Powder Keg is filled and primed."

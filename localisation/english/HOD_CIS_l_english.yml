 confederacy.14.t:0 "A Necessary Evil"
 confederacy.14.d:0 ""§G… and our droid armies are manufactured by the Techno Union and the Corporate Alliance, our fleets are provided by the Trade Federation, and the treasury is bankrolled by all three!§!" §g§6Senator Kushi§! thundered, before dropping back into his seat.§!\n§g§3Mina Bonteri§! rose to speak§!. An unusually harsh storm battered the windows of the senate building on Raxus Secundus as the Separatist Senate engaged in a special session.\nAt the behest of the 'Peace Faction' of the Senate, a loose coalition where §3idealists§! and §6pacifists§! united with representatives of minor shipping and §1other corporate conglomerates§!, this session was called to address the ever-growing influence of the major corporations which fund, manufacture, and increasingly operate the Separatist war machine.\n\n"§7Major corporations have senate representation and control much of the Confederacy's military and financial apparatus. How are we any different from the Republic? We only wi-§!"\n\n§gCount Dooku raised a hand to silence the senator.§!\n\n"§CI understand your concerns, my friends. Truly I do. But armies, ships, logistical networks, and credits do not appear out of thin air. I am keenly aware of the parallels between corporatism in our Confederacy and the Republic.\n\nConsider this. In the Republic, corporations draft the legislation that governs their own conduct and vote on bills which they manipulate to turn a profit at the expense of everyone else. It is an open secret that they purchase senators to vote for motions which favor corporate interests. The only thing keeping the Republic from fracturing is a thinly veiled fiction that these despicable actions, and more, are not happening. A fiction supported by the Jedi.\n\nHere, no such fiction exists. The interests represented in this body are declared openly. I believe such transparency is not a flaw. I believe that there is room in our movement. I believe-§!"\nCacophonous applause erupted from the senate hall, cutting across party lines. §gDooku would continue his speech§!, encouraging unity among the disparate systems, species, and '§Lpatriotic organizations§!' that constituted the Confederacy. And they would all blindly laud him for it, almost like clockwork.\n§gHe spared a quick glance toward Senator §3Mina Bonteri§!.§! Poor fool. The major corporations, most of the Senate, and many of her 'allies' were loyal to him and his master. Why else would they have been appointed in the first place? Still, genuine §3idealists§! like her were perhaps a necessary evil, vital in selling the cheap lie that was galactic politics and the war at large.§!"
 confederacy.14.a:0 "Words are cheap."

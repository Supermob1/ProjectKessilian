 confederacy.1.t:0 "The Raxus Address"
 confederacy.1.d:0 ""My friends, it is a dark time for the galaxy. Though trillions cry out for succor, for the Republic to truly follow the ideals it claims to cherish, even for simple dignity, the Republic is unmoved! The luckiest of us are simply ignored, while the pleas of the rest are met with force pike and blaster.\n\n§RNo one who holds power§! — not the oligarchs in the Senate, not the Core elite whose wealth props them up, not the soulless bureaucrats who rip food away from our mouths, not even the Jedi behind their temple walls — cares for the common galactic citizen.\n\n§RBut for them, time has run out.§! Our cries have become a call to action. If they will not listen, will not acknowledge those people they claim to serve, they have no claim on us! No more will we lick the Republic's boots and beg for its scraps!\n\n§OThe time for our freedom, for our independence, for our prosperous future, is now!§!\n\nIn your name, I declare the §RConfederacy of Independent Systems§! a reality! And while we shall never seek war, to the Republic, I say: you shall not bar our way!"\n\n\nWith these words, and more, §RCount Dooku§! has split the galaxy asunder.\n\nWorlds that once saw no alternative to living under unfavorable conditions imposed by the Republic now look to the growing Confederacy as a chance for a better future. The Republic media is split between calling Dooku an insignificant demagogue and an existential, immediate threat to all the Republic.\n\nWhat is certain to all is that the thousand-year status quo of the Galactic Republic has been changed forever."
 confederacy.1.a:0 "For §Ofreedom§!, for the §Rfuture§!!"
 confederacy.1.b:0 "Damned Separatists!"
 confederacy.1.c:0 "The Republic continues to crumble."
 confederacy.2.t:"The General"
 confederacy.2.d:0 "The Jungle was familiar to §RThe Hunter§!, he may not remember his own name, but the rifle in his hands and the mask on his face are extensions of himself, the thrill of the hunt coursing through his veins.\n§RThe Hunter§! walked, and walked, until the vegetation got thinner, giving way to the buildings of a village. The noise of nature was replaced by an eerie silence, as he advanced through deserted streets. The silence was broken only by the sound of wind through empty buildings.\n\n§gThen, a whisper.§!\n\n“§YQymaen jai Sheelal§!”\n\n§gA name, carried by the wind from afar.§!\n\n“§YQymaen jai Sheelal§!”\n\n§gThe ethereal voice repeats, now behind him. The Hunter spins, and finds Her. A mask of karabbac skull, swords at her waist.§!\n\n“§YQymaen jai Sheelal§!”\n\n§gShe repeats. He finally realizes she is calling to him. §YQymaen jai Sheelal§!, yes that is his name, and she is his fated companion, his only equal.§!\n\n“§ORonderu lij Kummar§!”\n\nHe calls out, moving towards her, but he can make but a few steps before her chest explodes, pierced by a pair of claws.\n“HUK!” he bellows, charging towards her, but as he steps closer, her form fades into smoke. The sound of her voice is replaced by the pained laments of the starving.\n“§CKhagan.§!” comes the call from behind. He turns. Before him stand his most loyal warriors, his Izvoshra. But they as well are cut down before him, this time by blades of light and their brown-wearing wielders. Their laughs echo as they condemn his people to starvation, and his dead to a restless sleep, their just vengeance denied. Then he is engulfed in flames.\n\nHis eyes snap open in his mechanical prison. §YQymaen jai Sheelal§! is dead. Only §RGrievous§! remains. And he will get his vengeance."
 confederacy.2.a:0 "§RRise Lord Grevious§"
 confederacy.3.t:0 "A New Birth For Freedom"
 confederacy.3.d:0 "Across the Outer Rim there is a strange, almost indescribable feeling in the air. The Outer Rim has finally taken a stand for itself, but life this far from the Galactic Core has installed a deep sense of cynicism.\n\n§gAs these thoughts raced through the minds of billions, almost all broadcasts across the HoloNet were soon overtaken by the image of Count Dooku of Serenno - the face of the Separatist movement.§!\n\n§gDooku begins to speak:§!\n\n§Y"Since the dawn of the Galactic Republic, we the people of the Outer Rim have been continuously left abandoned and betrayed. Whilst the Core and Inner Rim continue to grow with no restraint in an era of peace, we remain forgotten. The Outer Rim is left destitute in a struggle to support itself whilst the Republic continues to take what we have and asks for more and more - all while bands of pirates and slavers still plague us in what should be a 'civilized age.'\n\nWe desire the ideals of the Republic. We want a free and equal society. However, the Republic will never give that to us. We are simply numbers to the corrupt politicians and Core Worlders who could not care if we lived in chains or not, as long as the credits flow.\n\nIf we want a free and fair galaxy, then we must make our own."§!\n\n§gHis speech continues for much longer, but the message is clear.§!\n\nFor the first time in a long time..."
 confederacy.3.a:0 "The Outer Rim is filled with a new found §CHope§!."
 confederacy.4.t:0 "Opening of the Congress"
 confederacy.4.d:0 "It is no secret that our newfound §CConfederacy§! is far from a wholly unified front. We are a confederacy of thousands of worlds, moons, and space stations, each with its own agenda and desires for our new government.\n\nHowever, we are more than just rabble-rousers or puppets to the whims of §GMegacorporations§!. Rather, we are a league of people who desire a fair shot at life and governance without the red tape and backroom deals of the §tRepublic.§!\n\nIn order to allow an open system of government, we have established a congressional hall on our acting capital of Raxus Secunda. With this new forum, we can begin to organize this myriad of ideas and interests into groups that can help shape our future in a more "calm and concise" manner.\n\nIt would be quite difficult to paint us as opportunist warlords when we hold an official forum where our citizens and their worlds can voice their feelings and concerns, for better or worse. If nothing else, we haven't seen any pirates host townhalls."
 confederacy.4.a:0 "For a §CFree§! and §7Just§! future!"
 confederacy.4.b:0 "For a §LSafe§! and §GProsperous§! future!"
 confederacy.5.t:0 "The Price Of Liberty"
 confederacy.5.d:0 "Count Dooku makes his entrance into the Separatist Senate.\n\nEver since the Raxus Address, he remains the voice and face of the Confederacy. His calm yet authoritative voice reaches all the senators, who have already approved this course of action, and most importantly the HoloNets across Separatist territory and beyond.\n\n§gHe speaks:§!\n\n§Y"Brothers, sisters, freedom fighters of all worlds and kinds, it is for Freedom we have begun our great struggle, yet I fear we must relinquish some, temporarily I hope, if we wish to triumph.§!\n\n§YThe great fleets of the Jedi and their hordes of mindless soldiers march against us, and we are but few scattered rebels. The Confederacy must unite. Let us raise our fists together and as one strike against our slavers!§!\n\n§YFor this purpose we must make sacrifices. Great industrial engines are in motion already and our droids pour from them to defend our systems. Thanks to our wonderful technology, we can only hope this war will be bloodless, but I do believe the so-called Republic will make sure it won't be so.§!\n\n§YGive all you can and know that your freedom depends on it. Every inch won in this war is an inch towards liberty for us and many generations after.§!"
 confederacy.5.a:0 "Let us hope no maintenance droid greased this slope."

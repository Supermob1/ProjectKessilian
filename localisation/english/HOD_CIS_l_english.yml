 CIS_get_rid_of_gunray:0 "Get Rid of Gunray"
 CIS_get_rid_of_gunray_desc:0"Gunray is a cancer upon the Confederacy. He must be removed if we are to truly have any hope of winning this war."
 CIS_sever_ties_with_sidious:0 "Sever Ties With Sidious"
 CIS_sever_ties_with_sidious_desc:0"Sidious is not fit to lead the Sith to fruition, only Tyrannus can make the Sith great again. We must sever ties with Sidious and start running this war on our own terms."
 CIS_peace_finds_a_way:0 "Peace Finds a Way"
 CIS_peace_finds_a_way_desc:0"We've achieved our goals of seceding from the Republic, and truthfully there is no need for more bloodshed in the galaxy. We should propose peace to the Republic and begin to govern our people." 
 CIS_path_to_power:0 "Path to Power"
 CIS_path_to_power_desc:0 "The Dark Side of the force
 CIS_gather_more_apprentices:0 "Gather More Apprentices"
 CIS_gather_more_apprentices_desc:0"For Darth Tyrannus to be truly considered a Sith Master he must have an apprentice. Thankfully the galaxy is full of those who wish to experience the full power of the dark side." 
 CIS_sith_war_droids:0 "Sith War Droids"
 CIS_sith_war_droids_desc:0 "With the Sith Empire making its return, we can still make use of the massive droid foundries on our worlds. This time around we'll give them a red tint."
 CIS_prepare_to_reveal_sidious:0 "Prepare To Reveal Sidious"
 CIS_prepare_to_reveal_sidious_desc:0 "Have you heard the Trajedy of Darth Sidious The Unwise, I thought not, it's not a story that the Jedi would tell you. He tried to restore Sith glory by working with Sith enemies. In the end it was his own apprentice that ended him."
 CIS_the_rule_of_sith:0 "The Rule of the Sith"
 CIS_the_rule_of_sith_desc:0 "The Rule of the Sith begins now! The galaxy shall bear withness to the LAST DAYS OF THE REPUBLIC"

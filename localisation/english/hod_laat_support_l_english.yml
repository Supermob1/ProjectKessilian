l_english:
 laat_air_assault:0 "Gunship Air Assault Companies"
 laat_air_assault_desc:0 "LAAT/i gunships attached to the division: a platoon dropped where the line bends, and the wounded lifted out on the way back. Divisions can add Air Assault support companies."
 laat_air_recon:0 "Gunship Recon Flights"
 laat_air_recon_desc:0 "Gunship crews flying ahead of the division spot the enemy and call fire onto him. Divisions can add Gunship Recon support companies."
 laat_medevac:0 "Gunship Medevac Companies"
 laat_medevac_desc:0 "Gunships with medical teams on board pull the wounded off the field within minutes. Divisions can add Medevac support companies."
 laat_supply_lift:0 "Gunship Supply Lift"
 laat_supply_lift_desc:0 "Gunships fly ammunition and power cells straight to the front, and every gunship company flies faster and tougher. Divisions can add Supply Lift support companies."
 laat_assault_company:0 "Gunship Air Assault Company"
 laat_assault_company_desc:0 "A flight of gunships with a reserve platoon: adds breakthrough, recon and casualty recovery."
 laat_recon_company:0 "Gunship Recon Company"
 laat_recon_company_desc:0 "Gunships that scout far ahead of the division and spot targets for its artillery."
 laat_medevac_company:0 "Gunship Medevac Company"
 laat_medevac_company_desc:0 "Gunships fitted as flying aid stations: more wounded come back to the ranks."
 laat_supply_company:0 "Gunship Supply Lift Company"
 laat_supply_company_desc:0 "Gunships that fly supplies straight to the front: the division needs less supply."
 REP_helicopter_equipment_1:0 "LAAT/i Ground-Support Gunship"
 REP_helicopter_equipment_1_desc:0 "LAAT/i gunships kept with the army for air assault, recon, medevac and supply runs."

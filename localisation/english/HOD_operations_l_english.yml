l_english:
 HOD_operations_category:0 "Galactic Operations"
 HOD_operations_category_desc:0 "The war is fought in operations. While one runs, only the hyperlanes to its objective planets are open, and when the timer runs out a ceasefire returns every other planet to its owner."
 HOD_op_name_1:0 "Battle of Geonosis"
 HOD_op_name_unknown:0 "Operation"
 HOD_op_side_REP:0 "Galactic Republic"
 HOD_op_side_CIS:0 "Confederacy"
 HOD_op_attack_70:0 "Attack: [HOD_op_name]"
 HOD_op_attack_70_desc:0 "Take every objective state before the timer runs out. They will be ours."
 HOD_op_defend_70:0 "Defend: [HOD_op_name]"
 HOD_op_defend_70_desc:0 "Hold at least one objective state until the timer runs out."
 HOD_operation_no_surrender:0 "Limited Operation"
 HOD_operation_no_surrender_desc:0 "The war ends with the operation: no side can be forced to surrender before then."
 hod_operations.1.t:0 "Operation: [HOD_op_name]"
 hod_operations.1.d:0 "The [HOD_op_attacker] has launched the [HOD_op_name]. Only the hyperlanes between the worlds of the battle stay open. The attacker has two months to take every objective state."
 hod_operations.1.a:0 "To arms!"
 hod_operations.2.t:0 "[HOD_op_name] is over"
 hod_operations.2.d:0 "[HOD_op_result]\n\nA ceasefire has been signed: any planet taken outside the objectives returns to its owner."
 hod_operations.2.a:0 "Until the next battle."
 HOD_op_result_won:0 "The [HOD_op_attacker] took every objective, and keeps them."
 HOD_op_result_held:0 "The defenders held out. The [HOD_op_attacker] failed to take every objective."
 HOD_lane_closed_tt:0 "This hyperlane is closed: an operation is under way, and only the lanes between the worlds of the battle are open."
 HOD_debug_test_war:0 "Test: CIS declares war on the Republic"
 HOD_debug_spawn_garrison_fleet:0 "Test: spawn Republic garrison fleet (Coruscant Sector)"
 HOD_debug_test_peace:0 "Test: white peace CIS - Republic"

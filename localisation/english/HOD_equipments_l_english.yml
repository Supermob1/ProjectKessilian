l_english:
###REP
 REP_infantry_equipment_desc:0 "Personal and crew-served weapons for infantry, plus the assorted kit and field gear a soldier needs to fight, survive, and communicate."
 REP_infantry_equipment_0:0 "DC-15a Blaster Rifle"
 REP_infantry_equipment_0_short:0 "DC-15a Blaster."
 REP_infantry_equipment_0_desc:0 "The standard long-rifle of early clone legions. Durable, accurate at range, and powerful enough to pierce light armor, the DC-15a defined Republic infantry firepower at the outbreak of the Clone Wars."
 REP_infantry_equipment_1:0 "DC-15s Blaster Rifle"
 REP_infantry_equipment_1_short:0 "DC-15s Blaster."
 REP_infantry_equipment_1_desc:0 "A handier carbine variant of the DC-15 family. Shorter, lighter, and easier to wield in close quarters, the DC-15s trades some range for faster handling and reliability aboard ships and in urban combat."
 REP_infantry_equipment_2:0 "DC-17 Blaster Rifle"
 REP_infantry_equipment_2_short:0 "DC-17 Blaster."
 REP_infantry_equipment_2_desc:0 "A modernized platform featuring improved power cells, modular rails, and optics. The DC-17 line expands squad options with integral marksman uppers, compact SMG kits, and specialist anti-armor attachments."
 REP_infantry_equipment_3:0 "E-11 Blaster Rifle"
 REP_infantry_equipment_3_short:0 "E-11 Blaster."
 REP_infantry_equipment_3_desc:0 "The Empire’s ubiquitous service rifle—compact, easy to maintain, and adaptable across environments. Standardized magazines, stabilized emitters, and under-barrel launchers bring squads contemporary assault and anti-armor punch."
 REP_infantry_weapons2:0 "Electromagnetic Pulse grenade"
 REP_infantry_weapons2_desc:0 "An Electro-Magnetic Pulse (EMP) grenade—commonly called a droid popper—releases a tuned burst that overloads circuits and power conduits. Highly effective against battle droids and capable of disorienting organic troops."
 REP_improved_infantry_weapons_2:0 "Electromagnetic pulse launcher"
 REP_improved_infantry_weapons_2_desc:0 "A shoulder-fired projector that detonates an EMP charge at range, disabling vehicles and dense droid formations. Crews train to coordinate volleys with infantry pushes for rapid exploitation."
 REP_advanced_infantry_weapons2:0 "E-Web heavy repeating blaster"
 REP_advanced_infantry_weapons2_desc:0 "Crew-served heavy firepower. The E-Web’s stabilized barrel and high-capacity power feeds deliver sustained beams capable of shredding fortifications, aircraft on approach, and armored walkers’ weak points."
 REP_infantry_at:0 "Thermal Detonator"
 REP_infantry_at_desc:0 "A compact, hand-deployed charge that creates a focused overpressure and thermal shock. Ideal for room clearing, breaching light cover, and disabling vehicles at very close range."
 REP_infantry_at2:0 "RPS-6 rocket launcher"
 REP_infantry_at2_desc:0 "Reusable, squad-level anti-armor. The RPS-6 fires guided or dumb rockets with specialized warheads—HEAT, EMP, and fragmentation—giving infantry a flexible answer to tanks and gunships."
 REP_support_weapons:0 "Phase I clone trooper equipment"
 REP_support_weapons_desc:0 "Early-war kit including Phase I armor, macrobinoculars, line throwers, medpacs, and micro-fusers. Issued alongside portable shields and squad auto-blasters to anchor firing lines."
 REP_support_weapons2:0 "Specialized clone trooper equipment"
 REP_support_weapons2_desc:0 "Mission-tailored packs for medics, engineers, and recon teams. Includes slicing gear, sensor beacons, breaching charges, and improved power-pack distribution for crew-served weapons."
 REP_support_weapons3:0 "Phase II clone trooper equipment"
 REP_support_weapons3_desc:0 "Refined armor with better life-support and HUD integration, improved comms encryption, and modular plating. Phase II systems enhance battlefield awareness and reduce fatigue in extended operations."
 REP_support_weapons4:0 "Stormtrooper equipment"
 REP_support_weapons4_desc:0 "Imperial-issue armor and gear standardized for mass deployment: ruggedized comms, sealed helmets, environmental filters, and load-bearing rigs for grenades, power packs, and demolition charges."
 REP_tech_trucks:0 "X-34 Landspeeder"
 REP_tech_trucks_desc:0 "A nimble repulsorcraft adapted for logistics. While unarmored, the X-34 excels at courier duties, light supply runs, and rapid command liaison across difficult terrain."
 REP_motorized_equipment_1:0 "All Terrain Tactical Enforcer"
 REP_motorized_equipment_1_short:0 "AT-TE"
 REP_motorized_equipment_1_desc:0 "Six-legged assault walker mounting heavy mass-driver and laser batteries. Slow but unstoppable, the AT-TE hauls infantry and cargo while smashing fortifications under withering fire."
 REP_mechanized_equipment_2:0 "HAVw A6 Juggernaut"
 REP_mechanized_equipment_2_short:0 "Juggernaut"
 REP_mechanized_equipment_2_desc:0 "A gargantuan, wheeled fortress bristling with turrets. The A6 Juggernaut provides breakthrough power, troop carriage, and point defense for columns advancing through hostile zones."
 REP_mechanized_equipment_1:0 "Unstable Terrain Artillery Transport"
 REP_mechanized_equipment_1_short:0 "UT-AT"
 REP_mechanized_equipment_1_desc:0 "Low-slung repulsor sled designed to cross ice, rubble, and scree where walkers struggle. The UT-AT mounts heavy cannon and grenade projectors to support infantry in treacherous environments."
 REP_mechanized_equipment_3:0 "All Terrain Armored Transport"
 REP_mechanized_equipment_3_short:0 "AT-AT"
 REP_mechanized_equipment_3_desc:0 "The Empire’s terror walker. Towering armor plates, long-range cannons, and troop bays for shock assaults. Vulnerable only to concentrated anti-armor or clever flanking in rough terrain."
 REP_motorized_rocket_equipment_1:0 "UT-AT EMP Variant"
 REP_motorized_rocket_equipment_1_short:0 "UT-AT EMP"
 REP_motorized_rocket_equipment_1_desc:0 "A UT-AT refit equipped with rack-mounted EMP launchers. Fires salvoes that blanket enemy armor and droids with disabling pulses ahead of mechanized pushes."
 REP_gw_armored_car_equipment:0 "All Terrain Personal Transport"
 REP_gw_armored_car_equipment_short:0 "AT-PT"
 REP_gw_armored_car_equipment_desc:0 "Single-pilot scout walker favored for patrols and reconnaissance. Light armor and a chin gun let it harass enemy screens and spot for artillery."
 REP_armored_car_equipment_1:0 "All Terrain Recon Transport"
 REP_armored_car_equipment_1_short:0 "AT-RT"
 REP_armored_car_equipment_1_desc:0 "Open-frame biped built for speed and visibility. Ideal for screening, fast response, and pursuit, with limited protection traded for agility."
 REP_armored_car_equipment_2:0 "All Terrain Scout Transport"
 REP_armored_car_equipment_2_short:0 "AT-ST"
 REP_armored_car_equipment_2_desc:0 "A two-man light walker with gyro-stabilized turrets. Excels at anti-infantry and anti-light-vehicle duties, supporting armor with flanking fire and overwatch."
 REP_amphibious_mechanized_equipment_1:0 "Low Altitude Assault Transport/infantry"
 REP_amphibious_mechanized_equipment_1_short:0 "LAAT/i"
 REP_amphibious_mechanized_equipment_1_desc:0 "Iconic Republic gunship. Heavily armed with doors guns, missiles, and floodlights, the LAAT/i inserts squads directly onto contested objectives and provides close air support."
 REP_amphibious_mechanized_equipment_2:0 "Imperial Dropship Transport"
 REP_amphibious_mechanized_equipment_2_short:0 "IDT"
 REP_amphibious_mechanized_equipment_2_desc:0 "A hardened dropship optimized for vertical assault and armored pod delivery. Modular racks allow rapid embarkation of walkers or strike teams for orbital-to-surface raids."
 REP_marines:0 "Clone Assault Detachments"
 REP_marines_desc:0 "Hand-picked clones trained for ship-to-ship boarding and littoral assaults. They specialize in breaching, shock entries, and securing beachheads under withering fire."
 REP_marines2:0 "Republic Amphibious Corps"
 REP_marines2_desc:0 "Expanded marine formations with integral armor, engineers, and aviation liaison. Mastery of surf-zone logistics enables rapid buildup after first wave landings."
 REP_marines3:0 "Imperial Marine Strike Teams"
 REP_marines3_desc:0 "Elite, surgical assault units. Zero-grav insertion, atmospheric drops, and precision raids define these task-organized teams equipped with cutting-edge breaching and EW suites."
 REP_tech_mountaineers:0 "Clone Recon Rangers"
 REP_tech_mountaineers_desc:0 "Light infantry trained for long-range patrols and high-country warfare. Cold-weather gear, climbing kits, and stealth training let them outmaneuver heavier foes."
 REP_tech_mountaineers2:0 "High Terrain Commandos"
 REP_tech_mountaineers2_desc:0 "Special operations units for alpine raids and chokepoint seizures. They pair demo expertise with marksman overwatch to collapse passes and ambush columns."
 REP_tech_mountaineers3:0 "Imperial Cold Assault Corps"
 REP_tech_mountaineers3_desc:0 "All-weather formations hardened for arctic and high-altitude campaigns. Enclosed armor, thermal regulators, and snow-optimized vehicles keep operations decisive in extreme climates."
 REP_paratroopers:0 "Clone Jump Troopers"
 REP_paratroopers_desc:0 "Air-mobile infantry using jump packs and drop pods to seize key terrain. Drilled in vertical envelopment, they crack defensive belts before heavier forces arrive."
 REP_paratroopers2:0 "Aerial Deployment Divisions"
 REP_paratroopers2_desc:0 "Scaled airborne formations with organic artillery, recon, and logistics. Coordinated mass drops deliver operational reach deep behind enemy lines."
 REP_paratroopers3:0 "Imperial Jump Commandos"
 REP_paratroopers3_desc:0 "Top-tier assault parachutists equipped with stealth packs, guided chutes, and breaching charges. Tasked with decapitation strikes and critical node seizures at H-hour."
###CIS
 CIS_infantry_equipment_desc:0 "Successive generations of battle droids form the core of Separatist ground forces, replacing living infantry with programmed obedience and mechanical efficiency."
 CIS_infantry_equipment_0:0 "B1 Battle Droid"
 CIS_infantry_equipment_0_short:0 "B1 Droid"
 CIS_infantry_equipment_0_desc:0 "Cheap, mass-produced, and expendable. The B1 was the workhorse of the Separatist armies. While individually fragile and unintelligent, they could overwhelm opponents with sheer numbers."
 CIS_infantry_equipment_1:0 "OOM-series Battle Droid"
 CIS_infantry_equipment_1_short:0 "OOM Droid"
 CIS_infantry_equipment_1_desc:0 "A command and specialist variant of the B1. OOM droids included leaders, pilots, and security models with slightly improved programming, giving droid squads better coordination and resilience."
 CIS_infantry_equipment_2:0 "B2 Super Battle Droid"
 CIS_infantry_equipment_2_short:0 "B2 Droid"
 CIS_infantry_equipment_2_desc:0 "Heavily armored and far stronger than B1s, the B2 was designed to be autonomous, requiring less centralized command. Its wrist blasters and rocket mounts made it a formidable front-line trooper."
 CIS_infantry_equipment_3:0 "B3 Ultra Battle Droid"
 CIS_infantry_equipment_3_short:0 "B3 Droid"
 CIS_infantry_equipment_3_desc:0 "An advanced, heavily armed droid built for heavy combat. The B3 incorporated integrated cannons, missile launchers, and reinforced plating—designed to rival small vehicles in raw firepower."
 CIS_infantry_weapons2:0 "Electro Grenade"
 CIS_infantry_weapons2_desc:0 "Compact grenades that discharged a burst of electrical energy. Used to overload shields, disrupt organics, or stall enemy vehicles. A brutal but effective countermeasure against Republic infantry."
 CIS_improved_infantry_weapons_2:0 "Portable Ion Launcher"
 CIS_improved_infantry_weapons_2_desc:0 "A heavy shoulder-fired ion projector, issued to droid squads for anti-armor and anti-air roles. Capable of disabling walkers, starfighters, or shielded emplacements with concentrated ion bursts."
 CIS_advanced_infantry_weapons2:0 "LR1K Sonic Cannon"
 CIS_advanced_infantry_weapons2_desc:0 "Crew-served Separatist heavy weapon that unleashed devastating sonic waves. Extremely effective in urban combat and against entrenched positions, it instilled terror in organic troops."
 CIS_support_weapons:0 "E-5 Blaster Rifle"
 CIS_support_weapons_desc:0 "The standard armament issued to B1 and OOM battle droids. Compact, efficient, and easy to manufacture, the E-5 was adequate for droid programming and swarm tactics."
 CIS_support_weapons2:0 "Droideka Support Units"
 CIS_support_weapons2_desc:0 "Droidekas, or destroyer droids, provided devastating mobile firepower with twin repeating blasters and portable shield generators. Deployed in support roles, they anchored droid formations."
 CIS_support_weapons3:0 "B2 Heavy Armaments"
 CIS_support_weapons3_desc:0 "Upgrades to B2 units with wrist-mounted rocket launchers, flamethrowers, and grenade projectors. These weapons gave CIS infantry formations integrated heavy support without relying on organics."
 CIS_support_weapons4:0 "MagnaGuard Equipment"
 CIS_support_weapons4_desc:0 "IG-100 MagnaGuards, elite droid enforcers, were armed with electrostaffs and resistant plating. Designed to duel Jedi and provide command bodyguard roles, their presence boosted droid cohesion and lethality."
 CIS_infantry_at:0 "Thermal Detonator"
 CIS_infantry_at_desc:0 "Compact energy grenades issued to B1 squads. While primitive, they were effective in demolitions, clearing bunkers, or crippling vehicles at close range."
 CIS_infantry_at2:0 "Reciprocating Quad Rocket Launcher"
 CIS_infantry_at2_desc:0 "An automated shoulder-fired rocket launcher adapted for droids. Used to punch through Republic armor or saturate entrenched positions with explosive barrages."
 CIS_marines:0 "Aquatic Assault Droids"
 CIS_marines_desc:0 "Specialist droid models designed for underwater warfare and amphibious landings. Outfitted with sealed casings and repulsor propulsion systems for littoral combat."
 CIS_marines2:0 "Heavy Amphibious Battalions"
 CIS_marines2_desc:0 "Upgraded aquatic droids paired with escort crab droids. Able to assault fortified coasts and fight in submerged environments with self-contained power systems."
 CIS_marines3:0 "Subjugation Marine Droids"
 CIS_marines3_desc:0 "Elite amphibious formations for planetary pacification, outfitted with enhanced plating, heavy blasters, and ion weaponry for ship-boarding and waterborne assaults."
 CIS_tech_mountaineers:0 "Reconnaissance Droids"
 CIS_tech_mountaineers_desc:0 "Light bipedal scouts programmed for stealth and terrain traversal. Equipped with climbing gear, extended sensors, and survival modules for long-range patrols."
 CIS_tech_mountaineers2:0 "Commando Droids"
 CIS_tech_mountaineers2_desc:0 "BX-series commando droids specialized in infiltration, sabotage, and high-terrain operations. Agile, intelligent, and capable of outmaneuvering clone commandos."
 CIS_tech_mountaineers3:0 "Advanced Alpine Units"
 CIS_tech_mountaineers3_desc:0 "Commando variants adapted for extreme climates. Reinforced servos, heat regulators, and stealth systems allowed them to thrive in mountains and frozen regions."
 CIS_paratroopers:0 "Aerial Deployment Droids"
 CIS_paratroopers_desc:0 "Droid units equipped with retro-thrusters and repulsor-assisted descent packs. Dropped from carriers directly into contested battle zones to establish beachheads."
 CIS_paratroopers2:0 "HMP Gunship-Deployed Infantry"
 CIS_paratroopers2_desc:0 "Battle droids integrated with airborne deployment tactics. Deployed by HMP gunships in mass assaults, they could overwhelm defensive lines behind the front."
 CIS_paratroopers3:0 "Orbital Drop Droids"
 CIS_paratroopers3_desc:0 "Advanced droid formations capable of sealed re-entry in drop pods. Designed for orbital shock assaults, striking command centers and strategic nodes with precision."
 CIS_tech_trucks:0 "STAP Speeders"
 CIS_tech_trucks_desc:0 "Single Trooper Aerial Platforms were fast repulsorlift scouts. Armed with light blasters, STAPs provided recon and harassment in support of droid formations."
 CIS_motorized_equipment_1:0 "AAT Main Battle Tank"
 CIS_motorized_equipment_1_short:0 "AAT"
 CIS_motorized_equipment_1_desc:0 "The Armored Assault Tank was the workhorse of Separatist armor—durable, heavily armed, and versatile across terrain. It formed the backbone of CIS armored units."
 CIS_mechanized_equipment_1:0 "MTT Troop Transport"
 CIS_mechanized_equipment_1_short:0 "MTT"
 CIS_mechanized_equipment_1_desc:0 "The Multi-Troop Transport was a massive repulsorlift vehicle designed to deliver platoons of B1 battle droids directly into combat. Its armored hull provided cover until deployment."
 CIS_mechanized_equipment_2:0 "Hailfire Droid"
 CIS_mechanized_equipment_2_short:0 "Hailfire"
 CIS_mechanized_equipment_2_desc:0 "A missile-launching platform with distinctive hoop-wheels. Hailfires excelled at long-range barrages against armor and fortifications, before quickly retreating."
 CIS_mechanized_equipment_3:0 "Octuptarra Tri-Droid"
 CIS_mechanized_equipment_3_short:0 "Tri-Droid"
 CIS_mechanized_equipment_3_desc:0 "Towering artillery droids equipped with heavy laser cannons and anti-air weapons. Their tall frames and multi-role firepower made them CIS late-war battlefield anchors."
 CIS_motorized_rocket_equipment_1:0 "NR-N99 Persuader"
 CIS_motorized_rocket_equipment_1_short:0 "Persuader"
 CIS_motorized_rocket_equipment_1_desc:0 "A snail-like tank droid mounting missile racks and heavy blasters. Designed by the Corporate Alliance, it specialized in heavy bombardments and urban suppression."
 CIS_gw_armored_car_equipment:0 "DSD1 Dwarf Spider Droid"
 CIS_gw_armored_car_equipment_short:0 "Dwarf Spider"
 CIS_gw_armored_car_equipment_desc:0 "Compact four-legged walkers with heavy anti-infantry and anti-vehicle blasters. Deployed en masse to support heavier vehicles and hold difficult ground."
 CIS_armored_car_equipment_1:0 "OG-9 Homing Spider Droid"
 CIS_armored_car_equipment_1_short:0 "Spider Droid"
 CIS_armored_car_equipment_1_desc:0 "Large artillery walkers with long-range beam weapons. Their powerful sensors and stabilizers allowed them to deliver precise fire support across wide fields."
 CIS_armored_car_equipment_2:0 "LM-432 Crab Droid"
 CIS_armored_car_equipment_2_short:0 "Crab Droid"
 CIS_armored_car_equipment_2_desc:0 "Multi-legged heavy assault droids, equally adept at clambering over terrain and engaging armor with their cannons. A feared sight during sieges and coastal campaigns."
 CIS_amphibious_mechanized_equipment_1:0 "HMP Droid Gunship"
 CIS_amphibious_mechanized_equipment_1_short:0 "HMP"
 CIS_amphibious_mechanized_equipment_1_desc:0 "Heavily armed rotary-wing droid craft that deployed troops while providing suppressive fire. Rugged and versatile, they could deliver rapid aerial assaults."
 CIS_amphibious_mechanized_equipment_2:0 "C-9979 Landing Craft"
 CIS_amphibious_mechanized_equipment_2_short:0 "C-9979"
 CIS_amphibious_mechanized_equipment_2_desc:0 "Massive starships designed to land armies and vehicles directly on planetary surfaces. These automated craft formed the backbone of large-scale planetary invasions."

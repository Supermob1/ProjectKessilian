l_english:
 # Gate traits
 force_sensitive:0 "Force-Sensitive"
 force_sensitive_desc:0 "This individual is attuned to the Force — whether trained or latent, that connection sets them apart from any ordinary soldier."
 light_side_user:0 "Jedi"
 light_side_user_desc:0 "A servant of the light side of the Force and the Jedi Order. Guided by compassion and discipline, they carry the Republic's hopes on the battlefield."
 dark_side_user:0 "Dark Side Adept"
 dark_side_user_desc:0 "This warrior draws on the dark side of the Force. Their power is fearsome and their ambition boundless — but the dark side always demands its price."
 # Jedi rank personality traits
 jedi_padawan_rank:0 "Jedi Padawan"
 jedi_padawan_rank_desc:0 "Recently elevated, this Jedi is still mastering the art of commanding large formations. Their connection to the Force gives their troops heart — but strategic finesse takes time to develop."
 jedi_knight_rank:0 "Jedi Knight"
 jedi_knight_rank_desc:0 "A fully Knighted member of the Jedi Order, capable of independent command. Respected by clone troopers and officers alike."
 jedi_veteran_rank:0 "Veteran Jedi"
 jedi_veteran_rank_desc:0 "A Jedi who saw war before the Clone Wars began. Experience in the field translates directly into steadier command of the Grand Army."
 jedi_master_rank:0 "Jedi Master"
 jedi_master_rank_desc:0 "A member of the Jedi High Council or equivalent. An extraordinary leader — but the Republic's insistence on using peacekeepers as generals has its limits."
 # Dark side rank personality traits
 dark_acolyte_rank:0 "Dark Side Acolyte"
 dark_acolyte_rank_desc:0 "An initiate in the ways of the dark side — powerful but undisciplined, driven by raw emotion more than strategy. Dangerous in a fight, unpredictable in command."
 dark_champion_rank:0 "Dark Side Champion"
 dark_champion_rank_desc:0 "A proven dark side warrior who has survived trials that would break anyone else. Their aggression is calculated now — and all the more deadly for it."
 sith_lord_rank:0 "Sith Lord"
 sith_lord_rank_desc:0 "The apex of dark side mastery. A Sith Lord does not merely command armies — they impose their will upon the battlefield itself. Fear is their greatest weapon."
 # Lightsaber form skill tree
 form_shii_cho:0 "Form I: Shii-Cho"
 form_shii_cho_desc:0 "The foundational form of lightsaber combat — broad strokes and aggressive sweeps that translate well to large-scale battlefield leadership."
 form_shii_cho_mastery:0 "Shii-Cho Mastery"
 form_shii_cho_mastery_desc:0 "A master of Form I understands the fundamentals of combat better than anyone. Their battlefield awareness and disciplined aggression inspire confidence throughout the ranks."
 form_soresu:0 "Form III: Soresu"
 form_soresu_desc:0 "The defensive form, prized for its economy of movement and near-perfect defense. A Soresu master never wastes effort, and neither do their armies."
 form_soresu_mastery:0 "Soresu Mastery"
 form_soresu_mastery_desc:0 "True mastery of Form III borders on invulnerability. Armies under this general tend to be extraordinarily difficult to dislodge."
 form_ataru:0 "Form IV: Ataru"
 form_ataru_desc:0 "The aggressive form — fast, dynamic, always on the attack. Ataru practitioners press every advantage without hesitation."
 form_ataru_mastery:0 "Ataru Mastery"
 form_ataru_mastery_desc:0 "Perfecting Ataru's endless offensive pressure, this general drives their troops forward with relentless momentum."
 form_juyo_vaapad:0 "Form VII: Juyo/Vaapad"
 form_juyo_vaapad_desc:0 "The ferocity form — officially banned but undeniably effective. Only those who can master their own connection to the dark side dare use it."
 form_niman:0 "Form VI: Niman"
 form_niman_desc:0 "The balanced form favored by Jedi diplomats. Competent at everything, a master of nothing — but that makes for excellent logistics."
 form_niman_mastery:0 "Niman Mastery"
 form_niman_mastery_desc:0 "A Form VI master orchestrates armies as naturally as they once orchestrated Senate hearings — always in the right place at the right time."
 jedi_high_command:0 "Jedi High Command"
 jedi_high_command_desc:0 "Enough battlefield experience to coordinate multiple armies. The Jedi Order's best reluctantly admit they have become soldiers."
 jedi_strategic_mastery:0 "Jedi Strategic Mastery"
 jedi_strategic_mastery_desc:0 "A Jedi general who rivals any military academy graduate. The Force, it turns out, is a remarkable strategic instructor."
 form_makashi:0 "Form II: Makashi"
 form_makashi_desc:0 "The duelist's form — elegant, precise, and efficient. Makashi practitioners excel at controlling engagements and exploiting the weaknesses of their opponents."
 form_makashi_mastery:0 "Makashi Mastery"
 form_makashi_mastery_desc:0 "A true master of Form II directs battle with surgical precision, turning every engagement into a calculated victory."
 form_djem_so:0 "Form V: Djem So"
 form_djem_so_desc:0 "The power form — aggressive counterattacks and overwhelming strength define Djem So. Its practitioners meet enemy assaults head-on and break them through sheer force."
 form_djem_so_mastery:0 "Djem So Mastery"
 form_djem_so_mastery_desc:0 "Mastery of Djem So allows a commander to transform defensive opportunities into devastating offensives with terrifying efficiency."
 form_shien:0 "Form V: Shien"
 form_shien_desc:0 "The defensive variant of Form V, focused on deflecting attacks and redirecting enemy momentum back upon them."
 form_shien_mastery:0 "Shien Mastery"
 form_shien_mastery_desc:0 "A Shien master turns enemy aggression into their own undoing, coordinating resilient armies capable of counterattacking at precisely the right moment."
 form_jar_kai:0 "Jar'Kai"
 form_jar_kai_desc:0 "The dual-blade discipline — difficult to master, but devastatingly versatile. Jar'Kai practitioners strike and defend simultaneously with unmatched adaptability."
 form_jar_kai_mastery:0 "Jar'Kai Mastery"
 form_jar_kai_mastery_desc:0 "A master of Jar'Kai coordinates attacks with impossible speed and flexibility, overwhelming opponents through relentless tactical pressure."
 # Replaced vanilla traits
 old_republic_veteran:0 "Old Republic Veteran"
 old_republic_veteran_desc:0 "A career soldier from the days before the Clone Wars, trained in the traditions of the Old Republic's sector defense forces."
 speeder_recon_officer:0 "Speeder Recon Officer"
 speeder_recon_officer_desc:0 "Specializes in fast-moving reconnaissance and flanking operations using speeder bikes and light scout units."
 walker_assault_officer:0 "Walker Assault Officer"
 walker_assault_officer_desc:0 "Expert in deploying and coordinating AT-TE and AT-AT walker formations as armored breakthrough forces."
 walker_tactics_leader:0 "Walker Tactics Leader"
 walker_tactics_leader_desc:0 "A commander who has mastered the use of armored walker formations, squeezing every advantage from their firepower and intimidating presence."
 walker_assault_expert:0 "Walker Assault Expert"
 walker_assault_expert_desc:0 "Advanced mastery of walker assault doctrine, making armored formations nearly impossible to crack."
 planetary_militia_officer:0 "Planetary Militia Officer"
 planetary_militia_officer_desc:0 "Commands the irregular volunteer forces that serve as the Republic's second line of defense on occupied worlds."
 insurgent_commander:0 "Insurgent Commander"
 insurgent_commander_desc:0 "Expert in unconventional warfare, partisan operations, and fighting without a clear front line."
 # Non-Force duelist traits
 skilled_duelist:0 "Skilled Duelist"
 skilled_duelist_desc:0 "A warrior of exceptional personal skill — trained to face Force-users and win through speed, precision, and sheer aggression rather than any mystical ability."
 combat_cyborg:0 "Combat Cyborg"
 combat_cyborg_desc:0 "Cybernetic enhancements have transformed this commander into something beyond flesh. Force attacks that rely on a living nervous system find less purchase here — but overconfidence in mechanical superiority has its own dangers."
 # Non-Force combat styles (parallel to lightsaber forms)
 blaster_duelist:0 "Blaster Duelist"
 blaster_duelist_desc:0 "A gunfighter first and foremost. Fast on the draw, precise under fire, this commander wins engagements through speed and accuracy where others rely on blades or mysticism."
 blaster_duelist_mastery:0 "Blaster Duelist Mastery"
 blaster_duelist_mastery_desc:0 "At this level the blaster is no longer just a weapon — it is an extension of will. Shots placed with preternatural precision, timing that defies calculation. Even Force-users learn to respect the aim."
 vibroblade_fighter:0 "Vibroblade Fighter"
 vibroblade_fighter_desc:0 "Trained in the art of close combat with vibro-edged weapons. Where a Jedi relies on the Force to guide their blade, this warrior relies on decades of repetition and iron discipline."
 vibroblade_fighter_mastery:0 "Vibroblade Fighter Mastery"
 vibroblade_fighter_mastery_desc:0 "A vibroblade master moves with the economy and control of any lightsaber duelist. Their defense is near-total, their counter-attacks precise — they neither waste movement nor leave an opening."
 dirty_fighter:0 "Dirty Fighter"
 dirty_fighter_desc:0 "Honor is for people who can afford to lose. This warrior uses every trick, every deception, every dishonorable tactic available — and wins more often than not because of it."
 dirty_fighter_mastery:0 "Dirty Fighter Mastery"
 dirty_fighter_mastery_desc:0 "True mastery of dirty fighting is the realization that there are no rules — only outcomes. This commander engineers situations that seem impossible to survive and then survives them anyway."
 mandalorian_combat:0 "Mandalorian Combat"
 mandalorian_combat_desc:0 "Forged in the warrior traditions of Mandalore: jetpack, beskar, blaster, blade. A Mandalorian fighter combines every tool at their disposal into something greater than any single school of combat."
 mandalorian_combat_mastery:0 "Mandalorian Combat Mastery"
 mandalorian_combat_mastery_desc:0 "This is what Mandalore has always produced at its finest: a complete warrior. They know when to strike, when to hold, when to disengage — and they never, ever leave a fight without choosing to."
 droid_tactical_analysis:0 "Droid Tactical Analysis"
 droid_tactical_analysis_desc:0 "A cybernetic mind cross-references thousands of combat scenarios in real time. Weaknesses are identified before the enemy acts. Every engagement is optimized before the first shot is fired."
 droid_tactical_mastery:0 "Droid Tactical Mastery"
 droid_tactical_mastery_desc:0 "Perfect machine intelligence applied to war. This commander does not guess — they calculate. Every move the enemy makes was anticipated three moves before it happened."
 # Non-Force combat equipment traits (parallel to Force powers)
 targeting_computer:0 "Targeting Computer"
 targeting_computer_desc:0 "An integrated targeting system — cybernetic, helmet-mounted, or otherwise — that keeps this commander's fire accurate regardless of conditions. What they aim at, they hit."
 energy_shield:0 "Energy Shield"
 energy_shield_desc:0 "A personal deflector shield or equivalent protective technology. Blasterfire that would drop a lesser warrior barely registers. This commander fights longer and harder because of it."
 jetpack_assault:0 "Jetpack Assault"
 jetpack_assault_desc:0 "Three-dimensional movement in a ground engagement rewrites the rules. This commander strikes from unexpected angles, repositions before the enemy can respond, and is never exactly where the enemy expects."
 thermal_detonators:0 "Thermal Detonators"
 thermal_detonators_desc:0 "Area denial through explosive force. The judicious application of thermal detonators turns any engagement into a geometry problem — and this commander always solves it first."
 combat_stimulants:0 "Combat Stimulants"
 combat_stimulants_desc:0 "Chemical enhancement in the heat of battle. Reaction speed doubles, pain becomes irrelevant, fatigue becomes a distant concern. The bill comes due after the fight — but they intend to win it first."
 deceptive_combat:0 "Deceptive Combat"
 deceptive_combat_desc:0 "Every feint, every misdirection, every false opening — this commander fights as much in the enemy's head as on the ground. By the time the opponent realizes what is happening, it is already over."
 heavy_armor_plating:0 "Heavy Armor Plating"
 heavy_armor_plating_desc:0 "Armored to a degree that makes most weapons functionally irrelevant. Slow, perhaps — but to kill this commander requires a level of sustained effort most opponents cannot sustain."
 rapid_fire_barrage:0 "Rapid Fire Barrage"
 rapid_fire_barrage_desc:0 "Volume of fire as a philosophy. This commander does not rely on perfect aim — they rely on the mathematical certainty that something gets through when enough bolts are flying."

 # Jedi Knight / Jedi Master (kept for advisor traits and existing references)
 jedi_knight:0 "Jedi Knight"
 jedi_knight_desc:0 "Jedi Knight was a rank within the Jedi Order, referring to Jedi who had completed their training and passed the Jedi Trials to become a full member of the Order."
 jedi_master:0 "Jedi Master"
 jedi_master_desc:0 "Jedi Master was a rank in the Jedi Order given to powerful Jedi, many of whom were leaders within the Order."
 aggression_chip:0 "Aggression Chip"
 aggression_chip_desc:0 "This chip was implemented by Count Dooku to make Grievous behave more aggressively."
 # Force power traits
 force_push:0 "Force Push"
 force_push_desc:0 "A Jedi who has mastered the aggressive application of telekinesis. Their assaults carry an almost physical momentum that breaks through enemy formations."
 force_push_mastery:0 "Force Push Mastery"
 force_push_mastery_desc:0 "Wielded with precision and scale, this general's telekinetic assaults are devastating — coordinated pushes that shatter organized defences."
 force_speed:0 "Force Speed"
 force_speed_desc:0 "By channeling the Force into bursts of preternatural speed, this Jedi ensures their forces are always where they are needed most."
 force_speed_mastery:0 "Force Speed Mastery"
 force_speed_mastery_desc:0 "Perfect mastery of Force Speed means this general is rarely caught off guard. Their armies react and reposition faster than any opponent can adapt."
 force_barrier:0 "Force Barrier"
 force_barrier_desc:0 "A sustained telekinetic barrier that protects nearby troops from blasterfire and shrapnel. This general keeps their soldiers alive where others fall."
 force_barrier_mastery:0 "Force Barrier Mastery"
 force_barrier_mastery_desc:0 "An extended barrier projection that defends entire formations. Enemy fire that would devastate lesser troops merely tests their patience."
 force_prescience:0 "Force Prescience"
 force_prescience_desc:0 "The Force grants glimpses of what is about to happen. This general plans with an unsettling accuracy — as though they have already seen the battle unfold."
 force_prescience_mastery:0 "Force Prescience Mastery"
 force_prescience_mastery_desc:0 "This general does not react to the enemy — they act ahead of them. Plans are drawn up with near-perfect foreknowledge of what is coming."
 force_healing:0 "Force Healing"
 force_healing_desc:0 "A rare and demanding application of the Force. This Jedi keeps their troops fighting longer than any medic — and loses fewer to wounds that should have been mortal."
 force_healing_mastery:0 "Force Healing Mastery"
 force_healing_mastery_desc:0 "Extraordinary mastery of the healing arts. Armies under this general endure conditions that should break lesser forces, their wounds closing almost as fast as they are dealt."
 battle_meditation:0 "Battle Meditation"
 battle_meditation_desc:0 "The rarest of Force gifts — the ability to reach out and touch the will of thousands of soldiers simultaneously. Morale does not merely hold; it surges."
 battle_meditation_mastery:0 "Battle Meditation Mastery"
 battle_meditation_mastery_desc:0 "At this level, the general's presence on the battlefield is a force multiplier unlike any other. Entire army groups fight as one mind, unshakeable and relentless."
 force_lightning:0 "Force Lightning"
 force_lightning_desc:0 "Dark side energy given lethal form. A commander who channels this power drives their troops to ferocious heights — though at a cost the Force does not easily forgive."
 force_lightning_mastery:0 "Force Lightning Mastery"
 force_lightning_mastery_desc:0 "Unrestrained dark side power crackles through every engagement. Terrifying to ally and enemy alike — but the results cannot be argued with."
 force_choke:0 "Force Choke"
 force_choke_desc:0 "The ability to reach out and throttle the enemy's will from a distance. This commander imposes dread in a way no speech or banner ever could."
 force_choke_mastery:0 "Force Choke Mastery"
 force_choke_mastery_desc:0 "A presence so malignant that enemy commanders second-guess every order. Their forces press through, while the enemy hesitates."


l_english:
 SUBDOCTRINE_WALKER_TERRAIN_WARFARE:0 "Walker Terrain Warfare"
 SUBDOCTRINE_WALKER_TERRAIN_WARFARE_DESC:0 "Walker formations exploit difficult ground to break through enemy defenses. Motorized and mechanized infantry secure their gains, coordinate supporting fire and maintain the advance through joint training and efficient logistics."
 walker_terrain_warfare_walker_column_drills:0 "Walker Column Drills"
 walker_terrain_warfare_walker_column_drills_desc:0 "Joint training improves the organization of walker crews and their accompanying motorized and mechanized infantry."
 walker_terrain_warfare_terrain_breakthrough:0 "Terrain Breakthrough"
 walker_terrain_warfare_terrain_breakthrough_desc:0 "Walker formations concentrate their strength to breach enemy lines."
 walker_terrain_warfare_coordinated_walker_fire:0 "Coordinated Walker Fire"
 walker_terrain_warfare_coordinated_walker_fire_desc:0 "Combat walkers, specialist variants and accompanying mobile infantry coordinate their fire against enemy forces."
 walker_terrain_warfare_terrain_adaptation:0 "Terrain Adaptation"
 walker_terrain_warfare_terrain_adaptation_desc:0 "Walker crews adapt their tactics to the terrain and the capabilities of their chassis."
 walker_terrain_warfare_sustained_walker_operations:0 "Sustained Walker Operations"
 walker_terrain_warfare_sustained_walker_operations_desc:0 "Field maintenance and coordinated logistics sustain walker offensives while mobile infantry recover organization and reduce supply consumption."

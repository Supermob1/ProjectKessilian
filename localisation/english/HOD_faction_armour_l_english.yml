l_english:
 # HOD: faction armour tabs (faction_armour.py)
 hod_rep_armour_folder:0 "Republic Armour Corps"
 rep_walker_atpt:0 "AT-PT (Grand Army)"
 rep_walker_atpt_desc:0 "All Terrain Personal Transports. Walkers stride over ground that stops wheels and repulsors."
 rep_walker_atrt:0 "AT-RT"
 rep_walker_atrt_desc:0 "All Terrain Recon Transports: fast single-trooper walkers for scouting and flanking."
 rep_atrt_recon:0 "AT-RT Recon Package"
 rep_atrt_recon_desc:0 "Long-range sensors and lighter armour turn the AT-RT into the army's eyes."
 rep_atrt_assault:0 "AT-RT Assault Package"
 rep_atrt_assault_desc:0 "Repeating blasters and mortar launchers: the AT-RT goes in with the troopers."
 rep_walker_atrt_501:0 "AT-RT (501st Pattern)"
 rep_walker_atrt_501_desc:0 "Uprated AT-RTs with heavier repeating blasters, used by the veteran legions."
 rep_walker_atst:0 "AT-ST"
 rep_walker_atst_desc:0 "Two-man scout walkers that replace the AT-RT in the Imperial army."
 rep_walker_atte:0 "AT-TE"
 rep_walker_atte_desc:0 "All Terrain Tactical Enforcers: six-legged assault walkers with a mass-driver cannon and a platoon aboard."
 rep_walker_atte_elite:0 "Elite AT-TE"
 rep_walker_atte_elite_desc:0 "Heavier plating and refined fire control for the veteran walker companies."
 rep_atte_assault:0 "AT-TE Assault Refit"
 rep_atte_assault_desc:0 "Extra cannon ammunition and ram plating: AT-TEs that lead the breakthrough."
 rep_atte_transport:0 "AT-TE Transport Refit"
 rep_atte_transport_desc:0 "Room for two full platoons: the walker becomes a mobile fortress for its troopers."
 rep_atte_spotter:0 "AT-TE Spotter Refit"
 rep_atte_spotter_desc:0 "Sensor masts and fire-control links direct the walking artillery behind the line."
 rep_walker_atte_sieges:0 "AT-TE (Outer Rim Sieges)"
 rep_walker_atte_sieges_desc:0 "The definitive AT-TE, rebuilt from the lessons of the Outer Rim Sieges."
 rep_walker_atap:0 "AT-AP"
 rep_walker_atap_desc:0 "All Terrain Attack Pods: walking artillery that braces on a third leg to fire its heavy cannon."
 rep_atap_siege:0 "Siege Configuration"
 rep_atap_siege_desc:0 "Bigger shells for fortress walls: AT-APs that crack defended lines."
 rep_atap_antiarmour:0 "Anti-Armour Configuration"
 rep_atap_antiarmour_desc:0 "Penetrator rounds and target trackers for hunting droid tanks."
 rep_walker_atot:0 "AT-OT"
 rep_walker_atot_desc:0 "All Terrain Open Transports: heavy walkers that carry whole companies behind the battle line."
 rep_walker_utat:0 "UT-AT"
 rep_walker_utat_desc:0 "Unstable Terrain Artillery Transports: tracked heavy walkers with a twin heavy laser turret."
 rep_walker_atat_kuat:0 "AT-AT (Battle of Kuat)"
 rep_walker_atat_kuat_desc:0 "The first All Terrain Armoured Transports, built at Kuat at the end of the war."
 rep_walker_atat_elite:0 "Elite AT-AT"
 rep_walker_atat_elite_desc:0 "Fully armoured AT-ATs and the giant siege walkers of the Imperial army."
 rep_spg_av7:0 "AV-7 Anti-Vehicle Cannon"
 rep_spg_av7_desc:0 "A repulsor-mounted cannon that digs in on four legs: the Republic's first self-propelled gun."
 rep_spg_spham:0 "SPHA-M"
 rep_spg_spham_desc:0 "Medium Self-Propelled Heavy Artillery walkers accompany the AT-TE companies."
 rep_spg_sphat:0 "SPHA-T"
 rep_spg_sphat_desc:0 "The twelve-legged turbolaser platforms that brought down core ships at Geonosis."
 rep_spg_turbo:0 "Turbolaser Siege Batteries"
 rep_spg_turbo_desc:0 "Super-heavy siege walkers mounting starship-grade turbolasers."
 rep_walker_atar:0 "AT-AR Anti-Armour Walkers"
 rep_walker_atar_desc:0 "Walkers rebuilt around a single heavy anti-armour cannon to hunt droid tanks."
 rep_walker_ataa:0 "AT-AA"
 rep_walker_ataa_desc:0 "All Terrain Anti-Aircraft walkers: flak and laser batteries against droid gunships."
 rep_tx130:0 "TX-130 Saber Fighter Tank"
 rep_tx130_desc:0 "Fast repulsor fighter tanks attached to clone divisions as support companies."
 rep_tx130t:0 "TX-130T"
 rep_tx130t_desc:0 "The improved TX-130 with heavier armour and missile launchers."
 rep_tx225:0 "TX-225 GAVw Occupier"
 rep_tx225_desc:0 "The Empire's armoured repulsor tank for occupation and convoy duty."
 rep_gyro_1:0 "Gyro-Stabilisers I"
 rep_gyro_1_desc:0 "Better gyro-stabilisers keep walkers sure-footed on broken ground, and allow stronger motivators (engine upgrade limit)."
 rep_durasteel_1:0 "Durasteel Armour I"
 rep_durasteel_1_desc:0 "Thicker durasteel hulls: walkers shrug off what would kill a tank (armour upgrade limit)."
 rep_gyro_2:0 "Gyro-Stabilisers II"
 rep_gyro_2_desc:0 "Better gyro-stabilisers keep walkers sure-footed on broken ground, and allow stronger motivators (engine upgrade limit)."
 rep_durasteel_2:0 "Durasteel Armour II"
 rep_durasteel_2_desc:0 "Thicker durasteel hulls: walkers shrug off what would kill a tank (armour upgrade limit)."
 rep_gyro_3:0 "Gyro-Stabilisers III"
 rep_gyro_3_desc:0 "Better gyro-stabilisers keep walkers sure-footed on broken ground, and allow stronger motivators (engine upgrade limit)."
 rep_durasteel_3:0 "Durasteel Armour III"
 rep_durasteel_3_desc:0 "Thicker durasteel hulls: walkers shrug off what would kill a tank (armour upgrade limit)."
 rep_gyro_4:0 "Gyro-Stabilisers IV"
 rep_gyro_4_desc:0 "Better gyro-stabilisers keep walkers sure-footed on broken ground, and allow stronger motivators (engine upgrade limit)."
 rep_durasteel_4:0 "Durasteel Armour IV"
 rep_durasteel_4_desc:0 "Thicker durasteel hulls: walkers shrug off what would kill a tank (armour upgrade limit)."
 hod_cis_armour_folder:0 "Droid Armour"
 cis_aat:0 "Armoured Assault Tank"
 cis_aat_desc:0 "Baktoid's AAT. Repulsor tanks race across open ground; droid crews never tire, but cut corners."
 cis_octuptarra:0 "Octuptarra Combat Tri-Droid"
 cis_octuptarra_desc:0 "Three-legged combat droids whose turreted head fires in every direction."
 cis_crab:0 "LM-432 Crab Droid"
 cis_crab_desc:0 "Six-legged crab droids that wade through swamps and rivers no tank can cross."
 cis_octuptarra_2:0 "Octuptarra Combat Tri-Droid Mk.II"
 cis_octuptarra_2_desc:0 "Uprated tri-droids with heavier blasters and armour."
 cis_dsd1:0 "DSD1 Dwarf Spider Droid"
 cis_dsd1_desc:0 "Commerce Guild dwarf spider droids that climb cliffs and hold mountain passes."
 cis_dsd2:0 "DSD2 Heavy Dwarf Spider Droid"
 cis_dsd2_desc:0 "A larger dwarf spider carrying the punch of a medium tank."
 cis_adsd:0 "A-DSD Advanced Dwarf Spider Droid"
 cis_adsd_desc:0 "Advanced dwarf spiders: the last and best of the Commerce Guild's walking tanks."
 cis_gat:0 "Ground Armoured Tank"
 cis_gat_desc:0 "The GAT: a lighter, faster repulsor tank for exploiting breakthroughs."
 cis_haat:0 "Heavy Armoured Assault Tank"
 cis_haat_desc:0 "The heavy AAT, with thicker hull plating and a bigger main cannon."
 cis_persuader:0 "NR-N99 Persuader-Class Enforcer"
 cis_persuader_desc:0 "Corporate Alliance tank droids rolling on a single huge wheel."
 cis_magna:0 "Octuptarra Magna Tri-Droid"
 cis_magna_desc:0 "Giant tri-droids that tower over the battlefield and crush walkers below them."
 cis_hailfire:0 "IG-227 Hailfire-Class Droid"
 cis_hailfire_desc:0 "Hoop-wheeled droids that rain homing missiles on clone positions."
 cis_payloads:0 "Higher Armament Payloads"
 cis_payloads_desc:0 "Bigger missile racks: more firepower, slower to redeploy."
 cis_redeploy:0 "Rapid Redeployment Capabilities"
 cis_redeploy_desc:0 "Lighter loads and refresher droids keep the batteries on the move."
 cis_hailfire_heavy:0 "IG-228 Heavy Hailfire Droid"
 cis_hailfire_heavy_desc:0 "Heavy Hailfires carry missile batteries fit for a siege."
 cis_og9:0 "OG-9 Homing Spider Droid"
 cis_og9_desc:0 "Huge spider droids whose dish cannon tracks targets across the battlefield."
 cis_og9_targeting:0 "Improved Autonomous Targeting"
 cis_og9_targeting_desc:0 "Spider droids that pick their own targets without waiting for a tactical droid."
 cis_targeting:0 "Improved Targeting Arrays"
 cis_targeting_desc:0 "Networked targeting from tactical droids sharpens every battery's aim."
 cis_production:0 "Increased Production Efficiency"
 cis_production_desc:0 "Self-propelled artillery comes off the same lines as the battle droids."
 cis_protodeka:0 "Protodeka Mark II"
 cis_protodeka_desc:0 "Colossal artillery droids: the Confederacy's last word in siege warfare."
 cis_hag:0 "Heavy Artillery Gun Tank"
 cis_hag_desc:0 "The HAG: a tracked gun platform built to kill walkers at range."
 cis_long_range:0 "Long-Range Weaponry"
 cis_long_range_desc:0 "Longer barrels and better optics let gun tanks fire first."
 cis_repulsor_1:0 "Repulsorlift Engines I"
 cis_repulsor_1_desc:0 "Stronger repulsorlift generators: faster tanks and a higher engine upgrade limit."
 cis_repulsor_2:0 "Repulsorlift Engines II"
 cis_repulsor_2_desc:0 "Stronger repulsorlift generators: faster tanks and a higher engine upgrade limit."
 cis_repulsor_3:0 "Repulsorlift Engines III"
 cis_repulsor_3_desc:0 "Stronger repulsorlift generators: faster tanks and a higher engine upgrade limit."
 cis_repulsor_4:0 "Repulsorlift Engines IV"
 cis_repulsor_4_desc:0 "Stronger repulsorlift generators: faster tanks and a higher engine upgrade limit."
 cis_foundry_1:0 "Foundry Automation I"
 cis_foundry_1_desc:0 "Automated foundry worlds stamp out droid tanks faster and cheaper with every generation."
 cis_foundry_2:0 "Foundry Automation II"
 cis_foundry_2_desc:0 "Automated foundry worlds stamp out droid tanks faster and cheaper with every generation."
 cis_foundry_3:0 "Foundry Automation III"
 cis_foundry_3_desc:0 "Automated foundry worlds stamp out droid tanks faster and cheaper with every generation."
 HOD_droid_foundries_1:0 "Droid Foundries"
 HOD_droid_foundries_1_desc:0 "The Confederacy's foundry worlds build droid tanks by the thousand, at a fraction of what a walker costs the Republic."
 HOD_droid_foundries_1_tt:0 "Gain the national spirit §YDroid Foundries§!: armour costs §G-10%§!."
 HOD_droid_foundries_2:0 "Automated Foundry Worlds"
 HOD_droid_foundries_2_desc:0 "The Confederacy's foundry worlds build droid tanks by the thousand, at a fraction of what a walker costs the Republic."
 HOD_droid_foundries_2_tt:0 "Gain the national spirit §YAutomated Foundry Worlds§!: armour costs §G-20%§!."
 HOD_droid_foundries_3:0 "Total Foundry Automation"
 HOD_droid_foundries_3_desc:0 "The Confederacy's foundry worlds build droid tanks by the thousand, at a fraction of what a walker costs the Republic."
 HOD_droid_foundries_3_tt:0 "Gain the national spirit §YTotal Foundry Automation§!: armour costs §G-30%§!."

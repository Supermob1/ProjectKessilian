l_english:
 # base_building_skin.py: Star Wars names for the vanilla buildings
 infrastructure:0 "Planetary Infrastructure"
 infrastructure_plural:0 "Planetary Infrastructure"
 infrastructure_desc:0 "Landing fields, transit tubes and repulsor roads. Better infrastructure moves troops and supply faster and raises resource output."
 arms_factory:0 "Droid and Vehicle Foundry"
 arms_factory_plural:0 "Droid and Vehicle Foundries"
 arms_factory_desc:0 "Foundries that build blasters, droids, walkers and starfighters. Can be converted to civilian fabrication if needed."
 industrial_complex:0 "Civilian Fabricator"
 industrial_complex_plural:0 "Civilian Fabricators"
 industrial_complex_desc:0 "Fabrication plants for civilian goods and for the construction of new buildings. Can be converted to military production if needed."
 air_base:0 "Landing Platform"
 air_base_plural:0 "Landing Platforms"
 air_base_desc:0 "Pads and hangars that base starfighters, bombers and gunships."
 supply_node:0 "Supply Depot"
 supply_node_plural:0 "Supply Depots"
 supply_node_desc:0 "A depot along the supply lines where the armies draw their supply."
 rail_way:0 "Repulsor Freight Line"
 rail_way_plural:0 "Repulsor Freight Lines"
 rail_way_desc:0 "Repulsor cargo lines that carry supply from the depots to the front."
 naval_facility:0 "Starship Research Station"
 naval_facility_plural:0 "Starship Research Stations"
 naval_facility_desc:0 "A research station where new starship designs are developed."
 naval_base:0 "Space Station"
 naval_base_plural:0 "Space Stations"
 naval_base_desc:0 "Orbital stations that supply and repair the fleets and extend their range. Allow supply from orbit and the export of resources."
 bunker:0 "Ferrocrete Bunker"
 bunker_plural:0 "Ferrocrete Bunkers"
 bunker_desc:0 "Ferrocrete strongpoints that make the province much harder to take."
 coastal_bunker:0 "Turbolaser Battery"
 coastal_bunker_plural:0 "Turbolaser Batteries"
 coastal_bunker_desc:0 "Turbolaser towers that cover the landing zones against assault from orbit."
 stronghold_network:0 "Shielded Stronghold"
 stronghold_network_plural:0 "Shielded Strongholds"
 stronghold_network_desc:0 "A network of shielded strongpoints, bunkers and tunnels across the state."
 dockyard:0 "Orbital Shipyard"
 dockyard_plural:0 "Orbital Shipyards"
 dockyard_desc:0 "Shipyards in orbit that build the fleet's starships."
 anti_air_building:0 "Anti-Starfighter Battery"
 anti_air_building_plural:0 "Anti-Starfighter Batteries"
 anti_air_building_desc:0 "Flak and laser batteries that protect the state from bombers and shoot down starfighters."
 synthetic_refinery:0 "Fuel Synthesizer"
 synthetic_refinery_plural:0 "Fuel Synthesizers"
 synthetic_refinery_desc:0 "Synthesizes fuel and some doonium from local resources."
 fuel_silo:0 "Fuel Depot"
 fuel_silo_plural:0 "Fuel Depots"
 fuel_silo_desc:0 "Tank farms that let the nation stockpile more fuel."
 radar_station:0 "Sensor Array"
 radar_station_plural:0 "Sensor Arrays"
 radar_station_desc:0 "Sensor arrays that track ships, starfighters and vehicles in range."
 mega_gun_emplacement:0 "Hypervelocity Gun"
 mega_gun_emplacement_plural:0 "Hypervelocity Guns"
 mega_gun_emplacement_desc:0 "A giant hypervelocity cannon that can strike targets far beyond the front."
 naval_supply_hub:0 "Fleet Supply Hub"
 naval_supply_hub_plural:0 "Fleet Supply Hubs"
 naval_supply_hub_desc:0 "An orbital hub that keeps the fleets supplied."
 naval_headquarters:0 "Fleet Command Station"
 naval_headquarters_plural:0 "Fleet Command Stations"
 naval_headquarters_desc:0 "The station from which a sector fleet is commanded."
 nuclear_reactor:0 "Hypermatter Reactor"
 nuclear_reactor_plural:0 "Hypermatter Reactors"
 nuclear_reactor_desc:0 "A hypermatter reactor for the research and production of superweapons."
 nuclear_reactor_heavy_water:0 "Hypermatter Reactor"
 nuclear_reactor_heavy_water_plural:0 "Hypermatter Reactors"
 nuclear_reactor_heavy_water_desc:0 "A hypermatter reactor for the research and production of superweapons."
 commercial_nuclear_reactor:0 "Hypermatter Power Plant"
 commercial_nuclear_reactor_plural:0 "Hypermatter Power Plants"
 commercial_nuclear_reactor_desc:0 "A hypermatter plant that powers the planet's industry and speeds up construction."
 nuclear_facility:0 "Hypermatter Research Facility"
 nuclear_facility_plural:0 "Hypermatter Research Facilities"
 nuclear_facility_desc:0 "A research facility for hypermatter and superweapon projects."
 air_facility:0 "Starfighter Research Facility"
 air_facility_plural:0 "Starfighter Research Facilities"
 air_facility_desc:0 "A research facility for starfighters, bombers and gunships."
 land_facility:0 "Ground Forces Proving Grounds"
 land_facility_plural:0 "Ground Forces Proving Grounds"
 land_facility_desc:0 "Proving grounds where new walkers, tanks and weapons are tested."
 energy_infrastructure:0 "Reinforced Power Grid"
 energy_infrastructure_plural:0 "Reinforced Power Grids"
 energy_infrastructure_desc:0 "Redundant power lines and generators that keep the factories running when the grid is hit."
 industrial_infrastructure:0 "Industrial Power Grid"
 industrial_infrastructure_plural:0 "Industrial Power Grids"
 industrial_infrastructure_desc:0 "High-capacity power lines that let the planet's industry run at full output."

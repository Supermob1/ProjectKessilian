 IBC_motorized_equipment_1:0 "STAP Speeder Column"
 IBC_motorized_equipment_1_short:0 "STAP"
 IBC_motorized_equipment_1_desc:0 "The Armored Assault Tank was the workhorse of Separatist armor—durable, heavily armed, and versatile across terrain. It formed the backbone of CIS armored units."
 IBC_mechanized_equipment_1:0 "MTT Troop Transport"
 IBC_mechanized_equipment_1_short:0 "MTT"
 IBC_mechanized_equipment_1_desc:0 "The Multi-Troop Transport was a massive repulsorlift vehicle designed to deliver platoons of B1 battle droids directly into combat. Its armored hull provided cover until deployment."
 IBC_mechanized_equipment_2:0 "Hailfire Droid"
 IBC_mechanized_equipment_2_short:0 "Hailfire"
 IBC_mechanized_equipment_2_desc:0 "A missile-launching platform with distinctive hoop-wheels. Hailfires excelled at long-range barrages against armor and fortifications, before quickly retreating."
 IBC_mechanized_equipment_3:0 "Octuptarra Tri-Droid"
 IBC_mechanized_equipment_3_short:0 "Tri-Droid"
 IBC_mechanized_equipment_3_desc:0 "Towering artillery droids equipped with heavy laser cannons and anti-air weapons. Their tall frames and multi-role firepower made them CIS late-war battlefield anchors."
 IBC_motorized_rocket_equipment_1:0 "NR-N99 Persuader"
 IBC_motorized_rocket_equipment_1_short:0 "Persuader"
 IBC_motorized_rocket_equipment_1_desc:0 "A snail-like tank droid mounting missile racks and heavy blasters. Designed by the Corporate Alliance, it specialized in heavy bombardments and urban suppression."
 IBC_gw_armored_car_equipment:0 "DSD1 Dwarf Spider Droid"
 IBC_gw_armored_car_equipment_short:0 "Dwarf Spider"
 IBC_gw_armored_car_equipment_desc:0 "Compact four-legged walkers with heavy anti-infantry and anti-vehicle blasters. Deployed en masse to support heavier vehicles and hold difficult ground."
 IBC_armored_car_equipment_1:0 "OG-9 Homing Spider Droid"
 IBC_armored_car_equipment_1_short:0 "Spider Droid"
 IBC_armored_car_equipment_1_desc:0 "Large artillery walkers with long-range beam weapons. Their powerful sensors and stabilizers allowed them to deliver precise fire support across wide fields."
 IBC_armored_car_equipment_2:0 "LM-432 Crab Droid"
 IBC_armored_car_equipment_2_short:0 "Crab Droid"
 IBC_armored_car_equipment_2_desc:0 "Multi-legged heavy assault droids, equally adept at clambering over terrain and engaging armor with their cannons. A feared sight during sieges and coastal campaigns."
 IBC_amphibious_mechanized_equipment_1:0 "HMP Droid Gunship"
 IBC_amphibious_mechanized_equipment_1_short:0 "HMP"
 IBC_amphibious_mechanized_equipment_1_desc:0 "Heavily armed rotary-wing droid craft that deployed troops while providing suppressive fire. Rugged and versatile, they could deliver rapid aerial assaults."
 IBC_amphibious_mechanized_equipment_2:0 "C-9979 Landing Craft"
 IBC_amphibious_mechanized_equipment_2_short:0 "C-9979"
 IBC_amphibious_mechanized_equipment_2_desc:0 "Massive starships designed to land armies and vehicles directly on planetary surfaces. These automated craft formed the backbone of large-scale planetary invasions."

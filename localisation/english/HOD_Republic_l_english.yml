 anaxes_catastrophe.1.t:0 "The Shattered Remains of Anaxes"
 anaxes_catastrophe.1.d:0 "Orbiting sensors have detected a vast debris field where the planet Anaxes once stood—titanic chunks of rock, drifting starship wreckage, and ionized asteroid fragments. It appears the world was pulverized by an immense force, leaving only ruin. Scholars and admirals alike scramble to uncover whether this was the result of a massive hyperspace rupture, a clandestine superweapon, a catastrophic reactor failure at the planetary shield generator, or something more alien in origin."
 anaxes_catastrophe.1.a:0 "Dispatch salvage and research teams."


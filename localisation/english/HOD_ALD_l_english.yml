l_english:
 # HOD: Alderaan
 ALD:0 "Alderaan"
 ALD_DEF:0 "the Kingdom of Alderaan"
 ALD_ADJ:0 "Alderaanian"

 ALD_bail_organa_desc:0 "Bail Prestor Organa, Viceroy and First Chairman of Alderaan, and its senator on Coruscant. Married to Queen Breha, he speaks for the Core's old ideals of law, learning and peace, and is one of the loudest voices in the Senate against building an army for the Republic."

 ALD_alderaanian_pacifism:0 "Alderaanian Pacifism"
 ALD_alderaanian_pacifism_desc:0 "Generations ago Alderaan destroyed its weapons and swore never to make war again. Its people would sooner argue in the Senate than fight in the field, and its army is little more than a ceremonial guard."
 ALD_royal_house_of_organa:0 "The Royal House of Organa"
 ALD_royal_house_of_organa_desc:0 "Queen Breha reigns and Viceroy Bail Organa governs. The House of Organa is loved across the planet, and its word carries the weight of centuries."
 ALD_cultural_jewel_of_the_core:0 "Jewel of the Core"
 ALD_cultural_jewel_of_the_core_desc:0 "Aldera's universities, galleries and libraries draw scholars from across the galaxy. No world in the Core is held up more often as the model of what the Republic should be."

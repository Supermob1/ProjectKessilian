l_english:
 # HOD duels — automatic battlefield duels (events/HOD_duel_events.txt). The style texts below (hod_duel_vic_*,
 # hod_duel_def_*, hod_duel_stale_*) are picked from the fighter's lightsaber form / Force side / fighting style.
 hod_duel.1.t:0 "Duel Won — [ROOT.GetName] Bests [hod_duel_loser.GetName]"
 hod_duel.1.a:0 "[hod_duel_loser.GetName] is our prisoner."
 hod_duel.1.b:0 "[hod_duel_loser.GetName] withdraws, wounded."
 hod_duel.1.captured_tt:0 "§Y[hod_duel_loser.GetName]§! has been §Rcaptured§! and is held in one of our worlds.\n§Y[ROOT.GetName]§! gains duel experience and §GDuel Victor§! for 90 days."
 hod_duel.1.wounded_tt:0 "§Y[hod_duel_loser.GetName]§! is §Rwounded§! and pulls back.\n§Y[ROOT.GetName]§! gains duel experience and §GDuel Victor§! for 90 days."
 hod_duel.2.t:0 "Duel Lost — [ROOT.GetName] Falls Back Before [hod_duel_winner.GetName]"
 hod_duel.2.a:0 "We will get [ROOT.GetHerHim] back."
 hod_duel.2.b:0 "[ROOT.GetSheHeCap] will recover."
 hod_duel.2.captured_tt:0 "§Y[ROOT.GetName]§! has been §Rcaptured§! by [hod_duel_winner.GetName]'s forces. Retake the world where [ROOT.GetSheHe] is held to free [ROOT.GetHerHim]."
 hod_duel.2.wounded_tt:0 "§Y[ROOT.GetName]§! is §Rwounded§! but escapes, and learns from the defeat."
 hod_duel.3.t:0 "Duel Unresolved — [duel_char1_token.GetName] and [duel_char2_token.GetName]"
 hod_duel.3.a:0 "This isn't over."
 hod_duel.3.tt:0 "Both fighters are §Ylightly wounded§! (20 days) and gain duel experience."
 hod_duel_vic_vaapad:0 "There is nothing controlled about Vaapad — that is precisely the point. [ROOT.GetName] opened the gate between [ROOT.GetHerselfHimself] and the dark side's current, and it poured through the fight like a river through a broken dam. [ROOT.GetHerHisCap] opponent's aggression became fuel; their strikes became momentum; their fury became [ROOT.GetHerHis], amplified and redirected. To face Vaapad is to face your own attack returned with interest. They had no answer for that. No one does."
 hod_duel_vic_soresu:0 "[ROOT.GetName] gave them nothing. Every strike was met, redirected, negated with less movement than they used to throw it. Their attacks came faster, harder, more desperate — and every escalation cost them more than it cost [ROOT.GetHerHim]. Form III does not defeat the enemy. It waits, with complete patience, until the enemy defeats themselves. Today they cooperated fully with that arrangement."
 hod_duel_vic_makashi:0 "The opening existed for exactly as long as it took to exploit it. Makashi builds understanding before it builds pressure — by the time [ROOT.GetName] applied the decisive touch, [ROOT.GetSheHe] had already mapped the full architecture of [ROOT.GetHerHis] opponent's defense and identified the one place they could not cover in time. They fought well. They fought someone who had already seen how it ended."
 hod_duel_vic_ataru:0 "[ROOT.GetName] did not give them time to think. Form IV at full expression is overwhelming precisely because it never stops — each strike already transitioning into the next before the previous one resolves. [ROOT.GetHerHisCap] opponent was reacting to what had already happened. By the time they found their footing, the fight was over, and they were the last to realize it."
 hod_duel_vic_djem_so:0 "Every time they hit [ROOT.GetHerHim], they paid for it. Djem So does not merely endure — it converts. Their aggression fed [ROOT.GetName]'s counter-strikes; their power became [ROOT.GetHerHis], doubled and returned. The harder they pushed, the harder they fell. At some point they understood this and stopped pushing. By then it was too late to try something else."
 hod_duel_vic_shien:0 "[ROOT.GetName] did not fight them. [ROOT.GetSheHeCap] let them fight [ROOT.GetHerHim], and turned every strike into a setup. Shien is built for exactly this — channeling aggressive opponents into positions of their own construction. They pressed forward; [ROOT.GetSheHe] redirected. They attacked; [ROOT.GetSheHe] answered with their own momentum behind [ROOT.GetHerHis] blade. The ending was built into their opening move. They just did not read it there."
 hod_duel_vic_jar_kai:0 "Two weapons, two conversations, and [ROOT.GetName] was the only one who could follow both simultaneously. Every time [ROOT.GetHerHis] opponent found an answer to one line of attack, the other found them. Every time they defended one angle, the second pressed. The geometry of this fight belonged entirely to [ROOT.GetHerHim], and they spent the duel trying to navigate a map they could never fully read."
 hod_duel_vic_niman:0 "There was no dramatic turning point — just a long, accumulating ledger of correct decisions. Niman synthesizes and wastes nothing. They were good, and they could not keep pace with a fighter who was also good in every form they tried to fall back on. The margin of [ROOT.GetName]'s advantage was small. It was also completely consistent from the first exchange to the last."
 hod_duel_vic_droid:0 "The calculation was complete before the first strike landed. [ROOT.GetName] cross-referenced [ROOT.GetHerHis] opponent's stance, weapon grip, and movement patterns against thousands of documented combat sequences and derived the probable outcome set within the first three exchanges. What appeared to them as instinctive mastery was the execution of a plan that had already determined the result. The duel was decided before it began. The remainder was confirmation."
 hod_duel_vic_mando:0 "They trained for a duel between two opponents who would face each other honestly. [ROOT.GetName] arrived with a jetpack, a blaster, a blade, and three thousand years of Mandalorian warrior culture applied simultaneously. They had no doctrine prepared for all of that at once — and that is precisely why it works. Mandalore has always won by refusing to fight the fight the enemy prepared for."
 hod_duel_vic_blaster:0 "Distance is a weapon when you know how to control it, and [ROOT.GetName] did not let them close. The winning shot was not a dramatic moment — it was the inevitable consequence of superior positioning, patience, and the willingness to wait for the exact opening the geometry produced. They had more courage than they had reach. In the end, reach was the variable that mattered."
 hod_duel_vic_dirty:0 "They expected a duel. They trained for a duel. What they got was something that had the shape of a duel and none of the courtesy. The specific thing that finished it is the kind of thing that does not get taught — [ROOT.GetName] earned it through fights exactly like this one. It worked. That is the only criterion that has ever mattered."
 hod_duel_vic_vibroblade:0 "Vibroblade technique at this level is not aggressive — it is absolute. [ROOT.GetName] gave them nothing to exploit, nothing to react to except relentless technical pressure applied without ego or haste. At some point they stopped responding and started hoping. Hope does not block. It never has."
 hod_duel_vic_cyborg:0 "By the time they had identified the attack pattern, it had already resolved and the next was in progress. The gap between a biological response time and an optimized mechanical one is not large — but applied consistently across the full duration of a fight, it compounds. [ROOT.GetName]'s advantage was structural. The outcome was not seriously in question."
 hod_duel_vic_dark_side:0 "The dark side does not calculate. It does not hedge. [ROOT.GetName] opened [ROOT.GetHerselfHimself] to it entirely and let it direct every strike, every counter, every breath of the fight. [ROOT.GetHerHisCap] opponent may have had technique. They may have had training. Neither is sufficient when what stands across from them is not a person deciding how to fight, but a force of nature given a blade and pointed at them."
 hod_duel_vic_padawan:0 "It should not have gone [ROOT.GetHerHis] way — experience favored them, conditioning favored them, years of refinement favored them. What [ROOT.GetName] had was the recklessness of a fighter who had nothing to prove yet and nothing to lose, and that made [ROOT.GetHerHim] unpredictable in ways no amount of preparation answers. [ROOT.GetSheHeCap] won. Process what that means later. For now: [ROOT.GetSheHe] won."
 hod_duel_vic_force_generic:0 "The Force moved through the fight in ways that bypass conscious decision. [ROOT.GetName] was not thinking about what to do next — [ROOT.GetSheHe] was already doing it, each action arriving before the thought that would have summoned it. The connection held when it needed to. The opening appeared, [ROOT.GetSheHe] was already moving to answer it, and then it was over."
 hod_duel_vic_warrior:0 "No single moment decided it. [ROOT.GetName] gave ground where giving ground cost nothing and held where holding mattered, and [ROOT.GetSheHe] kept that discipline longer than they did. The fight was won in the small details — every guard, every step, every wasted motion of theirs that [ROOT.GetSheHe] did not waste. It accumulated. In the end, that was enough."
 hod_duel_def_padawan:0 "[ROOT.GetName] was not ready, and the fight confirmed it without mercy. There were moments [ROOT.GetSheHe] nearly had them — one extension slightly too wide, one counter almost in time — but nearly is a distance wider than a lightsaber blade. The defeat belongs to [ROOT.GetHerHim] entirely. So does the lesson inside it. Find the lesson. That is the only part of this that is useful."
 hod_duel_def_acolyte:0 "Overconfidence was the wound that opened before the first blow landed. The dark side rewards aggression, but it does not protect [ROOT.GetHerHim] from the consequences of aggression badly timed and worse positioned. [ROOT.GetName] hit harder than they expected and still lost, which means power was never the problem here. Judgment was. Fix it."
 hod_duel_def_champion:0 "The dark side does not accept this quietly, and neither should [ROOT.GetName]. Let the burn of it sharpen into something useful — an edge [ROOT.GetSheHe] did not have before the fight, purchased at a price [ROOT.GetSheHe] did not plan to pay. Take what was paid for. Make it count. The next time [ROOT.GetSheHe] stands across from someone who outmatched [ROOT.GetHerHim] today, it will not be the same fight."
 hod_duel_def_master:0 "Rare. Genuinely rare. [ROOT.GetName] is not accustomed to this — the disengagement that was not a choice, the retreat that means something. Something today exceeded [ROOT.GetHerHis] preparation, and that demands honest accounting rather than rationalization. The how of it will take time to fully understand. Begin now."
 hod_duel_def_cyborg:0 "The simulation failed. A variable was miscalculated — opponent deviation from predicted behavior, an environmental factor outside normal parameters, a reaction-time assumption that proved incorrect. [ROOT.GetName]'s systems are intact. The engagement data has been recorded and integrated. The failure mode is now documented. It will not recur in the same form."
 hod_duel_def_mando:0 "Mandalorian warriors do not process defeat through shame. They process it through study. [ROOT.GetName] was beaten by something that worked. Understand exactly what it was and exactly why it worked. Do not allow it to work again. That is the whole of what this defeat requires."
 hod_duel_def_force_generic:0 "The Force offered what it could, and it was not enough today. Either the connection was absent when it should have been present, or it was present and [ROOT.GetHerHis] opponent's advantage outweighed it regardless. The question is not whether [ROOT.GetName] failed — the question is what the failure reveals. Start there."
 hod_duel_def_warrior:0 "[ROOT.GetName] fought as well as [ROOT.GetSheHe] had, and it was not enough. That is the full account. No technique failed catastrophically, no single decision swung it irreversibly — [ROOT.GetSheHe] was outmatched today by a margin that is uncomfortable to acknowledge. Let the discomfort do its work. The next engagement is already being prepared for. That is what soldiers do."
 hod_duel_stale_soresu:0 "They could not find a way through. Nothing they attempted found a gap in [ROOT.GetName]'s defense — but a perfect defense does not win a fight, and after the full duration of that exchange both sides arrived at the same calculation simultaneously. [ROOT.GetSheHeCap] remains unbeaten in the truest sense. The enemy simply did not lose badly enough to justify the cost of continuing."
 hod_duel_stale_mando:0 "Mandalorian discipline includes knowing when an engagement has run past its useful point. [ROOT.GetName] made that call. The fight was even, no clean resolution was available without unacceptable risk, and [ROOT.GetSheHe] disengaged without sacrificing the initiative. Retreat that is chosen is not defeat. [ROOT.GetSheHeCap] chose this. There is a difference."
 hod_duel_stale_vibroblade:0 "Mutual defense at this level becomes a conversation with no resolution built into its grammar. Every attack was answered, every answer anticipated, every manufactured opening closed before it could be exploited. [ROOT.GetName] and [ROOT.GetHerHis] opponent are well-matched — more closely than either of them expected. That information is worth more than a narrow victory would have been."
 hod_duel_stale_blaster:0 "Neither could establish the distance the fight needed. Every time [ROOT.GetName] found the range that worked, they adjusted. Every time they pushed to close, [ROOT.GetSheHe] widened it again. The fight ground along an unresolvable middle ground until neither side had the margin to break the standoff, and continuing served nothing. [ROOT.GetSheHeCap] was never in real danger. Neither were they."
 hod_duel_stale_master:0 "Wisdom sometimes looks like indecision from the outside. [ROOT.GetName] read the engagement clearly enough to know that forcing a resolution would cost more than victory was worth today. The Force does not demand victory at any price. It demanded the longer calculation. [ROOT.GetSheHeCap] made it. The result is inconclusive. That is not the same as a loss."
 hod_duel_stale_dark_side:0 "The fury was present. The power was there. The opportunity simply never opened into something that could be closed cleanly, and the dark side does not reward force spent on nothing. [ROOT.GetName] broke off before frustration became the kind of mistake that matters. The account remains open. There is a certain satisfaction in that — the fight is not finished. It is merely postponed."
 hod_duel_stale_force_generic:0 "The Force offered clarity on what the fight was, not on how it needed to end. Both [ROOT.GetName] and [ROOT.GetHerHis] opponent were too capable for a cheap resolution, and neither was willing to take the risk that a forced conclusion would have required. [ROOT.GetSheHeCap] disengaged. The question of who is better remains genuinely open — and that, after everything, is its own kind of answer."
 hod_duel_stale_warrior:0 "Neither [ROOT.GetName] nor [ROOT.GetHerHis] opponent could end it, and both of them knew it. There is something maddening about a truly even match — the knowledge that the person across from you is exactly as capable of winning as you are. They parted. The question remains open. It will be answered eventually, and both of them are already thinking about when."

l_english:
 ### Republic Military Tech Tree — Folder
 republic_folder:0 "Republic Military"

 ### ── Main Clone Equipment Line ──
 old_republic_equipment:0 "Judicial Forces Equipment"
 old_republic_equipment_desc:0 "Before the war the Republic has no army, only the Judicial Forces and planetary security. Their blasters and light armour are all the Senate can field."
 kamino_standardization:0 "Kamino Standardization"
 kamino_standardization_desc:0 "Every clone is grown, trained and equipped to one template. Standard batches leave Tipoca City on a fixed schedule, ready to fight the day they arrive."
 phase_I_equipment:0 "Phase I Clone Armour"
 phase_I_equipment_desc:0 "Sealed plastoid armour and DC-15 blasters for the first clone legions, built to fight in vacuum, toxic air and the dust of Geonosis."
 equipment_refinements:0 "Field Refinements"
 equipment_refinements_desc:0 "Lessons from Christophsis and Ryloth: lighter plates, better comlinks, and troopers who paint and modify their own kit."
 phase_II_equipment:0 "Phase II Clone Armour"
 phase_II_equipment_desc:0 "Lighter, stronger and modular, the Phase II suit replaces the first-generation armour across the Grand Army of the Republic."
 enhanced_armor_systems:0 "Enhanced Armour Systems"
 enhanced_armor_systems_desc:0 "Reinforced plating and improved filtration keep clone troopers fighting in the worst theatres of the Outer Rim Sieges."
 Imperial_equipment:0 "Stormtrooper Equipment"
 Imperial_equipment_desc:0 "The clone legions are reorganised as the Emperor's stormtroopers, in new white armour for a new order."

 ### ── ARC Commando Line ──
 arc_commandos:0 "ARC Troopers"
 arc_commandos_desc:0 "Advanced Recon Commandos: clones grown with fewer behavioural limits and trained for independent action where the fighting is hardest."
 advanced_training_programs:0 "Mandalorian Training Cadre"
 advanced_training_programs_desc:0 "Jango Fett's Cuy'val Dar instructors pass their hard-won skills to the commando companies of Kamino."
 kaminoan_genetic_conditioning:0 "Growth Acceleration"
 kaminoan_genetic_conditioning_desc:0 "Refined growth acceleration and flash-training cut the time from cloning tube to battlefield."
 imperial_commandos:0 "Imperial Commandos"
 imperial_commandos_desc:0 "The surviving commando companies become the Empire's special forces, sent where stormtroopers cannot go."

 ### ── LAAT Air Cavalry Line ──
 laat_infantry:0 "LAAT/i Gunships"
 laat_infantry_desc:0 "Low Altitude Assault Transports carry clone platoons straight into battle, as they did at Geonosis."
 air_cavalry_doctrine:0 "Air Cavalry Doctrine"
 air_cavalry_doctrine_desc:0 "Gunship crews and infantry train together for rapid insertions behind droid lines."
 improved_dropship_loadouts:0 "Improved Gunship Loadouts"
 improved_dropship_loadouts_desc:0 "Mass-driver missiles and composite-beam turrets turn the LAAT from a transport into a flying fortress."
 maat_infantry:0 "MAAT Gunships"
 maat_infantry_desc:0 "The Mobile Assault Armoured Transport brings heavier armour and firepower to clone air assaults."

 ### ── Ion Disruptor Line (anti-droid) ──
 ion_disruptors:0 "Ion Disruptors"
 ion_disruptors_desc:0 "Handheld ion blasters and droid-poppers issued to clone infantry disable droid circuitry, countering the mechanized armies of the Confederacy."
 ion_disruptors_2:0 "Improved Ion Disruptors"
 ion_disruptors_2_desc:0 "Refined ion weapon loadouts for line infantry and ARC troopers tear through droid plating and shielding."
 ion_disruptors_3:0 "Advanced Ion Disruptors"
 ion_disruptors_3_desc:0 "The pinnacle of anti-droid weaponry: integrated ion munitions capable of dropping even heavy combat automata."

